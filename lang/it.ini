sounds.events.psvoice1=Dottor Vandervoort, si presenti in sala dissezione. Abbiamo un’emorragia da trattare.
sounds.events.psvoice10j=Ricordate: il progresso viene prima della sicurezza.
sounds.events.psvoice11j=Attenzione: c’è un intruso al livello 3. È armato ed estremamente pericoloso. Non avvicinatevi a quest’uomo per nessun motivo. Anzi, correte il più in fretta possibile nella direzione opposta. Grazie e buona giornata.
sounds.events.psvoice2l=Dottor Kohler, si presenti alla reception. Dottor Kohler, è atteso alla reception. Il suo ragazzo la sta aspettando.
