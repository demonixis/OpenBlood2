[objectives]
heading=OBIETTIVI
empty=Nessun obiettivo attivo
authored.876b96893e6e534e.title=Vattene da qui, dannazione!
authored.876b96893e6e534e.text=Ce l’hai fatta, la nave è spacciata. Ora esci da qui prima che ti trascini con sé!
authored.1655b5465594c073.title=Obiettivo 1
authored.1655b5465594c073.text=Ophelia e Gideon sono scomparsi in una fenditura. Forse sono qui vicino, ma chi può dirlo? Fai solo attenzione a non diventare la prossima vittima sacrificale.
authored.fcfc192a55159c96.title=Obiettivo 1
authored.fcfc192a55159c96.text=Ora dovresti poter entrare nel reparto ricerca e sviluppo. Vai a dare un’occhiata e vedi come si sviluppa la faccenda.
authored.f509240c18010417.title=Obiettivo 1
authored.f509240c18010417.text=Ancora questo posto?! Beh, magari Gideon è qui intorno. Gli ascensori saranno stati la sua via di fuga più comoda. Che aspetti? Vai a sistemarlo.
authored.c9a269968f66b5ac.title=Arena
authored.c9a269968f66b5ac.text=Trova il portale per|l’Antico.
authored.e395d02eb7f66023.title=Obiettivo 1
authored.e395d02eb7f66023.text=|Sconfiggi l’Antico|e riporta l’ordine|nell’universo.
authored.1b23dee31a697548.title=Corri e spara
authored.1b23dee31a697548.text=Apriti la strada a colpi d’arma da fuoco e trova qualche pulsante da premere!
authored.04dfc168e9f20485.title=Abbassati e striscia
authored.04dfc168e9f20485.text=Ora puoi attraversare il nastro trasportatore strisciando senza rischi.
authored.e8938b9bf78b5c45.title=Caccia e uccidi
authored.e8938b9bf78b5c45.text=Devi trovare il modo di raggiungere il piano successivo.
authored.36e16d96eef3f3f2.title=Ascensori inutili
authored.36e16d96eef3f3f2.text=Pare proprio che sia il momento di trovare un’altra strada!
authored.74ccd748f4e969fb.title=Usa la CRU!
authored.74ccd748f4e969fb.text=La tessera magnetica della CRU ti permetterà di attivarla.
authored.b99fc6253496e264.title=Ci siamo quasi...
authored.b99fc6253496e264.text=Qui vicino dovrebbe esserci un ascensore diretto al tetto.

[promotions]
bloodbath_title=BAGNO DI SANGUE
bloodbath_tagline=SCONTRI FURIOSI FINO A SEDICI GIOCATORI!
bloodbath_soon=IN ARRIVO !!!
blood_brother_title=FRATELLI DI SANGUE
blood_brother_body=Scegli il tuo Prescelto e scatenati in cooperativa fino a quattro giocatori!
blood_feud_title=FAIDA DI SANGUE
blood_feud_body=Azione esplosiva in arena fino a 16 giocatori! Scegli la squadra e abbatti gli avversari.
info_title=BOCCONI SCELTI
info_characters=Quattro personaggi personalizzabili per una carneficina senza freni!
info_weapons=Venti armi per vivere e morire! Fai strage con la pistola lanciarazzi e la bambola vudù, o scatena il caos con il Raggio della morte e il Generatore di singolarità!
info_levels=Oltre trenta livelli sanguinosi per giocatore singolo. La cooperativa è in arrivo!
info_maps=Oltre dieci arene frenetiche per il Bagno di sangue. La Faida di sangue è in arrivo!
info_network=Sfrutta al massimo il multigiocatore con il pieno supporto a GameSpy e Heat.
info_editor=Editor di livelli e codice sorgente gratuiti per gli utenti registrati. Scatena la fantasia con le mod!
info_engine=Blood 2 The Chosen usa LithTech, il motore 3D di Monolith con luci dinamiche, effetti spettacolari e ampio supporto hardware 3D!
modes_title=AZIONE IN SOLITARIA
modes_caleb=Caleb fa a pezzi la Cabalco, un cadavere dopo l’altro, con l’aiuto degli altri Prescelti nei filmati.
modes_chosen_title=I PRESCELTI
modes_chosen=Scegli il tuo Prescelto preferito e lanciati nella carneficina! Salta i filmati e buttati nella mischia!

[dialogue]
4prophet1=Io resto.
1acaleb1=Fatevi sotto!
1acaleb2=Capolinea.
2caleb1=Hai appena fatto il tuo secondo errore. Sei rimasto.
2caleb2=Lasciarmi in vita.
3caleb1=... Gabriel?
3caleb2=Vallo a dire a qualcuno a cui importa.
3caleb3=Le cose sono cambiate. Ma non c’è bisogno che te lo dica io.
3caleb4=Non sei il mio tipo.
4caleb1=A te la scelta. Se te ne vai adesso, vivi. Se resti, muori.
4caleb2=Allora morirai.
bmpr1caleb1=Odio volare.
5caleb1=Potrebbe finire male.
6caleb1=Questi non sono della Cabala.
6caleb2=Sono qualcos’altro.
6caleb3=Ho un treno da prendere. Ci si vede.
8caleb1=Stai scherzando.
7caleb1=Non ne hai idea.
7caleb2=Puoi dirlo forte, mi sto appena scaldando.
7caleb3=Sono la negazione fatta persona. Non affronterò un bel niente.
7caleb4=Non mi serve una balia.
9caleb1=Oh, farò molto più di questo.
9caleb2=Forte.
9caleb3=Che bruci pure. Tanto questo posto non mi è mai piaciuto.
9caleb4=Pizza.
9caleb5=Spogliarello a domicilio.
11caleb1=Ho sempre sognato di vederti tutta legata così.
11caleb2=Dammi un bacetto, bella.
11caleb3=Oh, ancora tu. Che ne dici di tornare tra un paio di minuti?
11caleb4=Ophelia! Va bene, basta così. È ora che tu muoia!
13caleb1=Quel che ti resta da vivere si misura in secondi, pivello.
14caleb1=Allora continuerò a prenderti a calci in culo.
14caleb2=Mai detto di essere intelligente.
15caleb1=Vai pure. Io guardo.
15caleb2=Balliamo, uomo nero.
16caleb1=Quando arrivi all’inferno, di’ che ti mando io. Ti faranno lo sconto.
16caleb2=Rilassati, sei morto.
16caleb3=Troppo tardi, sei già morto.
16caleb4=La vita non è giusta, e nemmeno la morte. Abituatici.
16caleb5=Grazie e buonanotte.
17caleb1=Macché.
17caleb2=Finirai per ferire i miei sentimenti.
17caleb3=Allora?
17caleb4=Basta parlare. Combattiamo.
19caleb1=Ma salve, signorino elegante. Perdonami se non ti stringo la mano.
20caleb1=Non ci capisco niente di quella roba.
20caleb2=Che fai, mi sculacci?
20caleb3=E adesso sta’ zitto. Mi devo concentrare.
20caleb4=Una specie di clistere spirituale. In senso buono.
3gab1=Che diavolo è questo?
3gab2=Caleb?
3gab3=Gabriella. È una lunga storia.
3gab4=È così che si saluta un vecchio amico?
3gab5=Devo venire con te. Voglio capire cosa sta succedendo.
3gab6=Ti sei guardato allo specchio di recente? Neanche tu sei un gran partito.
6gab1=Quei cosi sono dappertutto. La Cabala dev’essere proprio disperata per creare creature del genere.
6gab2=E allora cosa sono?
6gab4=Che stai facendo?
6gab5=Non preoccuparti, ometto. Ci rivedremo.
14gab1=Dobbiamo seguirlo. Chissà cosa lo aspetta.
17gab1=Insetto, noi siamo l’Antico. Inchinati davanti a noi.
17gab2=Ci sei soltanto tu tra noi e il dominio? Patetico.
17gab3=Tutto ciò che è non sarà più. Tutto ciò che è stato non è mai esistito. Tutto ciò che sarebbe accaduto... ehm...
17gab4=Tutto ciò che sarebbe accaduto non... accadrà mai.
20gab1=Vi ammazzo entrambi se non state zitti.
1agid1=Sono Gideon, il vostro capotreno d’eccezione! Tenetevi forte, il viaggio potrebbe farsi un po’... sanguinoso!
1agid2=So che sei qui, Caleb. Non vedo l’ora di strapparti la milza e mettermela in testa come cappello.
2gid1=Non hai molta fortuna coi treni, vero?
2gid2=Ah, davvero? Qual è stato il mio primo errore?
3gid1=È ora di morire, Prescelto.
7gid1=Meglio che stavolta funzioni.
7gid2=Ishmael?
7gid3=Stavolta sei stato fortunato, Traditore. Tra qualche ora tutto tornerà in ordine e mi sarò liberato di te per sempre. Per ora devo andarmene. Tranquillo, le mie truppe ti faranno compagnia. Fate i bravi.
10gid1=Mi ricorda casa.
10gid2=Togliti dai piedi, dannazione!
11gid1=Immaginavo che saresti venuto qui.
11gid2=Mi spiace interrompere questa bella rimpatriata, Traditore, ma devo tenerti motivato.
14gid1=Non è finita! Non mi sconfiggerai mai davvero!
15gid1=Ah, Caleb. Ti aspettavo, brutto babbeo prevedibile. Ci metto un attimo. Mi sto solo... TRASFORMANDO...
15gid2=... in qualcosa di... spiacevole.
15gid3=Che ne pensi del mio nuovo aspetto? Non hai idea di quanto possa essere squisito il dolore. Permettimi di dimostrartelo.
15gid4=Su di te, intendo!
16gid1=No! Non è giusto! Ti ammazzo!
7ish1=Una svolta sorprendente.
7ish2=Brutta giornata?
7ish3=Ti rendi conto di quanti danni stai facendo?
7ish4=Non è questo che intendo. Tu sei Colui che Lega. Prima o poi dovrai affrontare la cosa.
7ish5=Allora sappi questo: noi siamo i Prescelti. Siamo qui per te, che ti piaccia o no.
7ish6=Sì, anche Ophelia. È stata la prima ad attraversare.
7ish7=Non me lo perderei per nulla al mondo. Anche se potresti finire per distruggerlo.
9ish1=Stai pensando a Ophelia. Commovente.
9ish2=Nel tempio di Gideon c’è una fenditura permanente. Lì si concentra tutto il danno che viene fatto. Un epicentro, per così dire. È lì che troverai Ophelia.
9ish3=La distruzione di Tchernobog ha aperto molte porte tra i mondi. Solo Colui che Lega può sigillarle. Quel potere è dentro di te. Questa realtà perirà se non la ripristini.
9ish4=Un’altra realtà si fa strada attraverso le fenditure, antica e famelica. Non è buona né malvagia, semplicemente esiste. Ma ci divorerà tutti.
14ish1=Non vorrai seguirlo, vero?
14ish2=Suppongo che sia qualcosa di molto spiacevole.
17ish1=Insetto, noi siamo l’Antico. Inchinati davanti a noi.
17ish2=Ci sei soltanto tu tra noi e il dominio? Patetico.
17ish3=Tutto ciò che è non sarà più. Tutto ciò che è stato non è mai esistito. Tutto ciò che sarebbe accaduto... ehm...
17ish4=Tutto ciò che sarebbe accaduto non... accadrà mai.
20ish1=Non è finita, Caleb. Devi sigillare le fenditure. Devi ricucire il tessuto di questa realtà prima che si laceri.
20ish2=Il potere è dentro di te. È ora di usarlo.
3madsci1=Questo è inaspettato. Mmm, temo che dovrò ricalibrare i parametri della singolarità.
7madsci1=Si fidi, stavolta i miei calcoli sono perfetti.
10madsci1=Signore, devo consigliarle di ripensarci. I miei calcoli non sono ancora conclusivi. Le fenditure potrebbero essere una fonte di potere illimitato, come suggerisce lei, ma anche trappole mortali nel tessuto dello spaziotempo. Potrebbero condurla in un regno di puro caos e malvagità dove verrebbe annientato del tutto.
10madsci2=Ma signore!
10madsci3=No! ... Non ho mai avuto modo... di dirle... quanto la amo...
12madsci1=Salve, salve, salve. Benvenuto a Ricerca e Sviluppo o, come mi piace chiamarla... R&S. Può chiamarmi... dottore. Ho avuto dei soggetti piuttosto interessanti ultimamente, con tutte le fluttuazioni del substrato cosmico, ma non vedo l’ora di procedere con la sua... dissezione. Venga al laboratorio principale e inizieremo l’esperimento...
11oph1=Il principe azzurro, suppongo.
11oph2=Slegami e ti darò un’intera torta alla vaniglia.
14oph1=Vuole che lo segui, razza di idiota.
14oph2=Che aspettiamo?
17oph1=Insetto, noi siamo l’Antico. Inchinati davanti a noi.
17oph2=Ci sei soltanto tu tra noi e il dominio? Patetico.
17oph3=Tutto ciò che è non sarà più. Tutto ciò che è stato non è mai esistito. Tutto ciò che sarebbe accaduto... ehm...
17oph4=Tutto ciò che sarebbe accaduto non... accadrà mai.
20oph1=Non hai scelta. Ascolta Ishmael, idiota.
20oph2=Ti sculaccio se tu sculacci me.
sounds.chosen.caleb.e1m1_1_cal=Non sono un brutto sogno. Sono il loro peggior incubo.
sounds.chosen.caleb.e1m3_2_cal=Non li fanno più come una volta.
sounds.chosen.caleb.e1m4_1_cal=Mi sa che c’è da ammazzare qualcuno.
sounds.chosen.caleb.e1m4e5a_cal=E che diavolo ne so? A te che importa? Non mi sembra che tu abbia problemi con lui.
sounds.chosen.caleb.e1m4e7a_cal=Che vorresti dire?
sounds.chosen.caleb.e1m4e9a_cal=Lo risolverò io!
sounds.chosen.caleb.e1m5_1_cal=Ehi, questo posto dovrebbe pagarmi una percentuale.
sounds.chosen.caleb.e2m5_1_cal=È l’ora del teatrino, bambini. È arrivato il cattivo.
sounds.chosen.caleb.e2m5_2_cal=Be’, anche questo è un modo per squartare qualcuno. Ma il mio è più veloce e divertente.
sounds.chosen.caleb.e2m5_4_cal=Ugh, mi sento un pezzo di carne.
sounds.chosen.caleb.e3m1_2_cal=Ecco, adesso sì che si ragiona!
sounds.chosen.caleb.e3m1_3_cal=Ah, non è mai facile.
sounds.chosen.caleb.e3m2_1_cal=Che spreco di buone munizioni!
sounds.chosen.caleb.e3m2_2_cal=Mmm, un posto di blocco. Oh, dannazione. Mi hanno fregato, a quanto pare. Dovrò tornare indietro.
sounds.chosen.caleb.e3m2_3_cal=Wow, con alloggi così spaziosi forse dovrei cercare lavoro qui.
sounds.chosen.caleb.e3m3_1_cal=Buongiorno! E nel caso non vi riveda, buon pomeriggio, buonasera e buonanotte!
sounds.chosen.caleb.e3m3_2_cal=È lui. È l’uomo che sto cercando.
sounds.chosen.caleb.e3m3_3_cal=Non sono un meccanico. Di solito faccio male alla gente. Si scende.
sounds.chosen.caleb.e3m5_1_cal=Sai, questo posto sembra quasi irreale.
sounds.chosen.caleb.e3m5_3_cal=Questo ponte sembra sicurissimo da attraversare.
sounds.chosen.caleb.e3m5_4_cal=Un bell’esempio di edilizia tipica della Cabala.
sounds.chosen.caleb.kill.c_1liner_2=Muoiono tutti.
sounds.chosen.caleb.msc11cal=Direi che mi dispiace, ma sai che non sarei sincero. Buona giornata.
sounds.chosen.caleb.msc14_cal=Mmm, niente di meglio della carne appena confezionata.
sounds.chosen.caleb.msc15_cal=Ispettore delle carni. Temo proprio che dovrò farvi chiudere.
sounds.chosen.caleb.msc18_cal=Si torna a sgobbare...
sounds.chosen.caleb.msccaleb1=Chiuso a chiave.
sounds.chosen.caleb.taunt.tnt5_cal=Già, e io che mi credevo brutto.
sounds.chosen.gabriella.e1m4e3_gab=Qualcuno deve fermare il treno. Là fuori quei cosi sono dappertutto. La Cabala dev’essere proprio disperata per creare creature del genere.
sounds.chosen.gabriella.e1m4e6_gab=Io non ho problemi. Li risolvo.
sounds.chosen.gabriella.e1m4e8_gab=Non sono più sicura di poter contare su di te. La situazione si sta mettendo male. E se non riesci a risolverla tu, lo farò io.
sounds.enemies.civilian.02civ1=Ehi, amico, tutto bene? Hai un aspetto da schifo.
sounds.enemies.civilian.02civ3=Ehi, mi sa che il treno è fuori servizio. Sai che ti dico? Prendiamo un taxi.
sounds.enemies.civilian.02civ4=Hai intenzione di abbaiare tutto il giorno, cagnolino, o di mordere?
sounds.enemies.civilian.02civ5=Qui non sono ammesse armi, amico! A meno che tu non ne compri una per me.
sounds.enemies.civilian.11civ2=Qualsiasi cosa, tranne gli hamburger.
sounds.enemies.civilian.11civ4=Sì, ce l’ho un hot dog per te.
sounds.enemies.civilian.12civ2=Oh, cavolo!
sounds.enemies.civilian.12civ3=Non c’è nessuno in casa. Vai via.
sounds.enemies.civilian.12civ4=Lasciami in pace!
sounds.enemies.civilian.12civ5=Non voglio niente!
sounds.enemies.civilian.spot11=Ah, merda. Oggi non è proprio giornata.
sounds.enemies.civilian.spot2=Questo posto è un manicomio!
sounds.enemies.f_civ.02civ2=Non può succedere davvero. Farò tardi al lavoro!
sounds.enemies.f_civ.02civ8=Non so, credo di avergli infilato la testa troppo a fondo.
sounds.enemies.f_civ.09civ=Chi è?
sounds.enemies.f_civ.09civ3=Davvero? Forte. Ti apro.
sounds.enemies.f_civ.11civ1=Accidenti, tutta questa cartilagine mi fa venire fame. Che vuoi per pranzo?
sounds.enemies.f_civ.11civ3=Che ne dici di un hot dog?
sounds.enemies.f_civ.spot3=Qui sta andando tutto a rotoli! Ma cos’è?
sounds.enemies.gideon.15gid2b=Non hai idea di quanto possa essere squisito il dolore. Permettimi di dimostrartelo.
