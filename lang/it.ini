3000=~Ormai non puoi nemmeno sopportare la metropolitana in pace e goderti il nuovo numero di Guns N’ Gibs. Prima quel controllore ha osato sequestrarti la fiaschetta di Ol’ Red ’99, poi quel macchinista senza spina dorsale ha dovuto fermare il treno per un’ora solo perché la carrozzina di un moccioso era finita sui binari! Stavi per andare a dirgliene quattro, ma hai riconosciuto la sua voce... e hai capito che la giornata stava per diventare... interessante.
3001=~Che male. Che gran male. L’ultima volta che hai perso i sensi avevi buttato giù diciannove bicchierini di fila di JoJo’s Black Label #47, e anche allora credi c’entrasse di più il fatto che fossi vicino al chiosco dei gelati quando l’hai fatto saltare. Pazienza. Quel venditore idiota non doveva farti incazzare mettendo la granella sul tuo Killer Kiddy Kone. A proposito di granella, forse ti conviene trovare Gideon e spargerlo in abbondanza sulla parete più vicina!
3002=~Gideon se l’è cavata, ma è ancora in fuga. Presto gli sistemerai le cose e spegnerai la sua luce. Nel frattempo ti ha lasciato qualche amico marcio di cui occuparti. Questi pezzi di carne infetta ricordano i non morti che la Cabala sfornava un tempo... se non fosse per quelle strane cuciture sul petto. Queste carcasse ambulanti hanno qualcosa di diverso. Ma ehi, carne tritata è sempre carne tritata.
3003=~Be’, è stato divertente... più o meno. Purtroppo Gideon non era a bordo, ma ora hai un’idea precisa di dove si trovi: la cattedrale! Almeno è quello che diceva il cartello all’ingresso: «30 OTT. GIDEON PRESENTA LA SUA DISSERTAZIONE SUL CRIMINE RITUALE DEL PECCATO E SU COME FARLA FRANCA. ARRIVATE IN ANTICIPO E SENTIRETE ANCHE IL SUO BREVE SIMPOSIO SULL’EMIVITA INCREDIBILMENTE ONEROSA DI UNA VALVOLA!» Non è il tipo da deludere i suoi ammiratori. Vai là e fagli sapere che sei tra il pubblico.
3004=~Il Museo di Antichità Lafayette della Cabalco annuncia una nuova mostra: Culti e rituali. Seguite un’eccezionale visita guidata alla scoperta della storia di alcune delle organizzazioni fanatiche più bizzarre del mondo, dalla maledetta Setta della Raganella Abbaiante ai temibili Shriners col fez. Non dimenticate di sacrificare un momento della vostra giornata per visitare la nostra nuova mostra del Dio Oscuro animatronico. Che paura!
3005=~Accidenti quanto odi le fogne! L’odore è piuttosto gradevole, ma guadare la roba che galleggia alla lunga stanca. Quando finalmente governerai il mondo, lo dichiarerai zona senza servizi igienici. Il bello di una società con le fogne a cielo aperto è che non devi stanziare soldi per riparare le tubature. Quella roba può arrivare agli oceani da sola. In ogni caso, persino attraverso il profumo locale riconosci il fetore di Gideon. Quel codardo sarà diretto a un rifugio della Cabala.
3006=~L’umanità si riproduce come gli scarafaggi e la sovrappopolazione affligge l’intero pianeta. Le malattie sono diventate il nostro secondo settore più redditizio! Siamo lieti di annunciare che il Centro di Gestione delle Malattie Cabalco ha quasi il monopolio! Questa struttura all’avanguardia dispone di ampi centri di ricerca, dissezione e traumatologia. Il CGM è in prima linea per malattie, pestilenze e afflizioni di ogni genere. Che vi interessi il virus Ebola o una semplice e deliziosa sifilide, il nostro motto è: investite e infestate. Cabalco fa il resto!
3007=~Gideon si dirige verso uno dei dirigibili aziendali ormeggiati in cima all’edificio. È proprio il momento di smetterla di ingozzarti di carne carbonizzata al Beefy Queen all’angolo, perché non sei in forma per fare le scale. Curiosamente, anche Gideon ha mangiato la sua dose di carne al BQ, tanto da dover installare ascensori rapidi in ogni grattacielo. È una gentilezza non dover salire a piedi per oltre mille piani, se solo riuscissi a spegnere quella musica infernale!
3008=~Il dirigibile modello 1701D di Cabalco Industries è uno dei velivoli più raffinati e certamente più versatili che abbiano mai solcato i nostri cieli inquinati. Versatilità è la parola chiave: il nostro dirigibile può servire contemporaneamente per viaggi d’affari di gran classe e per scopi militari. Perché fare due viaggi? Bombardate a tappeto quel fastidioso paese del Terzo Mondo mentre i vostri clienti più importanti volano con stile! Sotto la corazza, il dirigibile Cabalco ha davvero un cuore d’oro. Sedili spaziosi, cabine rilassanti, assistenti di volo ben armate e le migliori noccioline dei cieli! Volate Cabalco. Volate con stile.
3009=~Stiamo precipitando! Assumete la posizione d’emergenza! Riportate sedili e tavolini in posizione verticale e bloccateli. Mettete la testa tra le vostre gambe. Se fumate, spegnetevi. Buona giornata e grazie per aver scelto Cabalco Air.
3010=~Non troverai suore in questa cattedrale! L’essere appostato dall’aldilà ha deformato il posto per renderlo più di suo gusto. Potresti perfino trovarlo abitabile, se fosse in vendita a un prezzo ragionevole e non includesse quei fastidiosi portieri della Cabala. Pazienza. È ora di ripulire il posto e scoprire dove sia andato Gideon. Magari troverai anche il tempo per fare un calco di una bella incisione su pietra da appendere alla parete vuota della tua cabina delle armi.
3011=~State entrando nel settore industriale. I livelli di ozono sono attualmente al terzo stadio e l’allerta per le tossine al quarto. Si raccomanda di indossare sempre dispositivi di protezione respiratoria. È dunque l’occasione ideale per provare il nuovo e migliorato Safe Sucks 2 di Cabalco! La protezione economica e facile da usare per ogni occasione. Evitate le aree ad alto rischio, per esempio l’aria aperta. Buona visita in sicurezza e buona giornata.
3012=~Una volta i treni erano molto più eleganti. Oggi è già tanto riuscire a non farsi ammazzare a bordo. Poche cose alleviano la tensione meglio che far saltare in aria la concorrenza. A pezzi, per così dire. Questi rifugi della Cabala sono il non plus ultra del lusso: il puzzo, gli arredi, i ratti, l’atmosfera e gli ubriaconi. A proposito di appuntamenti, Gideon dovrebbe essere qui da qualche parte. Quell’incontro dovrebbe essere più divertente del tiro al bersaglio sugli ubriaconi. Evvivaaaa!
3013=~È chiaro che i cittadini di New Town hanno due problemi seri: mangiano troppo e non trattengono niente. La combinazione sarà letale... per loro. A giudicare dall’odore, le loro tubature avrebbero bisogno di una bella pulita. Ed ecco te, semidio immortale e clistere vivente. Se sei caduto così in basso è chiaramente colpa di Gideon. Sei nella merda fino alle caviglie, alla lettera. Mmm. Puoi aggiungerlo al suo conto e riscuoterlo a pezzi.
3014=~Avete voglia di altra carne? Certo che sì. Ce l’abbiamo tutti! Alla Cabalco ce ne intendiamo di carne e abbiamo sviluppato una nuova linea per tutte le vostre esigenze carnivore. Carne in scatola! Economica e deliziosa! Disponibile nei vostri gusti classici preferiti: frattaglie, manzo, pollame, maiale, capra e pesce di fondale! Oppure provate le ultime novità: carne al lievito madre, carne alle prugne fermentate e carne ai funghi appena appena allucinogena! In uno stabilimento Cabalco continuiamo a creare i cibi del futuro. E la parte migliore? In media siamo ormai privi di E. coli per oltre l’82 per cento!
3015=~Se sei felice e tu lo sai, fai scoppiare un cervello... Se sei felice e tu lo sai, taglia una vena... Se sei felice e tu lo sai, le teste che rimbalzano lo diranno... Non c’è niente come amare il proprio lavoro. Un’altra stazione innominabile? Be’, almeno è più carina dell’ultima. È ora di rimettere al lavoro il dito sul grilletto. Tu vieni decisamente dal lato sbagliato di questi binari e, come al solito, la luce in fondo al tunnel potrebbe essere un treno.
3016=~Ah! Quel bastardo di Gideon pensava di seminarti con il vecchio trucco dello scambio. Nei tuoi sogni, damerino! Quando lo prendi, gli farai provare uno scambio a modo tuo. Vediamo, potresti cominciare prendendogli la testa e dandogli una prospettiva un po’ più interiore. Dato che ce l’ha infilata da tanto, scommetti che la vista gli sarà familiare. Alla breccia, e tutto il resto. Be’, basta con questi pensieri affettuosi. C’è del lavoro da fare, e stavolta la linea blu verrà dipinta di rosso. Rosso sangue.
3017=~Stanchi di buttare via nell’affitto i soldi guadagnati con fatica? Certo che sì! Ecco perché i vostri amici di Cabalco Edilizia e Immobiliare hanno appena finito un grazioso complesso residenziale. Sappiamo che i terreni scarseggiano e costano, quindi abbiamo scaricato un po’ di terra fresca su quel vecchio e orribile pozzo di liquami radioattivi e tossici a Love Canal! Una nuova casa Cabalco non è mai costata così poco! E se pensate di mettere su famiglia, comprate in grande! Ignorate pure le voci su infertilità, malessere generale, vomito continuo, l’onnipresente «figlio dell’amore a tre teste» e altre sciocchezze simili. Alla Cabalco ci teniamo a voi e i nostri prezzi sono più che onesti!
3018=~Poco impressionato dalla sicurezza dei trasporti locali? C’è una cosa sola da fare! Distruggili! Proprio così, butta giù tutto. Il biglietto? Col cavolo! L’unico biglietto che ti serve è il tuo fucile. E questo biglietto farà strage tra gli avversari. Provare gioia nel proprio lavoro è decisamente un vantaggio. Forse stavolta sarebbe saggio uscire un momento a prendere una boccata d’aria viziata. Gli ultimi due viaggi sono stati un po’ troppo ravvicinati.
3019=~Questo sì che va meglio. Sembra di essere a casa. Fa venire voglia di sdraiarsi e dormire per sempre. Essere immortali non è poi questa gran cosa. Richiede molta più fatica del previsto. Almeno puoi aiutare gli altri a ottenere quello che tu non avrai mai. Anzi, puoi offrirgli un aiuto più rapido di quanto possano immaginare. Sei fatto così, tutto gentilezza e pensieri caritatevoli. È ora di accelerare il loro passaggio. Venite fuori, ovunque siate... state per essere, ehm, prescelti.
3020=~State entrando a New Town, sede dell’immenso quartier generale di Cabalco Industries! Rivolte e sommosse civili ormai sono raramente un problema! Affacciata sul grazioso fiume in fiamme di White Rock, New Town è il ritratto quasi perfetto di una città oppressa con dolcezza da una gigantesca megacorporazione amorale! Certo, ogni tanto ci sono ancora sacrifici rituali o rapimenti notturni. E sì, a volte qualcuno sparisce e non se ne sa più nulla. Ma le strade sono perlopiù sicure e pulite e l’economia è in crescita, a parte qualche piccolo intoppo. Siamo New Town! Cabalco è nostra amica!
3021=~ Ti preoccupa il futuro? I tuoi compagni delle superiori ti hanno terrorizzato? Hai bisogno di un lavoro che ti metta davvero alla prova? Allora entra nella divisione sicurezza della Cabalco. Non sai cosa sia una giornata impegnativa... se non ne hai passata una nudo e accaldato in una scatoletta di metallo buia e quasi senz’aria, con quel poco che ti resta della ragione e un paio di dozzine di ratti affamati a tenerti compagnia! Ma basta parlare di me! Il nostro programma intensivo di umiliazioni e bastonate nel sacco ti farà sentire un uomo, o una donna, nuova! Alla fine del nostro percorso in 12 tappe ti daremo un’arma grossa e il potere quotidiano di vita e di morte sugli altri. Così impareranno quei bastardi meschini che erano a scuola con te!
3022=~ Siete giunti al Tempio Supremo, segretissimo, della Cabalco. Al momento non ci siamo. Lasciate pure del sangue alla porta, preferibilmente umano o di capra. In caso di emergenza, accendete 69 candele bianche, incidete un grande pentagramma nel pavimento di cemento con le unghie e danzate nudi al suo interno, dopo esservi dipinti col sangue delle vostre dita lacerate e mozzate, intonando un canto al nostro dio oscuro. Un insidioso servitore degli inferi sarà da voi tra poco. Grazie per la pazienza!
3023=~Benvenuto al posto di blocco Gnarly. Ah. La sicurezza qui sembra un tantino troppo... fanatica. Deve esserci un altro ingresso al quartier generale della Cabalco. Nel frattempo, forse conviene fare un po’ di pulizia ed eliminare qualche avversario indegno. A volte, per pulire un posto bisogna prima fare un po’ di disordine. Sei solo contento di non dover togliere quelle macchie di materia grigia dai muri. Una volta secche dev’essere una gran seccatura. È ora di farti il tuo lasciapassare ad «accesso illimitato».
3024=~Cercate lavoro? Alla Cabalco un corpo in più fa sempre comodo! Assumiamo di continuo e offriamo vantaggi da non credere. Lavorerete in un vasto grattacielo nuovo, con distributori di bibite e caffè a ogni piano e un nostro, ehm, piano di cure mediche dell’altro mondo. Alla Cabalco, anche se partite dall’ultimo gradino, vi promettiamo un sottoposto in men che non si dica! Il nostro, ehm, reparto risorse umane non vi sottopone alle noiose procedure delle altre aziende. Non avete esperienza? Nessun problema! Non chiediamo neppure un curriculum, figuriamoci una domanda. Basta presentarvi e sarete nostri... cioè, ehm, assunti. Cabalco offre opportunità diseguali.
3025=Bisogna riconoscerlo alla Cabalco. Il progettista si è proprio scatenato con questo immobile. Ci sono ampie scalinate, opere d’arte strane ma belle, cubicoli eccezionalmente divertenti e più cose da far saltare di quante ne possa puntare un fucile. Nel complesso è un bel posto. Gli farebbe bene una passata di fiamme. Però i vari cultisti, i Drudge, gli Shikari e i fanatici devono andarsene. All’inferno. Non passate dal via. Non ritirate 200 dollari. Il Behemoth, che ha un’aria piuttosto coccolosa, sarebbe una bella aggiunta al tuo serraglio personale. Peccato che non sappia fare i bisogni fuori.
3026=~È ora di spegnere quei bastardi. Stacca la spina. Taglia la corrente. Niente più alternata! E al diavolo anche la continua! Benvenuto alla centrale elettrica. Sei il blackout in persona. L’eccitazione qui sfrigola. Sfrigola tanto che potresti finire fritto in un lampo, bello croccante. E dopo le tue recenti esperienze in treno hai ben poca voglia di fare da conduttore. È ora di fare quello che ti riesce meglio: spaccare roba. E quale inizio migliore di quei fanatici? Al lavoro, o interruttore!
3027=~Caleb riuscirà davvero a chiudere le fenditure? Ophelia avrà i suoi due minuti di regalo? Che diavolo è successo a Gabriel... ehm, Gabriella? E se Ishmael non riuscisse a tornare a casa? E dove si è fatto quei tatuaggi?|~Non perdete la prossima puntata di «Brucia, brucia!». Presto avrete queste risposte e altre ancora... promesso. Nel frattempo, buttatevi in un enorme BLOODBATH!
3028=~Ah, la scienza! Ricordi con affetto la prima volta che hai potuto dissezionare qualcosa. Fremevi di eccitazione quando hai iniziato a scuoiare quel cadavere fetido. I muscoli danzavano alla minima tensione elettrica, e che sorpresa quando per sbaglio hai aperto le viscere! Che spasso! Be’, basta sognare a occhi aperti. Mettiti al lavoro e trova l’ingresso del reparto ricerca e sviluppo della Cabalco.
3029=~Non c’è niente come una scalata societaria molto ostile per rinvigorire i sensi! Il gioco del cacciatore e della preda ha sempre avuto un gran fascino. Sta diventando divertente. Presto Gideon finirà i nascondigli. È ora di mettere il ratto alle strette, per così dire. C’è un po’ di lavoro da bidello da fare. Svuotare uffici non è mai stato così divertente! Dov’era l’ascensore per il tetto?
3030=~Ecco quel piattello di Gideon! Suona proprio bene: Gideon il piccione. Uuuhuu! Il tiro al piattello è uno dei tuoi giochi preferiti. Sarà un vero spasso! Per lui, un botto. Pull! Bang. Pull! Bang. Pull! Non scappi più, Gideon. Il tuo volo è finito, idiota. Hai esaurito la fortuna.
3031=~È uno scontro all’ultimo sangue. Preferibilmente quello di qualcun altro. Non si possono più tirare i fili del burattino Gideon e per il burattinaio è arrivata la resa dei conti. Antico? Stai ascoltando? Allora ascolta questo...
3032=~C’è qualcosa di diverso: non riesci proprio a metterci sopra il dito del grilletto. I tuoi vecchi amici hanno un’aria pallida, forse perfino malaticcia. Che diavolo gli è preso di infilarsi in quelle bare? Mmm. Pazienza. Non c’è niente che una dose extra di piombo non possa curare. Piombo in testa e tutti a letto. Buonanotte, cari Prescelti. Sogni velenosi.
3033=~Nelle parole di un poeta da tempo dimenticato e per nulla prolisso: «Uccidilo!»
