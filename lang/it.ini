sounds.events.tavoice1=Benvenuti nella rete interurbana Cabalco. Sappiamo che avete scelta quando si tratta di trasporto pubblico e siamo lieti che abbiate scelto Cabalco.
sounds.events.tavoice2a=La rete interurbana Cabalco si rifà il look. Le rapine sono diminuite del 13%, i pestaggi a caso del 6%, gli omicidi del 3% e i guasti generali di ben il 7%. Purtroppo, le mutilazioni di animali sono aumentate di un impressionante 96%.
sounds.events.tavoice3=È severamente vietato impalare gli altri passeggeri con oggetti appuntiti. Grazie.
sounds.events.tavoice4=È vietato fumare sui mezzi Cabalco. Grazie.
sounds.events.tavoice5=In arrivo all’Express del centro.
sounds.events.tavoice6=Prossima fermata: Pickman Street.
sounds.events.tavoice7=Stiamo entrando nel settore industriale.
sounds.events.tavoice8=Prossima fermata: Ingram Street.
sounds.events.tavoice9=Tenete sempre braccia e gambe all’interno del treno. Se dovete liberarvene in fretta, potete gettare le appendici staccate nei contenitori sterili per arti vicino a ogni uscita. Grazie per contribuire a mantenere i trasporti Cabalco puliti e sicuri.
sounds_ao.chosen.caleb.calebintro1.1=Eccomi lì, bloccato nella distesa gelata, a corto di munizioni e senza sbobba, con le pattuglie della Cabala alle calcagna.
sounds_ao.chosen.caleb.calebintro1.2=Con tutta quella neve vedevo a malapena, ma più avanti mi sembrò di scorgere una luce verdastra, un po’ sinistra.
sounds_ao.chosen.caleb.calebintro1.3=«Proprio il mio genere di posto», ricordo di aver pensato.
sounds_ao.chosen.caleb.calebintro1.4=Così mi feci strada nella neve e… Ehi, vi sentite strani anche voi?
sounds_ao.chosen.caleb.calebl1a=Ma che diavolo? Cos’è, un trip all’acido con distorsione temporale?
sounds_ao.chosen.caleb.calebl1b=Dannazione, un altro portale? Odio questi affari. Va bene, si parte.
sounds_ao.chosen.caleb.calebl2a=Ma che… Ophelia, che succede?
sounds_ao.chosen.caleb.calebl2b=Dove sono? Mah, una confraternita universitaria. Aspetta… no, non può essere!
sounds_ao.chosen.caleb.calebl2c=Non credo proprio, sorella. Oh no, ci risiamo!
sounds_ao.chosen.caleb.calebl3a=Maledette sfere del tempo. Ne ho abbastanza.
sounds_ao.chosen.caleb.calebl3b=Cosa? JoJo?
sounds_ao.chosen.caleb.calebl3c=Ma guarda un po’. Ehi, mi fai al volo il numero sul filo? Mi piace sempre. Oh-oh.
sounds_ao.chosen.caleb.calebl4at1=Per l’amor di…
sounds_ao.chosen.caleb.calebl4b=Ehi, Gabriella.
sounds_ao.chosen.caleb.calebl4c=Come vuoi. Comincio a capire il meccanismo. Dove mi porterà stavolta? Ho già fatto visita a tutti i Prescelti.
sounds_ao.chosen.caleb.calebl4d=Va bene, ci vediamo.
sounds_ao.chosen.caleb.calebl6a=Sei tu che mi trascini in tutte queste fenditure. Ora la pagherai. E guai se al mio ritorno i miei würstel sono bruciati.
sounds_ao.chosen.caleb.llcaleb1a=Brr, che freddo.
sounds_ao.chosen.caleb.llcaleb1b=Un labirinto di siepi. Che delizia!
sounds_ao.chosen.caleb.llcaleb2a=Oh, la testa! Una chiesa? Questo sì che è un incubo.
sounds_ao.chosen.caleb.llcaleb2d=Avanti, vitellini. Il Wyoming sarà la vostra nuova casa.
sounds_ao.chosen.caleb.llcaleb2e=È ora di scacciare la sbornia con un altro bicchiere.
sounds_ao.chosen.caleb.llcaleb2g=Ah, sì, questo ti fa crescere i peli sul culo.
sounds_ao.chosen.caleb.llcaleb2h=Ah, chiodo scaccia chiodo.
sounds_ao.chosen.caleb.llcaleb2i=Mmh… Questo è il miglior livello che abbia visto.
sounds_ao.chosen.caleb.llcaleb2j=Ho una strana sensazione allo stomaco.
sounds_ao.chosen.gabriella.gab43=Tu!
sounds_ao.chosen.gabriella.gab44=Gabriella.
sounds_ao.chosen.gabriella.gab45=E che ne so. Vai avanti, sono stanca.
sounds_ao.chosen.gabriella.gabint11=Allora, Ophelia, qual è la tua storia più spaventosa? Ti sei spezzata un’unghia ricaricando?
sounds_ao.chosen.gabriella.gabint21.1=Certo!
sounds_ao.chosen.gabriella.gabint21.2=Da piccola mio padre mi portava ogni anno a vedere i fenomeni da baraccone. E ogni anno vedevo JoJo.
sounds_ao.chosen.gabriella.gabint21.3=Gli tiravo addosso piccole zolle di terra.
sounds_ao.chosen.gabriella.gabint31=Una volta ho dovuto passare la notte in una villa infestata.
sounds_ao.chosen.gabriella.gabint32=E basta. Faceva paura.
sounds_ao.chosen.gabriella.gabint33=No!
sounds_ao.chosen.gabriella.gabint34=Volete che racconti la storia o no?
sounds_ao.chosen.gabriella.gabint35=Fa molta più paura se racconto i dettagli.
sounds_ao.chosen.gabriella.gabint36.1=Bene, adesso zitti tutti e due!
sounds_ao.chosen.gabriella.gabint36.2=Eccomi davanti a un vecchio maniero marcio, nel profondo del bayou fradicio vicino a dove sono cresciuta.
sounds_ao.chosen.gabriella.gabint36.3=È una notte nuvolosa e l’aria è piena di nebbia e di gas di palude.
sounds_ao.chosen.gabriella.gabint41=Pare che passerò la notte qui. Tanto vale dare un’occhiata e cercare una camera da letto.
sounds_ao.chosen.gabriella.gabint42=Eccoci. Ora una bella dormita.
sounds_ao.chosen.ishmael.ish31=JoJo è qui, padrone.
sounds_ao.chosen.ishmael.ish32=JoJo ascolta e obbedisce, padrone.
sounds_ao.chosen.ishmael.ish33=Be’, non è andata così male. Chissà se mi mancherà l’odore del mio sterco misto al fieno.
sounds_ao.chosen.ishmael.ish34=Oh, salve! Hai delle banane, per caso?
sounds_ao.chosen.ishmael.ish35=Precisamente.
sounds_ao.chosen.ishmael.ishint21.1=Be’, suppongo che tocchi a me, vero? Vediamo. Come Ophelia, anch’io ho un segreto.
sounds_ao.chosen.ishmael.ishint21.2=Senza dubbio avete sentito parlare di JoJo, lo scemo del circo.
sounds_ao.chosen.ishmael.ishint22.1=Sì, me lo ricordo. Vedete, ero io JoJo.
sounds_ao.chosen.ishmael.ishint22.2=All’epoca il sussidio non copriva i cultisti malvagi. E per un tatuato disoccupato c’era solo il circo.
sounds_ao.chosen.ishmael.ishint22.3=Così, per un po’, divenni JoJo. Il JoJo precedente mi consegnò il venerabile manto di JoJo.
sounds_ao.chosen.ishmael.ishint22.4=Il primo giorno sfilai sul palco con fierezza e grazia.
sounds_ao.chosen.ishmael.ishint22.5=Poi mocciosi come te, che mi tiravano addosso la terra, mi insegnarono cosa significasse essere un fenomeno da baraccone.
sounds_ao.chosen.ishmael.ishint22.6=Dopo un anno ero prigioniero della mia scarsa autostima. Un giorno, però, tutto cambiò.
sounds_ao.chosen.ishmael.ishint22.7=Tchernobog mi parlò e mi ordinò di liberarmi di quella mortificazione terrena.
sounds_ao.chosen.ishmael.ishint22.8=E così feci. Ma non fu facile.
sounds_ao.chosen.ishmael.ishint31=Devo dire che mi sento proprio preso in giro.
sounds_ao.chosen.ishmael.ishint32=Tanto vale. In ogni caso, ci resta ancora mezzo sacchetto di marshmallow.
sounds_ao.chosen.ishmael.ishintro=Ehm, potete passarmi i würstel?
sounds_ao.chosen.ishmael.ishoutro=Ehm, scusate, chi ha preso l’ultimo marshmallow?
sounds_ao.chosen.ophelia.oph21=Devo distruggere quegli album di fotografie!
sounds_ao.chosen.ophelia.oph22=Fatto! Il mio passato è cancellato e posso unirmi alla Cabala!
sounds_ao.chosen.ophelia.oph23=Ehi, che ci fai nella mia storia?
sounds_ao.chosen.ophelia.oph24=Ehm… Stai facendo un brutto sogno, caro Caleb. È solo un incubo.
sounds_ao.chosen.ophelia.ophint11.1=Molto spiritoso. A dire il vero, per raccontarvi questa storia devo rivelarvi un piccolo segreto.
sounds_ao.chosen.ophelia.ophint11.2=Non ditelo a Caleb, però. Non me lo perdonerebbe mai. Vedete, molto tempo fa…
sounds_ao.chosen.ophelia.ophint11.3=Prima di aspirare al dominio del mondo, ero solo una ragazzina allegra in una confraternita femminile.
sounds_ao.chosen.ophelia.ophint12.1=Sì, lo so, Ish. Sembra dannatamente improbabile. Eppure è vero. Il mio piccolo segreto oscuro.
sounds_ao.chosen.ophelia.ophint12.2=È così che ho conosciuto la Cabala. Un giorno mandarono un’orda di zombi a occupare il campus.
sounds_ao.chosen.ophelia.ophint12.3=Pare che uno studente geniale avesse inventato un siero di rianimazione, ma ne dubito.
sounds_ao.chosen.ophelia.ophint12.4=Come fanno gli zombi, andarono dritti dove c’erano più donne indifese e poco vestite, la casa della mia confraternita.
sounds_ao.chosen.ophelia.ophint12.5=Ne avevo abbastanza di fare la ragazza spensierata. Invece di salvare le mie sorelle, decisi di rinunciare al biondo tinto…
sounds_ao.chosen.ophelia.ophint12.6=… e unirmi alla Cabala. Il problema era che non mi avrebbero mai accettata sapendo della mia confraternita.
sounds_ao.chosen.ophelia.ophint12.7=Gli zombi avrebbero pensato alle ragazze, ma gli album erano ancora nella casa. Dovevo entrare e distruggerli.
sounds_ao.chosen.ophelia.ophint31=Allora, Gabby, tocca a te. Qual è la tua storia?
sounds_ao.chosen.ophelia.ophint32=E poi?
sounds_ao.chosen.ophelia.ophint33=Nessun segreto profondo? Nessun complotto da quattro soldi da svelare?
sounds_ao.chosen.ophelia.ophint34=A quanto pare, l’hai già raccontata.
sounds_ao.chosen.ophelia.ophint35=Ora sì che ci siamo!
sounds_ao.chosen.ophelia.ophintro=È sempre stato pessimo a raccontare storie.
sounds_ao.enemies.gideon.gideoni1.1=Ah sì, salve. Di certo vi ricorderete di me, no? Gideon, vanaglorioso e assetato di potere?
sounds_ao.enemies.gideon.gideoni1.2=Un tempo aspiravo al trono degli dèi. Be’, in un certo senso sono stato accontentato.
sounds_ao.enemies.gideon.gideoni1.3=La mia anima immortale è legata a questo cranio per sempre, e non certo grazie a Caleb e ai suoi Prescelti.
sounds_ao.enemies.gideon.gideoni1.4=Comunque, non serve serbare rancore.
sounds_ao.enemies.gideon.gideoni1.5=Un giorno, forse, farò da musa a qualche sventurato drammaturgo che passi di qui.
sounds_ao.enemies.gideon.gideoni1.6=Fino ad allora, gentile giocatore, vi divertirò con questo piccolo aneddoto.
sounds_ao.enemies.gideon.gideoni2.1=Dopo aver sconfitto l’Antico, ai Prescelti toccava un lungo cammino verso casa attraverso l’Altro Mondo.
sounds_ao.enemies.gideon.gideoni2.2=Se la cavavano con un paio di demoni incontrati per strada, ma non erano pronti ad affrontare…
sounds_ao.enemies.gideon.gideoni2.3=… il potente terrore psichico che si aggirava nelle Terre Desolate. L’Incubo.
sounds_ao.enemies.gideon.gideoni2.4=Stolti com’erano, i Prescelti invitarono quasi quel diavolo quando decisero di raccontarsi storie di paura…
sounds_ao.enemies.gideon.gideoni2.5=… durante uno dei loro pasti. Non immaginavano che ognuno di loro stesse per essere trasportato…
sounds_ao.enemies.gideon.gideoni2.6=… nel proprio inferno personale. Osservate e divertitevi, caro giocatore.
sounds_ao.enemies.gideon.gideoni3.1=E così la nostra storia volge al termine. Caleb ha vinto ancora una volta. Pare che niente possa fermarlo.
sounds_ao.enemies.gideon.gideoni3.2=A volte sembra quasi che la mano invisibile di un essere d’oltremondo guidi le sue azioni.
sounds_ao.enemies.gideon.gideoni3.3=Ma è meglio non soffermarsi su simili pensieri. Per ora mi accontenterò di osservare.
sounds_ao.enemies.gideon.gideoni3.4=Molte avventure attendono i Prescelti. Storie da raccontare, battaglie da combattere e imperi da forgiare.
sounds_ao.enemies.gideon.gideoni3.5=Forse un giorno troverò il modo di tornare.
sounds_ao.enemies.gideon.gideoni3.6=E quel giorno, ve lo assicuro, Caleb brucerà.
sounds_ao.enemies.tchernobog.tcherno31=Ishmael. Ascolta.
sounds_ao.enemies.tchernobog.tcherno32=Non sei più JoJo. Va’. Uccidi questi mortali e vieni da me. Abbiamo molto da fare.

[intro]
line01=Noi siamo la Cabala.
line02=Io, Gideon, sono il suo capo, sinistro e geniale.
line03=Ci siamo sempre annidati tra voi.
line04=Come larve nella carcassa gonfia e fetida di un ratto malato.
line05=Servitori di Colui che Lega, l’oscuro dio Tchernobog.
line06=Fino a un secolo fa, tutto procedeva secondo i nostri piani malvagi.
line07=Non ci aspettavamo che uno dei nostri ci tradisse.
line08=Si chiamava Caleb.
line09=Ha distrutto il nostro dio e assorbito il potere di Tchernobog.
line10=Io, e io soltanto, riporterò in vita il nostro oscuro dio.
line11=Distruggerò Caleb.
line12=Gli schiaccerò le budella sotto i piedi come acini d’uva marcia.
line13=E Caleb morirà per l’ultima volta.

