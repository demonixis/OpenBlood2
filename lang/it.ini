sounds.chosen.caleb.e1m4e9a_cal=Lo risolverò io!
sounds.chosen.caleb.e1m5_1_cal=Ehi, questo posto dovrebbe pagarmi una percentuale.
sounds.chosen.caleb.e2m5_1_cal=È l’ora del teatrino, bambini. È arrivato il cattivo.
sounds.chosen.caleb.e2m5_2_cal=Be’, anche questo è un modo per squartare qualcuno. Ma il mio è più veloce e divertente.
