sounds.enemies.loudspeaker.2loudspker=Il Museo di Antichità Lafayette è ora chiuso. L’orario di apertura è tutti i giorni dalle 15 alle 17. L’ingresso costa 17 dollari. Si prega di tenere i bambini sempre al guinzaglio. Grazie.
