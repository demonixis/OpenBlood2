6000=Il solito viaggio al lavoro sta per farsi un po’ sanguinoso.
6001=Gideon ti ha rovinato il viaggio e ora scappa come un codardo. Gliela lasci passare? Seguilo fino al museo e dagli ciò che si merita. Occhio ai suoi scagnozzi lungo la strada.
6002=Qui vicino c’è un vicolo che porta al museo. Dovrai guardarti un po’ intorno per trovarlo.
6003=Nei bidoni sul cornicione di fronte c’è roba interessante. Salta fin lì e prendila! (Saltando mentre corri andrai più lontano.)
6004=I tuoi salti hanno dato frutto! Hai trovato una torcia. Cercala nell’inventario e provala. Ti tornerà utile al buio.
6005=Prova questa Mac-10 sui bersagli. Il fuoco secondario ti permette di sparare con più precisione. Quasi tutte le armi di Blood II hanno un fuoco secondario.
6006=Avvicinati al telefono e premi il tasto Usa per rispondere. In Blood II puoi attivare molti oggetti con quel tasto.
6007=Sembra il vicolo che cerchi! Dovrai fare qualche bel salto per arrivarci.
6008=Il museo è in fondo a questo passaggio, ma il Comune ha pensato bene di bloccarti la strada con dei cassonetti. Servirà un po’ di agilità.
6009=Gideon è scappato passando per la lavanderia Laundro-Hut. Prendi il bucato e scendi!
6010=Trova la strada per la cattedrale. Occhio agli scagnozzi di Gideon e a quel che c’è di peggio...
6011=Gideon è qui da qualche parte. La Cabala ha blindato il posto. Attento alle misure di sicurezza.
6012=L’arma a singolarità di Gideon ha avuto uno strano effetto. Invece di distruggerti, ha riportato indietro Gabriel. Gideon è scappato di nuovo. Non c’è tempo per le rimpatriate.
6013=Si dice che qui vicino ci sia un ingresso sotterraneo a un impianto della Cabalco. Scommetteresti l’ultima cartuccia che Gideon si dirige lì.
6014=Apriti la strada a colpi d’arma da fuoco e trova qualche pulsante da premere!
6015=Ora puoi attraversare il nastro trasportatore strisciando senza rischi.
6016=Devi trovare il modo di raggiungere il piano successivo.
6017=Pare proprio che sia il momento di trovare un’altra strada!
6018=La tessera magnetica della CRU ti permetterà di attivarla.
6019=Qui vicino dovrebbe esserci un ascensore diretto al tetto.
6020=Una delle guardie del corpo di Gideon è nelle vicinanze. Dovrai superarla se vuoi avere una possibilità di colpire il pezzo grosso.
6021=Volare non ti è mai piaciuto. Meglio raggiungere il compartimento anteriore prima che ti venga la nausea.
6022=Questo affare deve tornare a terra. Il pulsante di autodistruzione dovrebbe essere sul ponte di comando.
6024=Eh già, a questo posto farebbe bene un esorcismo! Magari scoprirai anche che cosa sta tramando Gideon.
6025=Il treno è fuori controllo. Prendi il comando.
6026=Trova Gideon nel covo inagibile della Cabala.
6027=Questa parte della città è invasa e l’unica via d’uscita era la metropolitana, che ora è distrutta. Scappa passando dall’ingresso del seminterrato nel vicolo qui vicino.
6028=Ti hanno teso una trappola! Di sicuro in questo momento diverse squadre di fanatici della Cabala ti stanno venendo addosso. Torna in strada.
6029=La Cabala ha organizzato un’imboscata. Cerca di uscirne vivo.
6030=Trasforma questo stabilimento di lavorazione della carne in un mattatoio!
6031=Il tritacarne ha aperto la porta del nastro trasportatore. Sali sul nastro e attraversa il tritacarne per proseguire.
6032=Torna a fare strage!
6033=L’accesso alla metropolitana è bloccato. Trova il tunnel dell’espresso per il centro.
6034=Trova il capolinea della linea blu per scappare da questa parte della città.
6035=Trova un modo per entrare nella stazione.
6036=L’accesso alla linea blu è aperto. Trovalo e levati di mezzo!
6037=Attento al treno.
6038=Cerca un percorso alternativo per raggiungere la stazione.
6039=Questo è il treno sbagliato. Raggiungi quello che viaggia davanti a te.
6040=Fatti strada nei sotterranei di Saqqara.
6041=Il comando manuale ha abbassato il ponte. Ora trova il modo di tornarci.
6042=Trova il modo di abbassare il ponte e attraversarlo. Fa’ attenzione, il posto pullula di parassiti della Cabalco.
6043=Sembra l’unica via per entrare nella sede della Cabala. Cerca di superare i cancelli di sicurezza senza fare troppa carneficina.
6045=La porta davanti a te conduce a ricerca e sviluppo. Il generatore di singolarità di cui parlano tutti potrebbe essere lì. Trova un modo per disattivare il sistema di sicurezza.
6046=Gideon deve essere qui da qualche parte. Per lui il posto più sicuro è il più lontano da te. Finirà in un bagno di sangue. Spero che tu abbia portato secchio e straccio.
6049=I comandi del sistema di sicurezza si trovano nel settore 4 della centrale elettrica. Sai cosa fare quando li trovi. Non stupirti se qui sotto incontri le forze della Cabala.
6050=È il momento di fare un po’ di ricerca per conto tuo. Trova quello scienziato svitato. Forse ti dirà dove tiene il generatore di singolarità.
6051=Sei quasi in cima all’edificio. A Gideon restano ben pochi nascondigli. Magari è sotto una scrivania. Fai saltare tutto e lo scoprirai!
6052=Trova Gideon e il portale per l’Antico.
