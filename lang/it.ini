6054=Trova una via attraverso il labirinto e prosegui verso il cimitero della Cabala.
6055=Manda i seguaci della Cabala verso la luce.
6056=L’uscita del labirinto è chiusa. Forse la soluzione è nella torre che domina il labirinto del giardino.
6057=Entra in casa e raggiungi la SOFFITTA. Trova l’album di fotografie e distruggilo.
6058=Basta con il numero di JoJo. Riprendi a conquistare il mondo. Prima, però, devi superare i tuoi carcerieri.
6059=Trova il modo di uscire. Tutta questa roba religiosa ti mette i brividi.
6060=In questa città non c’è posto per nessuno! Ammazzali tutti!
6061=Sembra che l’Incubo voglia prima farti conoscere alcuni dei suoi amici…
6062=Si è aperto un nuovo passaggio. Trovalo e seguilo fino alla battaglia finale…

