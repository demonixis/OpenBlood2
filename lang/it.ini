sounds.events.davoice1=Benvenuti al Museo di Antichità Lafayette. Durante la visita non perdetevi le nostre esposizioni egizie appena restaurate. La mostra speciale di oggi è dedicata a culti e rituali. Nell’ala nord troverete una riproduzione in scala uno a due di una mitica divinità di culto.
sounds.events.davoice2=Gli Inca adoravano le alte cime che squarciavano i cieli sudamericani. Quelle vette impervie erano per loro un mezzo per avvicinarsi al dio Sole, al centro della loro religione. Su quelle cime fredde e imprevedibili celebravano numerosi sacrifici.
sounds.events.davoice3=Queste antiche mummie sono state riportate alla luce nelle tombe sotto Saqqara. Dall’alba della civiltà egizia al suo tramonto, oltre 3000 anni dopo, Saqqara fu il luogo di sepoltura dell’élite della vicina Menfi. Nell’epoca protodinastica e nell’Antico Regno diversi sovrani egizi scelsero di farsi seppellire a Saqqara.
sounds.events.vent2=Sono ustionato molto, molto gravemente, ma non sono ancora del tutto morto.
sounds.phones.phone11=Chi parla? Smettila di chiamare qui!
sounds.phones.phone12=Ai miei tempi non c’erano i generatori di singolarità. Il sacerdote Drudge lo ammazzavamo a mani nude! E ci piaceva! Alzava la mano, afferrava la sua sanguisuga delle ossa e se la strappava via!
sounds.phones.phone13=Ai miei tempi non c’erano sanguisughe vitali! Quei Drudge delle anime li ammazzavamo a mani nude! Dovevamo staccargli le gambe a morsi, e loro tornavano sempre! Non ce ne importava niente! Ci piaceva così!
sounds.phones.phone2=Ehm, buongiorno, buon pomeriggio, buonasera, signor Cal Eb. Chiamo da una società di ricerche di mercato. Stiamo facendo un sondaggio sui videogiochi. Non stiamo cercando di venderle nulla. Prima domanda: è o è mai stato un personaggio di un videogioco?
sounds.phones.phone4=Il numero selezionato è al momento fuori servizio. Rimanga in linea come un idiota e non risponderà nessuno. Questo è un messaggio registrato.
sounds.phones.phone6=Perché non trovo Amanda Huggin’ Kiss? Mi aiuta a trovare Amanda Huggin’ Kiss?
sounds.phones.phone8=Qualcuno controlli se nel bagno degli uomini c’è un culone!
