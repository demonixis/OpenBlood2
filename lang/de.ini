sounds.events.psvoice1=Doktor Vandervoort, bitte melden Sie sich im Sektionsraum. Wir haben einen Patienten mit starker Blutung.
sounds.events.psvoice10j=Denken Sie daran: Fortschritt geht vor Sicherheit.
sounds.events.psvoice11j=Achtung, auf Ebene 3 befindet sich ein Eindringling. Er ist bewaffnet und äußerst gefährlich. Nähern Sie sich dem Mann unter keinen Umständen. Laufen Sie vielmehr so schnell wie möglich in die Gegenrichtung. Vielen Dank und einen schönen Tag.
sounds.events.psvoice2l=Doktor Kohler, bitte zum Empfang. Doktor Kohler, melden Sie sich bitte am Empfang. Ihr Freund wartet.
sounds.events.psvoice3=Doktor Cattell, Notfall in Untersuchungslabor 7.
sounds.events.psvoice7l=Doktor Coleman zur Neurologie. Doktor Coleman, bitte melden Sie sich in der Neurologie.
sounds.events.psvoice8l=Das Personal der Ebenen 10, 11 und 12 wird gebeten, sich zur Dekontamination zu melden.
sounds.events.tavoice1=Willkommen beim Cabalco-Überlandverkehr. Wir wissen, dass Sie bei öffentlichen Verkehrsmitteln die Wahl haben, und freuen uns, dass Sie sich für Cabalco entschieden haben.
sounds.events.tavoice2a=Der Cabalco-Überlandverkehr wird modernisiert. Überfälle sind um 13 % zurückgegangen, wahllose Prügeleien um 6 %, Morde um 3 % und Totalausfälle um ganze 7 %. Tierverstümmelungen sind leider um satte 96 % gestiegen.
sounds.events.tavoice3=Es ist streng verboten, Mitreisende mit spitzen Gegenständen aufzuspießen. Vielen Dank.
sounds.events.tavoice4=In den Verkehrsmitteln von Cabalco gilt Rauchverbot. Vielen Dank.
sounds.events.tavoice5=Wir erreichen in Kürze den Innenstadt-Express.
sounds.events.tavoice6=Nächster Halt: Pickman Street.
sounds.events.tavoice7=Wir fahren jetzt in das Industriegebiet ein.
sounds.events.tavoice8=Nächster Halt: Ingram Street.
sounds.events.tavoice9=Bitte halten Sie Arme und Beine jederzeit im Zug. Wenn es schnell gehen muss, können abgetrennte Gliedmaßen in die sterilen Behälter an jedem Ausgang geworfen werden. Vielen Dank, dass Sie den Cabalco-Verkehr sauber und sicher halten.
