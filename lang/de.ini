sounds_ao.chosen.ophelia.oph21=Ich muss diese Fotoalben vernichten!
sounds_ao.chosen.ophelia.oph22=Geschafft! Meine Vergangenheit ist ausgelöscht. Jetzt kann ich der Kabale beitreten!
sounds_ao.chosen.ophelia.oph23=Hey, was machst du in meiner Geschichte?
sounds_ao.chosen.ophelia.oph24=Ähm … Du träumst schlecht, Caleb, mein Lieber. Nur ein Albtraum.
sounds_ao.chosen.ophelia.ophint11.1=Sehr witzig. Um euch diese Geschichte zu erzählen, muss ich euch in ein kleines Geheimnis einweihen.
sounds_ao.chosen.ophelia.ophint11.2=Sagt es aber nicht Caleb. Er würde mir nie verzeihen. Wisst ihr, vor sehr langer Zeit …
sounds_ao.chosen.ophelia.ophint11.3=Bevor ich von der Weltherrschaft träumte, war ich nur ein quirliges Mädchen in einer Studentinnenverbindung.
sounds_ao.chosen.ophelia.ophint12.1=Ja, ich weiß, Ish. Klingt verdammt unwahrscheinlich. Ist aber wahr. Mein kleines dunkles Geheimnis.
sounds_ao.chosen.ophelia.ophint12.2=So lernte ich die Kabale kennen. Eines Tages schickten sie eine Horde Zombies los, um den Campus einzunehmen.
sounds_ao.chosen.ophelia.ophint12.3=Angeblich hatte dort irgendein genialer Student ein Wiederbelebungsserum erfunden. Das bezweifle ich.
sounds_ao.chosen.ophelia.ophint12.4=Wie Zombies nun mal sind, zog es sie dorthin, wo die meisten wehrlosen, spärlich bekleideten Frauen waren: ins Haus meiner Verbindung.
sounds_ao.chosen.ophelia.ophint12.5=Ich hatte ohnehin genug vom fröhlichen Dasein. Statt meine Schwestern zu retten, wollte ich die blondierten Haare loswerden …
sounds_ao.chosen.ophelia.ophint12.6=… und bei der Kabale einsteigen. Wenn sie von meiner Studentinnenverbindung erfuhren, würden sie mich nie aufnehmen.
sounds_ao.chosen.ophelia.ophint12.7=Die Zombies würden sich um die Mädchen kümmern. Aber die Fotoalben waren noch im Haus. Ich musste sie vernichten.
sounds_ao.chosen.ophelia.ophint31=Also, Gabby, du bist dran. Was ist deine Geschichte?
sounds_ao.chosen.ophelia.ophint32=Und?
sounds_ao.chosen.ophelia.ophint33=Kein dunkles Geheimnis? Keine kitschige Verschwörung?
sounds_ao.chosen.ophelia.ophint34=Soweit ich sehe, hast du sie schon erzählt.
sounds_ao.chosen.ophelia.ophint35=Na, jetzt wird’s interessant!
sounds_ao.chosen.ophelia.ophintro=Er war schon immer ein mieser Geschichtenerzähler.
sounds_ao.enemies.gideon.gideoni1.1=Ach ja, hallo. Ihr erinnert euch sicher an mich? Gideon, machtbesessen und eitel?
sounds_ao.enemies.gideon.gideoni1.2=Einst erhob ich Anspruch auf den Thron der Götter. Tja, irgendwie ging mein Wunsch in Erfüllung.
sounds_ao.enemies.gideon.gideoni1.3=Meine unsterbliche Seele ist für alle Ewigkeit an diesen Schädel gefesselt. Caleb und seinen Auserwählten sei kein Dank.
sounds_ao.enemies.gideon.gideoni1.4=Nun ja, es hat keinen Sinn, darüber bitter zu werden.
sounds_ao.enemies.gideon.gideoni1.5=Vielleicht diene ich eines Tages einem unglücklichen Dramatiker als Muse, der sich hierher verirrt.
sounds_ao.enemies.gideon.gideoni1.6=Bis dahin, werter Spieler, will ich Euch mit dieser kleinen Anekdote unterhalten.
sounds_ao.enemies.gideon.gideoni2.1=Nach dem Sieg über den Uralten hatten die Auserwählten einen langen Heimweg durch die Anderswelt vor sich.
sounds_ao.enemies.gideon.gideoni2.2=Mit dem einen oder anderen Dämon, der ihnen begegnete, kamen sie zurecht. Doch sie waren nicht bereit für …
sounds_ao.enemies.gideon.gideoni2.3=… den gewaltigen Schrecken, der durch das Ödland schlich. Den Albtraum.
sounds_ao.enemies.gideon.gideoni2.4=Töricht wie sie waren, luden die Auserwählten diesen Teufel geradezu ein, als sie beschlossen, sich Gruselgeschichten zu erzählen …
sounds_ao.enemies.gideon.gideoni2.5=… bei einem ihrer Mahlzeiten. Sie ahnten nicht, dass jeder von ihnen bald verschleppt werden würde …
sounds_ao.enemies.gideon.gideoni2.6=… in seine ganz persönliche Hölle. Seht zu und amüsiert Euch, werter Spieler.
sounds_ao.enemies.gideon.gideoni3.1=So endet unsere Geschichte. Caleb hat wieder einmal gesiegt. Anscheinend kann ihn nichts aufhalten.
sounds_ao.enemies.gideon.gideoni3.2=Manchmal wirkt es fast, als lenke die unsichtbare Hand eines Wesens aus einer anderen Welt seine Taten.
sounds_ao.enemies.gideon.gideoni3.3=Doch ich sollte nicht länger darüber nachdenken. Vorläufig begnüge ich mich damit, zuzusehen.
sounds_ao.enemies.gideon.gideoni3.4=Auf die Auserwählten warten noch viele Abenteuer. Geschichten zu erzählen, Schlachten zu schlagen und Reiche zu schmieden.
sounds_ao.enemies.gideon.gideoni3.5=Vielleicht finde ich eines Tages einen Weg zurück.
sounds_ao.enemies.gideon.gideoni3.6=Und an jenem Tag, das versichere ich Euch, wird Caleb brennen.
sounds_ao.enemies.tchernobog.tcherno31=Ishmael. Hör zu.
sounds_ao.enemies.tchernobog.tcherno32=Du bist nicht länger JoJo. Geh. Töte diese Sterblichen und komm zu mir. Wir haben viel zu tun.

[intro]
line01=Wir sind die Cabal.
line02=Ich, Gideon, bin ihr finsterer und genialer Anführer.
line03=Wir haben seit jeher unter euch gelauert.
line04=Wie Maden im aufgeblähten, stinkenden Kadaver einer kranken Ratte.
line05=Diener dessen, der bindet, des dunklen Gottes Tchernobog.
line06=Bis vor einem Jahrhundert lief alles nach unseren finsteren Plänen.
line07=Wir hätten nie erwartet, dass uns einer der Unsrigen verrät.
line08=Sein Name war Caleb.
line09=Er vernichtete unseren Gott und nahm Tchernobogs Macht in sich auf.
line10=Ich, und ich allein, werde unseren dunklen Gott zurückbringen.
line11=Ich werde Caleb vernichten.
line12=Ich werde seine Eingeweide wie faulige Trauben unter meinen Füßen zertreten.
line13=Und Caleb wird zum letzten Mal sterben.

