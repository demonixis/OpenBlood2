3madsci1=Das kommt unerwartet. Hm, ich muss wohl die Singularitätseinstellungen neu kalibrieren.
7madsci1=Vertrauen Sie mir, diesmal sind meine Berechnungen perfekt.
10madsci1=Sir, ich muss Ihnen raten, es sich anders zu überlegen. Meine Berechnungen sind immer noch nicht eindeutig. Die Risse mögen, wie Sie meinen, eine Quelle unbegrenzter Macht sein, doch sie könnten auch tödliche Fallen im Gefüge der Raumzeit sein. Sie könnten Sie in ein Reich des reinen Chaos und Bösen führen, wo Sie vollkommen vernichtet würden.
10madsci2=Aber Sir!
10madsci3=Nein! ... Ich kam nie dazu ... Ihnen zu sagen ... wie sehr ich Sie liebe ...
12madsci1=Hallo, hallo, hallo. Willkommen in der Forschung und Entwicklung, oder F&E, wie ich sage. Sie dürfen mich ... Doktor nennen. Bei all den Schwankungen im kosmischen Substrat hatte ich zuletzt einige interessante Versuchspersonen. Aber auf Ihre ... Sektion freue ich mich besonders. Bitte kommen Sie ins Hauptlabor, dann beginnen wir das Experiment ...
