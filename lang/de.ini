sounds.events.davoice1=Willkommen im Lafayette-Antikenmuseum. Besuchen Sie auch unsere frisch restaurierten ägyptischen Ausstellungen. Unsere heutige Sonderausstellung widmet sich Kulten und Ritualen. Im Nordflügel finden Sie den Nachbau einer mythischen Kultgottheit in halber Größe.
sounds.events.davoice2=Die Inka verehrten die hohen Gipfel, die in den südamerikanischen Himmel ragten. Über diese schroffen Berge glaubten sie dem Sonnengott näherzukommen, der im Mittelpunkt ihrer Religion stand. Auf den kalten, unberechenbaren Gipfeln brachten sie viele Opfer dar.
sounds.events.davoice3=Diese uralten Mumien wurden in Gräbern unter Sakkara gefunden. Von den Anfängen der ägyptischen Zivilisation bis zu ihrem Untergang über 3000 Jahre später diente Sakkara der Elite des nahen Memphis als Begräbnisstätte. In der Frühdynastischen Zeit und im Alten Reich ließen sich mehrere ägyptische Könige dort bestatten.
sounds.events.vent2=Ich bin ganz, ganz übel verbrannt, aber noch nicht ganz tot.
sounds.phones.phone11=Wer ist da? Hören Sie auf, hier anzurufen!
sounds.phones.phone12=Als ich jung war, gab’s keine Singularitätsgeneratoren. Den Drudge-Priester mussten wir mit bloßen Händen umbringen! Und wir mochten das! Der hat hochgegriffen, sich seinen Knochenegel gepackt und ihn abgerissen!
sounds.phones.phone13=Als ich jung war, gab’s keine Lebensegel! Wir mussten die Seelen-Drudges mit bloßen Händen umbringen! Wir mussten ihnen die Beine abbeißen, und sie kamen immer wieder! Das war uns egal! Uns hat’s so gefallen!
sounds.phones.phone2=Ähm, guten Morgen, guten Tag, guten Abend, Herr Cal Eb. Ich rufe von einem Marktforschungsinstitut an. Wir machen eine Umfrage zu Computerspielen. Mit diesem Anruf wollen wir Ihnen nichts verkaufen. Erste Frage: Sind Sie derzeit eine Figur in einem Computerspiel, oder waren Sie es jemals?
sounds.phones.phone4=Die gewählte Rufnummer ist zurzeit nicht in Betrieb. Bitte bleiben Sie wie ein Idiot in der Leitung, und niemand wird abheben. Dies ist eine Bandansage.
sounds.phones.phone6=Warum finde ich Amanda Huggin’ Kiss nicht? Können Sie mir helfen, Amanda Huggin’ Kiss zu finden?
