sounds.enemies.loudspeaker.2loudspker=Das Lafayette-Antikenmuseum ist jetzt geschlossen. Wir haben täglich von 15 bis 17 Uhr geöffnet. Der Eintritt kostet 17 Dollar. Bitte halten Sie Ihre Kinder jederzeit an der Leine. Vielen Dank.
