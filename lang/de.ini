3000=~Heutzutage kann man in der U-Bahn nicht mal in Ruhe die neue Ausgabe von Guns N’ Gibs lesen. Erst wagt es der Fahrkartenfritze, dir den Flachmann mit Ol’ Red ’99 abzunehmen. Dann hält dieser rückgratlose Zugführer den ganzen Zug eine Stunde lang an, bloß weil irgendein Rotzlöffel im Kinderwagen auf die Gleise gerollt ist! Du wolltest ihm gerade die Meinung geigen, da kam dir seine Stimme bekannt vor. Auf einmal drohte dein Tag ... interessant zu werden.
3001=~Das hat wehgetan. Verdammt wehgetan. Das letzte Mal warst du nach neunzehn Gläsern JoJo’s Black Label Nr. 47 am Stück bewusstlos. Wobei es wohl eher daran lag, dass du zu nah an der Eisbude standest, die du in die Luft gejagt hattest. Tja. Der blöde Verkäufer hätte dir keine Streusel auf dein Killer Kiddy Kone kippen sollen. Apropos Streusel. Du solltest Gideon finden und ihn großzügig auf die nächste Wand streuen!
3002=~Gideon ist entwischt, aber immer noch auf der Flucht. Bald rückst du ihm den Kopf zurecht und knipst ihm das Licht aus. Bis dahin hat er dir ein paar seiner fauligen Freunde überlassen. Diese pestverseuchten Fleischbrocken erinnern an die Untoten, die die Cabal früher am laufenden Band produziert hat. Bis auf die seltsamen Nähte auf ihrer Brust. Irgendwas ist an diesen wandelnden Kadavern anders. Aber hey, Fleischfetzen sind Fleischfetzen.
3003=~Das hat Spaß gemacht ... größtenteils. Gideon war leider nicht an Bord, aber jetzt weißt du, wo er steckt: in der Kathedrale! Zumindest laut dem Schild draußen. „30. OKT. GIDEON REFERIERT ÜBER DAS RITUALVERBRECHEN DER SÜNDE UND WIE MAN DAMIT DURCHKOMMT. WER FRÜH DA IST, ERLEBT AUCH SEIN KLEINES SYMPOSIUM ÜBER DIE UNGLAUBLICH MÜHSAME HALBWERTSZEIT EINES VENTILS!“ Seine Fans lässt er nie hängen. Schau vorbei und lass ihn wissen, dass du im Publikum sitzt.
3004=~Cabalcos Lafayette-Antikenmuseum kündigt eine neue Sonderausstellung an: Kulte und Rituale. Erleben Sie einen bemerkenswerten und lehrreichen Rundgang durch die Geschichte der bizarrsten fanatischen Vereinigungen der Welt, von der verfluchten Sekte des bellenden Laubfrosches bis zu den gefürchteten Fes tragenden Shrinern. Opfern Sie unbedingt auch einen Augenblick für unsere neue Ausstellung mit einem animatronischen Dunklen Gott. Gruselig!
3005=~Mann, wie du Kanalisationen hasst! Der Geruch hat zwar was, aber irgendwann reicht es, durch die schwimmenden Brocken zu waten. Sobald du die Weltherrschaft hast, wird hier alles zur sanitärfreien Zone erklärt. Offene Abwasserkanäle haben einen Vorteil: Niemand muss Geld für Rohrreparaturen einplanen. Die Brühe findet von selbst ins Meer. So oder so riechst du selbst bei diesem Duft Gideons widerlichen Gestank. Der Feigling ist bestimmt auf dem Weg zu einem Versteck der Cabal.
3006=~Die Menschheit vermehrt sich wie die Kakerlaken und der ganze Planet platzt aus allen Nähten. Damit sind Krankheiten unser zweitgrößtes Geschäft! Das Cabalco-Zentrum für Krankheitsmanagement hat darin beinahe ein Monopol. Darauf sind wir stolz! Unsere hochmoderne Einrichtung bietet großzügige Forschungs-, Sektions- und Traumazentren. Wir sind führend bei Krankheiten, Seuchen und Gebrechen jeder Art. Vom Ebola-Virus bis zur guten, alten, köstlichen Syphilis. Unser Motto? Investieren und infizieren. Cabalco erledigt den Rest!
3007=~Gideon ist auf dem Weg zu einem der Vorstandsluftschiffe, die oben am Gebäude angedockt sind. Du solltest wohl weniger verkohltes Fleisch beim Beefy Queen um die Ecke verdrücken. Für die Treppe bist du jedenfalls nicht fit genug. Gideon hat sich bei BQ auch schon ordentlich Fleisch einverleibt. Deshalb hat er in jedem seiner Wolkenkratzer Expressaufzüge einbauen lassen. Über tausend Stockwerke nicht zu Fuß gehen zu müssen, ist nett. Wenn du nur diese infernalische Musik abschalten könntest!
3008=~Das Cabalco-Industries-Luftschiff Modell 1701D gehört zu den edelsten und vielseitigsten Fluggeräten, die je unseren verdreckten Himmel durchkreuzt haben. Vielseitig ist hier das Stichwort. Nutzen Sie Ihr Luftschiff gleichzeitig für Geschäftsreisen der Extraklasse und militärische Einsätze. Warum zweimal fliegen? Legen Sie dieses lästige kleine Land mit einem Bombenteppich in Schutt und Asche, während Ihre wichtigsten Kunden stilvoll an Bord reisen! Unter der Panzerung schlägt ein Herz aus Gold. Geräumige Sitze, gemütliche Kabinen, schwer bewaffnete Stewardessen und die besten Erdnüsse über den Wolken! Fliegen Sie Cabalco. Fliegen Sie mit Stil.
3009=~Wir stürzen ab! Nehmen Sie die Notlandeposition ein! Bitte stellen Sie Ihre Sitzlehne und Ihren Klapptisch auf und verriegeln Sie beides. Legen Sie den Kopf zwischen Ihre eigenen Beine. Falls Sie rauchen, löschen Sie sich bitte selbst. Einen schönen Tag noch und vielen Dank, dass Sie Cabalco Air gewählt haben.
3010=~In dieser Kathedrale findest du keine Nonnen! Der ansässige Schleicher aus dem Jenseits hat den Laden nach seinem Geschmack umgebaut. Du könntest dich hier selbst wohlfühlen, wenn der Preis stimmte und diese lästigen Cabal-Türsteher nicht mitverkauft würden. Na gut. Räum auf und finde heraus, wohin Gideon verschwunden ist. Vielleicht bleibt Zeit für einen hübschen Steinabdruck für die kahle Wand in deinem begehbaren Waffenschrank.
3011=~Sie betreten das Industriegebiet. Derzeit gilt Ozonstufe drei und Giftwarnstufe vier. Tragen Sie jederzeit Atemschutz. Die perfekte Gelegenheit, Cabalcos verbessertes Safe Sucks 2 auszuprobieren! Der günstige und unkomplizierte Schutz für jede Gelegenheit. Meiden Sie besonders gefährliche Bereiche, zum Beispiel das Freie. Einen sicheren Besuch und einen angenehmen Tag.
3012=~Früher waren Zugreisen zivilisierter. Heute kann man schon froh sein, wenn man lebend ankommt. Wenig baut so gut Stress ab, wie die Gegner in lebende, äh ... na ja, in Stücke zu schießen. Diese Cabal-Verstecke sind der Gipfel des Luxus. Der Gestank, die Einrichtung, die Ratten, die Atmosphäre und die Säufer. Apropos Verabredungen: Gideon sollte hier irgendwo sein. Das Treffen dürfte lustiger werden als Schießübungen auf die Säufer. Juhuuu!
3013=~Die Bürger von New Town haben offenbar zwei ernste Probleme. Sie fressen zu viel und scheißen ohne Ende. Eine tödliche Kombination ... für sie. Dem Gestank nach könnten ihre Rohre eine gute Reinigung vertragen. Da kommst du ins Spiel, unsterblicher Halbgott und lebender Einlauf. Natürlich ist Gideon schuld, dass du so tief gesunken bist. Knöcheltief in der Scheiße, um genau zu sein. Hm. Setz es auf seine Rechnung und treib die Schuld stückweise ein.
3014=~Hunger auf mehr Fleisch? Natürlich. Wir alle haben ihn! Bei Cabalco verstehen wir Fleisch und haben eine neue Produktlinie für alle Ihre Fleischbedürfnisse entwickelt. Fleisch aus der Dose! Günstig und köstlich! In all Ihren Lieblingssorten: Innereien, Rind, Geflügel, Schwein, Ziege und bodenfressender Fisch! Oder probieren Sie unsere neuesten Kreationen. Herrlich hefiges Sauerteigfleisch, feines Fleisch aus fermentierten Pflaumen und ganz leicht halluzinogenes Pilzfleisch! In Cabalcos Fleischfabriken entsteht die Nahrung von morgen. Und das Beste: durchschnittlich über 82 Prozent frei von E. coli!
3015=~Wenn du fröhlich bist und du weißt es, lass Hirne platzen ... Wenn du fröhlich bist und du weißt es, schneid die Adern auf ... Wenn du fröhlich bist und du weißt es, werden hüpfende Köpfe es beweisen ... Was gibt’s Schöneres, als seine Arbeit zu lieben? Schon wieder so ein unsäglicher Bahnhof? Wenigstens ist er hübscher als der letzte. Zeit, den alten Abzugsfinger arbeiten zu lassen. Du stehst hier eindeutig auf der falschen Seite der Gleise. Und wie immer könnte das Licht am Ende des Tunnels ein Zug sein.
3016=~Ha! Dieser Mistkerl Gideon dachte, er könnte dich mit dem alten Tauschtrick abschütteln. Träum weiter, feiner Herr! Wenn du ihn erwischst, tauschst du auch was. Du könntest seinen Kopf nehmen und ihm eine etwas tiefer sitzende Perspektive verschaffen. So lange, wie er den Kopf schon im eigenen Hintern hat, dürfte ihm der Anblick vertraut sein. Auf ins Gefecht und so weiter. Genug der warmen Gedanken. Es gibt zu tun, und diesmal wird die blaue Linie rot gestrichen. Blutrot.
3017=~Keine Lust mehr, Ihr hart verdientes Geld für Miete zu verpulvern? Natürlich nicht! Deshalb haben Ihre Freunde bei Cabalco Wohnbau und Immobilien gerade eine reizende neue Siedlung fertiggestellt. Bauland ist teuer und knapp, also haben wir die alte radioaktive Giftgrube am Love Canal einfach mit frischem Mutterboden zugeschüttet! Noch nie war ein neues Cabalco-Haus so günstig! Und falls Sie eine Familie planen, kaufen Sie groß! Ignorieren Sie Gerüchte über Unfruchtbarkeit, allgemeines Unwohlsein, ständiges Erbrechen, das allgegenwärtige „dreiköpfige Liebeskind“ oder sonstigen Unsinn. Bei Cabalco kümmern wir uns, und unsere Preise sind mehr als fair!
3018=~Von der Sicherheitsbilanz der örtlichen Verkehrsbetriebe wenig beeindruckt? Da hilft nur eins! Zerstör sie! Genau, reiß den Saftladen ab. Fahrkarte? Zur Hölle, nein! Die einzige Fahrkarte, die du brauchst, ist deine Knarre. Und die richtet beim Gegner ein ordentliches Chaos an. Freude an der Arbeit ist schon was Feines. Vielleicht solltest du diesmal kurz raus und abgestandene Luft schnappen. Die letzten Fahrten waren ein bisschen zu „eng“.
3019=~Na also, geht doch. Ganz wie zu Hause. Da möchte man sich hinlegen und den ewigen Schlaf antreten. Unsterblich zu sein, wird überschätzt. Viel anstrengender, als man denken würde. Wenigstens kannst du anderen zu etwas verhelfen, was du nie haben wirst. Sogar schneller, als sie es sich vorstellen können. Ganz wie du, immer freundlich und voller Nächstenliebe. Zeit, ihnen den Übergang zu erleichtern. Kommt raus, wo immer ihr seid ... ihr werdet jetzt, ähm, auserwählt.
3020=~Willkommen in New Town, Sitz der gewaltigen Konzernzentrale von Cabalco Industries! Aufstände und Unruhen sind kaum noch ein Problem. Über dem hübschen brennenden Fluss White Rock liegt New Town, das fast perfekte Bild einer Stadt unter der sanften Knute eines riesigen, skrupellosen Megakonzerns! Gut, gelegentliche Ritualopfer und nächtliche Entführungen gibt es noch. Und ja, manchmal verschwinden Leute spurlos. Doch die Straßen sind größtenteils sicher und sauber und unsere Wirtschaft wächst, von ein paar kleinen Rückschlägen abgesehen. Wir sind New Town! Cabalco ist unser Freund!
3021=~ Sorgen Sie sich um Ihre Zukunft? Wurden Sie in der Schule von den anderen terrorisiert? Suchen Sie einen Beruf, der Sie wirklich fordert? Dann treten Sie Cabalcos Sicherheitsabteilung bei. Sie wissen nicht, was ein harter Tag ist, bis Sie ihn nackt und schwitzend in einer kleinen, dunklen, fast luftleeren Metallkiste verbringen. In Gesellschaft von ein paar Dutzend hungriger Ratten und dem letzten Rest Ihres Verstands! Aber genug von mir. Unser Intensivprogramm aus Erniedrigungen und Prügeln macht einen neuen Menschen aus Ihnen! Nach zwölf Schritten bekommen Sie eine dicke Wumme und entscheiden täglich über Leben und Tod anderer. Den engstirnigen Mistkerlen von damals werden Sie es zeigen!
3022=~ Sie haben Cabalcos streng geheimen Hohen Tempel erreicht. Wir sind gerade nicht da. Spenden Sie gern Blut an der Tür, vorzugsweise von einem Menschen oder einer Ziege. Im Notfall entzünden Sie bitte 69 weiße Kerzen, ritzen mit den Fingernägeln ein großes Pentagramm in den Betonboden und tanzen nackt darin. Bemalen Sie sich zuvor mit dem Blut Ihrer aufgerissenen Fingerstümpfe und singen Sie zu Ehren unseres Dunklen Gottes. Ein heimtückischer Diener der Unterwelt ist in Kürze bei Ihnen. Vielen Dank für Ihre Geduld!
3023=~Willkommen am Kontrollpunkt Gnarly. Ha. Der Sicherheitsdienst hier wirkt ein wenig zu ... fanatisch. Es muss einen anderen Eingang zur Cabalco-Zentrale geben. Bis dahin solltest du etwas aufräumen und ein paar unwürdige Gegner ausschalten. Manchmal muss man etwas Dreck machen, um sauberzumachen. Zum Glück musst du keine Hirnmasse von den Wänden schrubben. Eingetrocknetes Zeug geht bestimmt furchtbar schlecht ab. Zeit, dir einen eigenen Pass mit „unbeschränktem Zugang“ zu machen.
3024=~Arbeit gesucht? Cabalco kann immer einen weiteren Körper gebrauchen! Wir stellen ständig ein, und was für Vorteile wir bieten. Sie arbeiten in einem riesigen neuen Wolkenkratzer. Auf jeder Etage stehen Limo- und Kaffeeautomaten. Unser, ähm, Gesundheitsprogramm ist nicht von dieser Welt. Selbst wenn Sie bei Cabalco auf der untersten Sprosse anfangen, haben Sie im Nu einen Untergebenen! Unsere, äh, Personalabteilung erspart Ihnen all den lästigen Kram, den andere Konzerne verlangen. Keine Erfahrung? Kein Problem! Wir verlangen nicht mal einen Lebenslauf, geschweige denn eine Bewerbung. Kommen Sie einfach vorbei, und Sie gehören uns. Ich meine, äh, Sie bekommen den Job. Cabalco bietet ungleiche Chancen.
3025=Das muss man Cabalco lassen. Ihr Architekt hat sich bei diesem Anwesen richtig ausgetobt. Weit geschwungene Treppen, seltsame, aber schöne Kunst, außergewöhnlich lustige Bürozellen und mehr Sprengziele, als man mit der Knarre anvisieren kann. Alles in allem ein netter Ort. Ein bisschen Feuer täte ihm gut. Aber die ganzen Kultisten, Drudges, Shikari und Fanatiker müssen weg. Fahrt zur Hölle. Geht nicht über Los. Zieht keine 200 Dollar ein. Das ziemlich knuddelige Behemoth wäre eine nette Ergänzung für deine Haustiersammlung. Leider ist es nicht stubenrein.
3026=~Zeit, diesen Mistkerlen den Saft abzudrehen. Zieh den Stecker. Kein Wechselstrom mehr! Zur Hölle, auch kein Gleichstrom mehr! Willkommen im Kraftwerk. Du bist der Netzausfall in Person. Hier brutzelt es vor Aufregung. So sehr, dass du in Sekunden knusprig gebraten werden könntest. Nach deinen letzten Zugerlebnissen hast du wenig Lust, auch noch zum Leiter zu werden. Zeit für das, was du am besten kannst: Sachen kaputtmachen. Und womit anfangen, wenn nicht mit ein paar Fanatikern? An die Arbeit, du lebender Schutzschalter.
3027=~Schließt Caleb die Risse wirklich? Bekommt Ophelia ihre geschenkten zwei Minuten? Was zum Teufel ist mit Gabriel ... äh, Gabriella passiert? Was, wenn Ishmael nicht nach Hause kommt? Und woher hat er diese Tattoos?|~Schalten Sie das nächste Mal wieder ein, wenn es heißt: „Es brennt, es brennt!“ Diese Antworten und mehr gibt’s bald, versprochen. Bis dahin stürzt euch in ein ordentliches BLUTBAD!!
3028=~Ach, die Wissenschaft! Du denkst gern an das erste Mal zurück, als du etwas sezieren durftest. Vor Aufregung hast du gezittert, als du dem stinkenden Kadaver die Haut abzogst. Mit der kleinsten Spannung hast du das Muskelgewebe zum Tanzen gebracht. Und wie überrascht du warst, als du aus Versehen den Darm geöffnet hast! Was für ein Spaß! Genug geträumt. Zeit, den Eingang zur Forschungsabteilung von Cabalco zu finden.
3029=~Nichts belebt so sehr wie eine wirklich feindliche Firmenübernahme! Das Spiel von Jäger und Gejagtem hatte schon immer seinen Reiz. Jetzt fängt es an, Spaß zu machen. Gideon gehen bald die Verstecke aus. Zeit, die Ratte in die Enge zu treiben. Ein bisschen Hausmeisterarbeit ist angesagt. Büros auszuräumen hat noch nie so viel Spaß gemacht! Wo war noch mal der Aufzug aufs Dach?
3030=~Da ist die Tontaube Gideon! Das geht gut über die Zunge: Taube Gideon. Juhuuu! Tontaubenschießen ist eins deiner Lieblingsspiele. Das wird ein Knaller! Für ihn. Los! Peng. Los! Peng. Los! Schluss mit der Rennerei, Gideon. Dein Flug ist vorbei, du Trottel. Dein Glück ist aufgebraucht.
3031=~Ein Kampf auf Leben und Tod. Vorzugsweise auf den Tod eines anderen. An Gideons Marionettenfäden zieht jetzt keiner mehr. Und für den Puppenspieler kommt die Quittung. Uralter? Hörst du zu? Dann hör gut hin ...
3032=~Irgendwas ist anders. Du kannst den Abzugsfinger nicht drauflegen. Deine alten Kumpels sehen reichlich blass aus, fast schon krank. Was hat sie bloß in diese Särge getrieben? Hm. Nichts, was eine Extraportion Blei nicht kurieren könnte. Blei in den Kopf und ab ins Bett. Gute Nacht, ihr Auserwählten. Giftige Träume.
3033=~Mit den Worten eines längst vergessenen Poeten, der sich kurzfassen konnte: „Mach es tot!“
