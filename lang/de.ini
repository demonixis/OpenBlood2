authored.fcfc192a55159c96.text=Jetzt solltest du in die Forschungsabteilung gelangen können. Geh hin und schau, was sich dort entwickelt.
authored.f509240c18010417.title=Ziel Nr. 1
authored.f509240c18010417.text=Nicht schon wieder dieser Laden! Na gut, vielleicht ist Gideon hier irgendwo. Die Aufzüge wären sein bester Fluchtweg gewesen. Worauf wartest du? Mach ihn fertig.
