[objectives]
heading=ZIELE
empty=Kein aktuelles Ziel
authored.876b96893e6e534e.title=Nichts wie raus hier!
authored.876b96893e6e534e.text=Du hast es geschafft. Das Luftschiff ist verloren. Verschwinde, bevor es dich mit in den Tod reißt!
authored.1655b5465594c073.title=Ziel Nr. 1
authored.1655b5465594c073.text=Ophelia ist zusammen mit Gideon in einem Riss verschwunden. Vielleicht sind sie ganz in der Nähe. Genau wissen kannst du es nicht. Sieh zu, dass du nicht das nächste Opfer wirst.
authored.fcfc192a55159c96.title=Ziel Nr. 1
authored.fcfc192a55159c96.text=Jetzt solltest du in die Forschungsabteilung gelangen können. Geh hin und schau, was sich dort entwickelt.
authored.f509240c18010417.title=Ziel Nr. 1
authored.f509240c18010417.text=Nicht schon wieder dieser Laden! Na gut, vielleicht ist Gideon hier irgendwo. Die Aufzüge wären sein bester Fluchtweg gewesen. Worauf wartest du? Mach ihn fertig.
authored.c9a269968f66b5ac.title=Arena
authored.c9a269968f66b5ac.text=Finde das Portal zum|Uralten.
authored.e395d02eb7f66023.title=Ziel Nr. 1
authored.e395d02eb7f66023.text=|Besiege den Uralten,|um die Ordnung im|Universum wiederherzustellen.
authored.1b23dee31a697548.title=Bleib in Bewegung!
authored.1b23dee31a697548.text=Schieß dir den Weg frei und such nach Schaltern!
authored.04dfc168e9f20485.title=Ducken und kriechen
authored.04dfc168e9f20485.text=Auf dem Förderband kannst du jetzt sicher weiterkriechen.
authored.e8938b9bf78b5c45.title=Jagen und töten
authored.e8938b9bf78b5c45.text=Du musst einen Weg ins nächste Stockwerk finden.
authored.36e16d96eef3f3f2.title=Nutzlose Aufzüge
authored.36e16d96eef3f3f2.text=Zeit, sich einen anderen Weg zu suchen!
authored.74ccd748f4e969fb.title=Benutz die CRU!
authored.74ccd748f4e969fb.text=Mit der CRU-Schlüsselkarte kannst du die CRU aktivieren.
authored.b99fc6253496e264.title=Fast geschafft ...
authored.b99fc6253496e264.text=In der Nähe sollte ein Expressaufzug aufs Dach führen.

[promotions]
bloodbath_title=BLUTBAD
bloodbath_tagline=RASANTE FRAG-DUELLE FÜR BIS ZU SECHZEHN SPIELER!
bloodbath_soon=IN KÜRZE !!!
blood_brother_title=BLUTSBRÜDER
blood_brother_body=Wähle deinen Auserwählten und stürz dich mit bis zu vier Spielern gemeinsam ins Gemetzel!
blood_feud_title=BLUTFEHDE
blood_feud_body=Explosive Arenakämpfe für bis zu 16 Spieler! Wähle dein Team und schalte die Gegner aus.
info_title=BESTE HAPPEN
info_characters=Vier anpassbare Figuren für ein hemmungsloses Gemetzel!
info_weapons=Zwanzig Waffen auf Leben und Tod! Erledige Gegner mit Leuchtpistole und Voodoo-Puppe oder richte mit Todesstrahl und Singularitätsgenerator Chaos an!
info_levels=Über dreißig blutige Einzelspielerlevel. Koop folgt in Kürze!
info_maps=Über zehn rasante Arenen fürs Blutbad. Die Blutfehde folgt in Kürze!
info_network=Mehr Spaß im Mehrspielermodus mit voller GameSpy- und Heat-Unterstützung.
info_editor=Level-Editor und Spielquellcode gratis für registrierte Nutzer. Lass deinen Mod-Ideen freien Lauf!
info_engine=Blood 2 The Chosen nutzt Monoliths LithTech-3D-Engine mit dynamischer Beleuchtung, spektakulären Effekten und breiter 3D-Hardwareunterstützung!
modes_title=EINZELSPIELER-ACTION
modes_caleb=Caleb zerlegt Cabalco Stück für Stück und Leiche für Leiche. Die übrigen Auserwählten helfen in den Zwischensequenzen.
modes_chosen_title=DIE AUSERWÄHLTEN
modes_chosen=Wähle deinen liebsten Auserwählten und stürz dich ins Gemetzel! Überspring die Zwischensequenzen und leg direkt los!

[dialogue]
4prophet1=Ich bleibe.
1acaleb1=Na los, komm schon!
1acaleb2=Endstation.
2caleb1=Du hast gerade deinen zweiten Fehler gemacht. Du bist geblieben.
2caleb2=Mich am Leben zu lassen.
3caleb1=... Gabriel?
3caleb2=Erzähl das jemandem, den’s interessiert.
3caleb3=Die Dinge haben sich geändert. Aber das muss ich dir wohl nicht sagen.
3caleb4=Du bist nicht mein Typ.
4caleb1=Du hast die Wahl. Geh jetzt und leb. Bleib, und du stirbst.
4caleb2=Dann stirbst du eben.
bmpr1caleb1=Ich hasse Fliegen.
5caleb1=Das könnte böse enden.
6caleb1=Die gehören nicht zur Cabal.
6caleb2=Das ist was anderes.
6caleb3=Ich muss einen Zug erwischen. Man sieht sich.
8caleb1=Du machst wohl Witze.
7caleb1=Du hast ja keine Ahnung.
7caleb2=Klar doch. Ich laufe mich gerade erst warm.
7caleb3=Ich bin die Verdrängung in Person. Ich stelle mich gar nichts.
7caleb4=Ich brauche keinen Babysitter.
9caleb1=Oh, ich werde noch viel mehr tun.
9caleb2=Abgefahren.
9caleb3=Lass es brennen. Ich mochte den Laden sowieso nie.
9caleb4=Pizza.
9caleb5=Strip-Bote.
11caleb1=Ich habe davon geträumt, dich so gefesselt zu sehen.
11caleb2=Gib mir einen Kuss, Süße.
11caleb3=Ach, du schon wieder. Kannst du in zwei Minuten wiederkommen?
11caleb4=Ophelia! Na gut, das reicht. Jetzt stirbst du!
13caleb1=Dein restliches Leben wird in Sekunden gemessen, du Pfeife.
14caleb1=Dann muss ich dir eben weiter in den Hintern treten.
14caleb2=Ich hab nie behauptet, schlau zu sein.
15caleb1=Nur zu. Ich sehe zu.
15caleb2=Auf zum Tanz, Butzemann.
16caleb1=Wenn du in die Hölle kommst, sag, ich schicke dich. Dann kriegst du Rabatt.
16caleb2=Entspann dich, du bist tot.
16caleb3=Zu spät, du bist schon tot.
16caleb4=Das Leben ist nicht fair, der Tod auch nicht. Gewöhn dich dran.
16caleb5=Vielen Dank und gute Nacht.
17caleb1=Nö.
17caleb2=Gleich verletzt du noch meine Gefühle.
17caleb3=Na?
17caleb4=Genug geredet. Kämpfen wir.
19caleb1=Na, hallo, Herr Schnösel. Verzeih, wenn ich dir nicht die Hand gebe.
20caleb1=Von so was hab ich keine Ahnung.
20caleb2=Was willst du tun, mir den Hintern versohlen?
20caleb3=Halt jetzt die Klappe, ich muss mich konzentrieren.
20caleb4=So was wie ein geistiger Einlauf. Im guten Sinne.
3gab1=Was zur Hölle ist das?
3gab2=Caleb?
3gab3=Gabriella. Das ist eine lange Geschichte.
3gab4=Begrüßt man so einen alten Freund?
3gab5=Ich muss mit dir kommen. Ich will wissen, was hier los ist.
3gab6=Hast du mal in den Spiegel gesehen? Du bist selbst keine Schönheit.
6gab1=Die Dinger sind überall. Die Cabal muss ziemlich verzweifelt sein, wenn sie solche Kreaturen erschafft.
6gab2=Was sind sie dann?
6gab4=Was machst du da?
6gab5=Keine Sorge, Kleiner. Wir sehen uns wieder.
14gab1=Wir müssen ihm hinterher. Wer weiß, was ihn da erwartet.
17gab1=Insekt, wir sind der Uralte. Wirf dich vor uns nieder.
17gab2=Nur du stehst zwischen uns und der Herrschaft? Erbärmlich.
17gab3=Alles, was ist, wird nicht mehr sein. Alles, was war, ist nie gewesen. Alles, was kommen sollte ... äh ...
17gab4=Alles, was kommen sollte, wird nie ... geschehen.
20gab1=Ich bringe euch beide um, wenn ihr nicht die Klappe haltet.
1agid1=Hier spricht Gideon, euer Gastschaffner! Haltet euch gut fest. Die Fahrt könnte ein bisschen ... blutig werden!
1agid2=Ich weiß, dass du hier bist, Caleb. Ich freue mich schon darauf, dir die Milz rauszureißen und sie als Hut zu tragen.
2gid1=Du hast nicht viel Glück mit Zügen, was?
2gid2=Ach, wirklich? Was war mein erster Fehler?
3gid1=Zeit zu sterben, Auserwählter.
7gid1=Diesmal sollte es besser funktionieren.
7gid2=Ishmael?
7gid3=Diesmal hattest du Glück, Verräter. In ein paar Stunden ist alles wieder in Ordnung und ich bin dich für immer los. Jetzt muss ich gehen. Keine Sorge, meine Truppen leisten dir Gesellschaft. Seid schön brav.
10gid1=Klingt wie zu Hause.
10gid2=Geh mir verdammt noch mal aus dem Weg!
11gid1=Ich dachte mir schon, dass du herkommst.
11gid2=Tut mir leid, dieses reizende Wiedersehen zu stören, Verräter. Ich muss dich bei Laune halten.
14gid1=Es ist noch nicht vorbei! Du wirst mich nie wirklich besiegen!
15gid1=Ah, Caleb. Dich habe ich erwartet, du berechenbarer Tölpel. Ich brauche nur einen Moment. Ich bin gerade dabei, mich zu ... verwandeln ...
15gid2=... in etwas ... Unerfreuliches.
15gid3=Wie gefällt dir mein neues Aussehen? Du hast ja keine Ahnung, wie köstlich sich Schmerz anfühlen kann. Gestatte mir, es dir zu zeigen.
15gid4=An dir, versteht sich!
16gid1=Nein! Das ist nicht fair! Ich bringe dich um!
7ish1=Das ist eine überraschende Entwicklung.
7ish2=Einen schlechten Tag?
7ish3=Ist dir klar, wie viel Schaden du anrichtest?
7ish4=Das meine ich nicht. Du bist der, der bindet. Früher oder später wirst du dich dem stellen müssen.
7ish5=Dann wisse dies: Wir sind die Auserwählten. Wir sind für dich da, ob es dir gefällt oder nicht.
7ish6=Ja, auch Ophelia. Sie ist als Erste hindurchgekommen.
7ish7=Das würde ich um nichts in der Welt verpassen. Andererseits könntest du die Welt am Ende zerstören.
9ish1=Du denkst an Ophelia. Rührend.
9ish2=In Gideons Tempel gibt es einen dauerhaften Riss. Dort konzentriert sich all der Schaden, der angerichtet wird. Das Epizentrum sozusagen. Dort findest du Ophelia.
9ish3=Tchernobogs Vernichtung hat viele Türen zwischen den Welten geöffnet. Nur der, der bindet, kann sie versiegeln. Diese Kraft liegt in dir. Diese Wirklichkeit geht unter, wenn du sie nicht wiederherstellst.
9ish4=Eine andere Wirklichkeit drängt sich durch die Risse, uralt und gefräßig. Sie ist weder gut noch böse, sie ist einfach da. Aber sie wird uns alle verschlingen.
14ish1=Du wirst ihm doch nicht folgen, oder?
14ish2=Ich vermute, dass es etwas sehr Unangenehmes ist.
17ish1=Insekt, wir sind der Uralte. Wirf dich vor uns nieder.
17ish2=Nur du stehst zwischen uns und der Herrschaft? Erbärmlich.
17ish3=Alles, was ist, wird nicht mehr sein. Alles, was war, ist nie gewesen. Alles, was kommen sollte ... äh ...
17ish4=Alles, was kommen sollte, wird nie ... geschehen.
20ish1=Es ist noch nicht vorbei, Caleb. Du musst die Risse versiegeln. Du musst das Gefüge dieser Wirklichkeit wieder zusammenbinden, bevor es auseinanderreißt.
20ish2=Die Kraft liegt in dir. Es ist Zeit, sie einzusetzen.
3madsci1=Das kommt unerwartet. Hm, ich muss wohl die Singularitätseinstellungen neu kalibrieren.
7madsci1=Vertrauen Sie mir, diesmal sind meine Berechnungen perfekt.
10madsci1=Sir, ich muss Ihnen raten, es sich anders zu überlegen. Meine Berechnungen sind immer noch nicht eindeutig. Die Risse mögen, wie Sie meinen, eine Quelle unbegrenzter Macht sein, doch sie könnten auch tödliche Fallen im Gefüge der Raumzeit sein. Sie könnten Sie in ein Reich des reinen Chaos und Bösen führen, wo Sie vollkommen vernichtet würden.
10madsci2=Aber Sir!
10madsci3=Nein! ... Ich kam nie dazu ... Ihnen zu sagen ... wie sehr ich Sie liebe ...
12madsci1=Hallo, hallo, hallo. Willkommen in der Forschung und Entwicklung, oder F&E, wie ich sage. Sie dürfen mich ... Doktor nennen. Bei all den Schwankungen im kosmischen Substrat hatte ich zuletzt einige interessante Versuchspersonen. Aber auf Ihre ... Sektion freue ich mich besonders. Bitte kommen Sie ins Hauptlabor, dann beginnen wir das Experiment ...
11oph1=Der Märchenprinz, nehme ich an.
11oph2=Schneid mich los und ich schenke dir einen ganzen Vanillekuchen.
14oph1=Er will, dass du ihm folgst, du dummer Mistkerl.
14oph2=Worauf warten wir?
17oph1=Insekt, wir sind der Uralte. Wirf dich vor uns nieder.
17oph2=Nur du stehst zwischen uns und der Herrschaft? Erbärmlich.
17oph3=Alles, was ist, wird nicht mehr sein. Alles, was war, ist nie gewesen. Alles, was kommen sollte ... äh ...
17oph4=Alles, was kommen sollte, wird nie ... geschehen.
20oph1=Du hast keine Wahl. Hör auf Ishmael, du Idiot.
20oph2=Ich versohle dir den Hintern, wenn du mir meinen versohlst.
sounds.chosen.caleb.e1m1_1_cal=Ich bin kein böser Traum. Ich bin ihr schlimmster Albtraum.
sounds.chosen.caleb.e1m3_2_cal=So was bauen sie heute einfach nicht mehr.
sounds.chosen.caleb.e1m4_1_cal=Sieht aus, als gäb’s was zu töten.
sounds.chosen.caleb.e1m4e5a_cal=Woher soll ich das wissen? Was schert’s dich? Du scheinst keine Probleme mit ihm zu haben.
sounds.chosen.caleb.e1m4e7a_cal=Was soll das heißen?
sounds.chosen.caleb.e1m4e9a_cal=Ich werde das lösen!
sounds.chosen.caleb.e1m5_1_cal=Hey, der Laden sollte mir eine Provision zahlen.
sounds.chosen.caleb.e2m5_1_cal=Jetzt ist Kasperletheater, Kinder. Der Bösewicht ist da.
sounds.chosen.caleb.e2m5_2_cal=Tja, so kann man jemanden auch aufmachen. Aber meine Methode ist schneller und macht mehr Spaß.
sounds.chosen.caleb.e2m5_4_cal=Uäh, ich fühle mich wie ein Stück Fleisch.
sounds.chosen.caleb.e3m1_2_cal=Na also, jetzt geht’s richtig los!
sounds.chosen.caleb.e3m1_3_cal=Ach, nichts ist je einfach.
sounds.chosen.caleb.e3m2_1_cal=Was für eine Verschwendung guter Munition!
sounds.chosen.caleb.e3m2_2_cal=Hm, eine Sicherheitskontrolle. Ach, verdammt. Da haben sie mich wohl ausgetrickst. Ich muss umkehren.
sounds.chosen.caleb.e3m2_3_cal=Wow, bei so geräumigen Unterkünften sollte ich mich vielleicht hier bewerben.
sounds.chosen.caleb.e3m3_1_cal=Guten Morgen! Und falls wir uns nicht mehr sehen: Guten Tag, guten Abend und gute Nacht!
sounds.chosen.caleb.e3m3_2_cal=Das ist er. Das ist der Mann, den ich suche.
sounds.chosen.caleb.e3m3_3_cal=Ich bin kein Mechaniker. Meistens tue ich Leuten einfach nur weh. Abwärts.
sounds.chosen.caleb.e3m5_1_cal=Dieser Ort wirkt fast unwirklich, findest du nicht?
sounds.chosen.caleb.e3m5_3_cal=Die Brücke sieht absolut sicher aus.
sounds.chosen.caleb.e3m5_4_cal=Ein Paradebeispiel für die typische Bauweise der Cabal.
sounds.chosen.caleb.kill.c_1liner_2=Alle sterben.
sounds.chosen.caleb.msc11cal=Ich würde mich entschuldigen, aber du weißt, dass es nicht ehrlich gemeint wäre. Schönen Tag noch.
sounds.chosen.caleb.msc14_cal=Mmm, nichts geht über frisch abgepacktes Fleisch.
sounds.chosen.caleb.msc15_cal=Fleischbeschau. Ich fürchte, ich muss Ihren Laden dichtmachen.
sounds.chosen.caleb.msc18_cal=Zurück zur Plackerei ...
sounds.chosen.caleb.msccaleb1=Abgeschlossen.
sounds.chosen.caleb.taunt.tnt5_cal=Tja, und ich dachte, ich wär hässlich.
sounds.chosen.gabriella.e1m4e3_gab=Jemand muss den Zug aufhalten. Die Dinger sind da draußen überall. Die Cabal muss ziemlich verzweifelt sein, wenn sie solche Kreaturen erschafft.
sounds.chosen.gabriella.e1m4e6_gab=Ich habe keine Probleme. Ich löse sie.
sounds.chosen.gabriella.e1m4e8_gab=Ich weiß nicht, ob ich noch auf dich zählen kann. Die Lage wird übel. Und wenn du das nicht lösen kannst, dann mach ich’s.
sounds.enemies.civilian.02civ1=Hey, Kumpel, alles in Ordnung? Du siehst furchtbar aus.
sounds.enemies.civilian.02civ3=Hey, der Zug fährt wohl nicht mehr. Weißt du was? Nehmen wir doch ein Taxi.
sounds.enemies.civilian.02civ4=Willst du den ganzen Tag bellen, kleiner Kläffer, oder auch mal beißen?
sounds.enemies.civilian.02civ5=Hier sind keine Waffen erlaubt, Kumpel! Außer du kaufst sie mir.
sounds.enemies.civilian.11civ2=Alles außer Hamburgern.
sounds.enemies.civilian.11civ4=Ja, ich hab hier einen Hotdog für dich.
sounds.enemies.civilian.12civ2=Ach, Mist!
sounds.enemies.civilian.12civ3=Keiner zu Hause. Geh weg.
sounds.enemies.civilian.12civ4=Lass mich in Ruhe!
sounds.enemies.civilian.12civ5=Ich will nichts!
sounds.enemies.civilian.spot11=Ach, Scheiße. Das ist nicht mein Tag.
sounds.enemies.civilian.spot2=Hier ist ja das reinste Irrenhaus!
