6001=Gideon hat dir die Fahrt verdorben und rennt jetzt davon wie ein Feigling. Lässt du dir das gefallen? Folge ihm zum Museum und gib ihm, was er verdient. Pass unterwegs auf seine Handlanger auf.
6002=In der Nähe führt eine Gasse als Abkürzung zum Museum. Du musst dich wohl etwas umsehen, um sie zu finden.
6003=In den Mülltonnen drüben auf dem Vorsprung stecken ein paar Schätze. Spring hinüber und hol sie dir! Mit Anlauf springst du weiter.
6004=Das Springen hat sich gelohnt! Du hast eine Taschenlampe gefunden. Such sie im Inventar und probier sie aus. Im Dunkeln wird sie dir nützlich sein.
6005=Probier die Mac-10 an den Zielscheiben aus. Mit dem Sekundärfeuer kannst du genauer schießen. Die meisten Waffen in Blood 2 haben einen zweiten Feuermodus.
6006=Benutze die Aktionstaste am Telefon, um abzuheben. Mit dieser Taste lassen sich viele Objekte in Blood 2 aktivieren.
6007=Das sieht nach der richtigen Gasse aus! Da hinauf kommst du wohl nur mit ein paar geschickten Sprüngen.
6008=Durch diesen Durchgang geht es geradewegs zum Museum. Die Stadt hat dir freundlicherweise Müllcontainer in den Weg gestellt. Jetzt ist Geschick gefragt.
6009=Gideon ist durch den Waschsalon entwischt. Schnapp dir deine Wäsche und hinterher!
6010=Finde den Weg zur Kathedrale. Hüte dich vor Gideons Schergen und vor noch Schlimmerem ...
6011=Gideon ist irgendwo hier. Die Cabal hat den Laden allerdings abgeriegelt. Pass auf die Sicherheitsanlagen auf.
6012=Gideons Singularitätswaffe hatte eine interessante Nebenwirkung. Sie hat dich nicht vernichtet, sondern Gabriel zurückgebracht. Gideon ist wieder auf der Flucht. Für alte Freunde bleibt keine Zeit.
6013=Gerüchten zufolge gibt es hier in der Nähe einen unterirdischen Eingang zu einer Cabalco-Anlage. Du würdest deine letzte Schrotpatrone darauf verwetten, dass Gideon dorthin unterwegs ist.
6014=Schieß dir den Weg frei und such nach Schaltern!
6015=Auf dem Förderband kannst du jetzt sicher weiterkriechen.
6016=Du musst einen Weg ins nächste Stockwerk finden.
6017=Zeit, sich einen anderen Weg zu suchen!
6018=Mit der CRU-Schlüsselkarte kannst du die CRU aktivieren.
6019=In der Nähe sollte ein Expressaufzug aufs Dach führen.
6020=Einer von Gideons Leibwächtern ist in der Nähe. Wenn du an den großen Boss willst, musst du erst an ihm vorbei.
6021=Fliegen war nie dein Ding. Geh besser nach vorn, bevor dir schlecht wird.
6022=Dieser Vogel muss runter. Der Schalter zur Selbstzerstörung sollte auf der Brücke sein.
6024=Hier wäre ein Exorzismus fällig! Vielleicht erfährst du dabei auch, was Gideon vorhat.
6025=Der Zug ist außer Kontrolle. Bring ihn in deine Gewalt.
6026=Finde Gideon im einsturzgefährdeten Versteck der Cabal.
6027=Dieser Teil der Stadt ist überrannt. Der einzige Fluchtweg führte durch die U-Bahn, doch die ist zerstört. Entkomm durch den Kellereingang in der nahen Gasse.
6028=Du bist in eine Falle geraten! Bestimmt sind schon mehrere Trupps Cabal-Fanatiker auf dem Weg zu dir. Zurück auf die Straße!
6029=Die Cabal hat dir hier einen Hinterhalt gelegt. Versuch, lebend durchzukommen.
6030=Mach aus dieser Fleischfabrik einen Schlachthof!
6031=Das Mahlwerk hat die Tür am Förderband geöffnet. Steig aufs Band und geh durch das Mahlwerk, um weiterzukommen.
6032=Weiter geht das Gemetzel!
6033=Der Zugang zur U-Bahn ist versperrt. Finde den Tunnel des Downtown Express.
6034=Such den Endbahnhof der blauen U-Bahn-Linie, um aus diesem Stadtteil zu entkommen.
6035=Finde einen Weg in den Bahnhof.
6036=Der Zugang zur blauen U-Bahn-Linie ist jetzt offen. Finde ihn und verschwinde!
6037=Pass auf den Zug auf.
6038=Finde einen anderen Weg zum U-Bahnhof.
6039=Das ist der falsche Zug. Gelang zum Zug, der vor diesem fährt.
6040=Schlag dich durch den Untergrund von Sakkara.
6041=Die Handsteuerung hat die Brücke gesenkt. Finde jetzt den Weg zurück zur Brücke.
6042=Finde einen Weg, die Brücke zu senken und sie zu überqueren. Pass auf, hier wimmelt es von Cabalco-Ungeziefer.
6043=Das ist wohl der einzige Weg in die Cabal-Zentrale. Versuch, ohne allzu viel Gemetzel an den Sicherheitstoren vorbeizukommen.
6045=Die Tür vor dir führt zur Forschungsabteilung. Dort könnte der Singularitätsgenerator stehen, von dem alle reden. Finde einen Weg, das Sicherheitssystem abzuschalten.
6046=Gideon muss irgendwo hier sein. Am sichersten ist er wohl dort, wo er am weitesten von dir weg ist. Das wird blutig. Hoffentlich hast du Eimer und Mopp dabei.
6049=Die Steuerung der Sicherheitsanlage ist in Sektor 4 des Kraftwerks. Du weißt, was zu tun ist. Rechne hier unten mit Einheiten der Cabal.
6050=Zeit für eigene Nachforschungen. Finde den verrückten Wissenschaftler. Vielleicht verrät er dir, wo er den Singularitätsgenerator versteckt.
6051=Du bist fast ganz oben. Gideon gehen die Verstecke aus. Vielleicht sitzt er unter einem Schreibtisch. Spreng am besten alles in die Luft und finde es heraus!
6052=Finde Gideon und das Portal zum Uralten.
