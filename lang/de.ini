authored.1655b5465594c073.text=Ophelia ist zusammen mit Gideon in einem Riss verschwunden. Vielleicht sind sie ganz in der Nähe. Genau wissen kannst du es nicht. Sieh zu, dass du nicht das nächste Opfer wirst.
