[dialogue]
4prophet1=Ich bleibe.
1acaleb1=Na los, komm schon!
1acaleb2=Endstation.
2caleb1=Du hast gerade deinen zweiten Fehler gemacht. Du bist geblieben.
2caleb2=Mich am Leben zu lassen.
3caleb1=... Gabriel?
3caleb2=Erzähl das jemandem, den’s interessiert.
3caleb3=Die Dinge haben sich geändert. Aber das muss ich dir wohl nicht sagen.
3caleb4=Du bist nicht mein Typ.
4caleb1=Du hast die Wahl. Geh jetzt und leb. Bleib, und du stirbst.
4caleb2=Dann stirbst du eben.
bmpr1caleb1=Ich hasse Fliegen.
5caleb1=Das könnte böse enden.
6caleb1=Die gehören nicht zur Cabal.
6caleb2=Das ist was anderes.
6caleb3=Ich muss einen Zug erwischen. Man sieht sich.
8caleb1=Du machst wohl Witze.
7caleb1=Du hast ja keine Ahnung.
7caleb2=Klar doch. Ich laufe mich gerade erst warm.
7caleb3=Ich bin die Verdrängung in Person. Ich stelle mich gar nichts.
7caleb4=Ich brauche keinen Babysitter.
9caleb1=Oh, ich werde noch viel mehr tun.
9caleb2=Abgefahren.
9caleb3=Lass es brennen. Ich mochte den Laden sowieso nie.
9caleb4=Pizza.
9caleb5=Strip-Bote.
11caleb1=Ich habe davon geträumt, dich so gefesselt zu sehen.
11caleb2=Gib mir einen Kuss, Süße.
11caleb3=Ach, du schon wieder. Kannst du in zwei Minuten wiederkommen?
11caleb4=Ophelia! Na gut, das reicht. Jetzt stirbst du!
13caleb1=Dein restliches Leben wird in Sekunden gemessen, du Pfeife.
14caleb1=Dann muss ich dir eben weiter in den Hintern treten.
14caleb2=Ich hab nie behauptet, schlau zu sein.
15caleb1=Nur zu. Ich sehe zu.
15caleb2=Auf zum Tanz, Butzemann.
16caleb1=Wenn du in die Hölle kommst, sag, ich schicke dich. Dann kriegst du Rabatt.
16caleb2=Entspann dich, du bist tot.
16caleb3=Zu spät, du bist schon tot.
16caleb4=Das Leben ist nicht fair, der Tod auch nicht. Gewöhn dich dran.
16caleb5=Vielen Dank und gute Nacht.
17caleb1=Nö.
17caleb2=Gleich verletzt du noch meine Gefühle.
17caleb3=Na?
17caleb4=Genug geredet. Kämpfen wir.
19caleb1=Na, hallo, Herr Schnösel. Verzeih, wenn ich dir nicht die Hand gebe.
20caleb1=Von so was hab ich keine Ahnung.
20caleb2=Was willst du tun, mir den Hintern versohlen?
20caleb3=Halt jetzt die Klappe, ich muss mich konzentrieren.
20caleb4=So was wie ein geistiger Einlauf. Im guten Sinne.
3gab1=Was zur Hölle ist das?
3gab2=Caleb?
3gab3=Gabriella. Das ist eine lange Geschichte.
3gab4=Begrüßt man so einen alten Freund?
3gab5=Ich muss mit dir kommen. Ich will wissen, was hier los ist.
3gab6=Hast du mal in den Spiegel gesehen? Du bist selbst keine Schönheit.
6gab1=Die Dinger sind überall. Die Cabal muss ziemlich verzweifelt sein, wenn sie solche Kreaturen erschafft.
6gab2=Was sind sie dann?
6gab4=Was machst du da?
6gab5=Keine Sorge, Kleiner. Wir sehen uns wieder.
14gab1=Wir müssen ihm hinterher. Wer weiß, was ihn da erwartet.
17gab1=Insekt, wir sind der Uralte. Wirf dich vor uns nieder.
17gab2=Nur du stehst zwischen uns und der Herrschaft? Erbärmlich.
17gab3=Alles, was ist, wird nicht mehr sein. Alles, was war, ist nie gewesen. Alles, was kommen sollte ... äh ...
17gab4=Alles, was kommen sollte, wird nie ... geschehen.
20gab1=Ich bringe euch beide um, wenn ihr nicht die Klappe haltet.
1agid1=Hier spricht Gideon, euer Gastschaffner! Haltet euch gut fest. Die Fahrt könnte ein bisschen ... blutig werden!
1agid2=Ich weiß, dass du hier bist, Caleb. Ich freue mich schon darauf, dir die Milz rauszureißen und sie als Hut zu tragen.
2gid1=Du hast nicht viel Glück mit Zügen, was?
2gid2=Ach, wirklich? Was war mein erster Fehler?
3gid1=Zeit zu sterben, Auserwählter.
7gid1=Diesmal sollte es besser funktionieren.
7gid2=Ishmael?
7gid3=Diesmal hattest du Glück, Verräter. In ein paar Stunden ist alles wieder in Ordnung und ich bin dich für immer los. Jetzt muss ich gehen. Keine Sorge, meine Truppen leisten dir Gesellschaft. Seid schön brav.
10gid1=Klingt wie zu Hause.
10gid2=Geh mir verdammt noch mal aus dem Weg!
11gid1=Ich dachte mir schon, dass du herkommst.
11gid2=Tut mir leid, dieses reizende Wiedersehen zu stören, Verräter. Ich muss dich bei Laune halten.
14gid1=Es ist noch nicht vorbei! Du wirst mich nie wirklich besiegen!
15gid1=Ah, Caleb. Dich habe ich erwartet, du berechenbarer Tölpel. Ich brauche nur einen Moment. Ich bin gerade dabei, mich zu ... verwandeln ...
15gid2=... in etwas ... Unerfreuliches.
15gid3=Wie gefällt dir mein neues Aussehen? Du hast ja keine Ahnung, wie köstlich sich Schmerz anfühlen kann. Gestatte mir, es dir zu zeigen.
15gid4=An dir, versteht sich!
16gid1=Nein! Das ist nicht fair! Ich bringe dich um!
7ish1=Das ist eine überraschende Entwicklung.
7ish2=Einen schlechten Tag?
7ish3=Ist dir klar, wie viel Schaden du anrichtest?
7ish4=Das meine ich nicht. Du bist der, der bindet. Früher oder später wirst du dich dem stellen müssen.
7ish5=Dann wisse dies: Wir sind die Auserwählten. Wir sind für dich da, ob es dir gefällt oder nicht.
7ish6=Ja, auch Ophelia. Sie ist als Erste hindurchgekommen.
7ish7=Das würde ich um nichts in der Welt verpassen. Andererseits könntest du die Welt am Ende zerstören.
9ish1=Du denkst an Ophelia. Rührend.
9ish2=In Gideons Tempel gibt es einen dauerhaften Riss. Dort konzentriert sich all der Schaden, der angerichtet wird. Das Epizentrum sozusagen. Dort findest du Ophelia.
9ish3=Tchernobogs Vernichtung hat viele Türen zwischen den Welten geöffnet. Nur der, der bindet, kann sie versiegeln. Diese Kraft liegt in dir. Diese Wirklichkeit geht unter, wenn du sie nicht wiederherstellst.
9ish4=Eine andere Wirklichkeit drängt sich durch die Risse, uralt und gefräßig. Sie ist weder gut noch böse, sie ist einfach da. Aber sie wird uns alle verschlingen.
14ish1=Du wirst ihm doch nicht folgen, oder?
14ish2=Ich vermute, dass es etwas sehr Unangenehmes ist.
