sounds_ao.chosen.ishmael.ishint21.1=Nun, ich bin wohl an der Reihe? Tja. Genau wie Ophelia habe ich ein Geheimnis.
sounds_ao.chosen.ishmael.ishint21.2=Ihr habt bestimmt schon von JoJo gehört, dem Zirkusidioten.
sounds_ao.chosen.ishmael.ishint22.1=Ja, ich erinnere mich. Wisst ihr, ich war JoJo.
sounds_ao.chosen.ishmael.ishint22.2=Böse Kultisten bekamen damals kein Arbeitslosengeld. Und als Arbeitsloser mit Tätowierungen fand man nur im Zirkus Arbeit.
sounds_ao.chosen.ishmael.ishint22.3=Also wurde ich eine Weile JoJo. Mein Vorgänger übertrug mir die ehrwürdige JoJo-Würde.
sounds_ao.chosen.ishmael.ishint22.4=Und so stolzierte ich an meinem ersten Tag mit stolzer Anmut auf die Bühne.
sounds_ao.chosen.ishmael.ishint22.5=Dann zeigten mir kleine Dreckschleudern wie du, was es wirklich hieß, eine Zirkusattraktion zu sein.
sounds_ao.chosen.ishmael.ishint22.6=Nach einem Jahr war ich ein Gefangener meines geringen Selbstwertgefühls. Doch eines Tages änderte sich alles.
sounds_ao.chosen.ishmael.ishint22.7=Tchernobog sprach zu mir und hieß mich, mich von diesem sterblichen Spott zu befreien.
sounds_ao.chosen.ishmael.ishint22.8=Und das tat ich. Aber es war nicht leicht.
