sounds.events.psvoice11j=Achtung, auf Ebene 3 befindet sich ein Eindringling. Er ist bewaffnet und äußerst gefährlich. Nähern Sie sich dem Mann unter keinen Umständen. Laufen Sie vielmehr so schnell wie möglich in die Gegenrichtung. Vielen Dank und einen schönen Tag.
