authored.876b96893e6e534e.title=Fichez le camp d'ici !
authored.876b96893e6e534e.text=Vous avez réussi. Le dirigeable est condamné. Sortez avant qu'il ne vous emporte avec lui !
authored.1655b5465594c073.title=Objectif nº 1
authored.1655b5465594c073.text=Ophelia a disparu dans une faille avec Gideon. Ils sont peut-être tout près, mais impossible de le savoir. Évitez d'être le prochain sacrifice.
