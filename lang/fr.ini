authored.74ccd748f4e969fb.title=Actionnez le CRU !
authored.74ccd748f4e969fb.text=Le badge du CRU vous permettra de l'activer.
authored.b99fc6253496e264.title=Vous y êtes presque…
authored.b99fc6253496e264.text=Un ascenseur express devrait monter au toit tout près d'ici.
