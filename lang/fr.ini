3000=~Même dans le métro, impossible de lire tranquillement le dernier Guns N' Gibs. D'abord, le contrôleur a osé confisquer ta flasque d'Ol' Red '99. Puis ce conducteur sans tripes a arrêté la rame une heure parce qu'un mioche morveux avait roulé sur les rails dans son landau ! Tu allais monter lui dire ses quatre vérités quand tu as reconnu sa voix… et compris que la journée allait devenir… intéressante.
3001=~Ça fait mal. Très mal. La dernière fois que tu as perdu connaissance, tu venais d'enchaîner dix-neuf verres de Black Label nº 47 de JoJo. Et encore, c'était peut-être surtout parce que tu étais trop près du stand de glaces que tu as fait sauter. Ce vendeur idiot n'avait qu'à pas mettre de vermicelles sur ton Killer Kiddy Kone. À propos de vermicelles, tu ferais bien de retrouver Gideon et de le saupoudrer généreusement sur le mur le plus proche.
3002=~Gideon t'a échappé, mais il court toujours. Tu lui régleras son compte et lui éteindras la lumière bien assez tôt. En attendant, il t'a laissé des copains pourris sur les bras. Ces bouts de viande pestilentiels rappellent les morts-vivants que fabriquait la Cabale autrefois… à part ces drôles de coutures sur la poitrine. Ces carcasses ambulantes ont quelque chose de différent. Mais des tripes, ça reste des tripes.
3003=~C'était marrant… dans l'ensemble. Hélas, Gideon n'était pas à bord. Mais tu sais où le trouver : à la cathédrale ! C'est ce que dit le panneau : « LE 30 OCTOBRE, GIDEON PRÉSENTE SA THÈSE SUR LE CRIME RITUEL DU PÉCHÉ ET L'ART DE S'EN TIRER. VENEZ TÔT POUR ASSISTER À SON PETIT COLLOQUE SUR LA DEMI-VIE EXTRÊMEMENT ONÉREUSE D'UNE SOUPAPE ! » Il ne décevra pas ses admirateurs. Va lui faire savoir que tu es dans le public.
3004=~Le musée Lafayette des antiquités de Cabalco annonce sa nouvelle exposition : Cultes et rituels. Découvrez, au fil d'une visite guidée riche en enseignements, l'histoire des organisations fanatiques les plus bizarres du monde, de la secte maudite de la Rainette aboyeuse aux redoutables Shriners coiffés de fez. N'oubliez pas de sacrifier un instant de votre journée à notre nouveau dieu des ténèbres animatronique. Terrifiant !
3005=~Ce que tu peux détester les égouts ! L'odeur n'est pas désagréable, mais patauger entre les trucs qui flottent, ça lasse. Quand tu régneras sur le monde, tu le déclareras zone sans assainissement. Avec les égouts à ciel ouvert, plus de budget pour réparer les tuyaux : tout ça trouvera bien la mer tout seul. Même avec le parfum local, tu reconnais la puanteur de Gideon. Le lâche doit filer vers un repaire de la Cabale.
3006=~L'humanité se reproduit comme des cafards et la surpopulation sévit partout. La maladie est devenue notre deuxième activité ! Nous sommes fiers du quasi-monopole du Centre de gestion des maladies de Cabalco. À la pointe de la technologie, il abrite de vastes services de recherche, de dissection et de traumatologie. Le CGM est à l'avant-garde de toutes les affections, de la peste et du virus Ebola à la bonne vieille syphilis. Notre devise ? Investissez, infestez. Cabalco fait le reste !
3007=~Gideon se dirige vers un des dirigeables de la direction, amarrés au sommet de l'immeuble. Il serait temps de lever le pied sur la viande carbonisée du Beefy Queen : tu n'as pas la forme pour prendre les escaliers. Gideon aussi se gave au BQ. Il a donc fait installer des ascenseurs express dans tous ses gratte-ciel. T'épargner plus de mille étages, c'est gentil. Si seulement tu savais couper cette musique infernale !
3008=~Le dirigeable Cabalco Industries modèle 1701D est l'un des plus beaux et des plus polyvalents à avoir sillonné nos ciels souillés. Polyvalent, car il sert à la fois aux voyages d'affaires haut de gamme et aux missions militaires. Pourquoi faire deux trajets ? Rasez ce petit pays du tiers-monde sous les bombes tout en faisant voyager vos meilleurs clients avec classe ! Sous sa coque blindée, le dirigeable Cabalco a un cœur d'or. Sièges spacieux, cabines relaxantes, hôtesses bien armées et meilleures cacahuètes du ciel. Volez Cabalco. Volez avec classe.
3009=~Nous allons nous écraser ! Prenez la position de sécurité ! Redressez et verrouillez vos dossiers et vos tablettes. Placez votre tête entre vos propres jambes. Si vous fumez, veuillez vous éteindre. Bonne journée, et merci d'avoir choisi Cabalco Air.
3010=~Pas de bonnes sœurs dans cette cathédrale ! La chose qui rôde dans l'au-delà a remodelé les lieux à son goût. Tu pourrais presque y habiter, si c'était à vendre à un prix raisonnable et sans ces pénibles portiers de la Cabale. Il est temps de faire le ménage et de voir où Gideon est passé. Tu trouveras peut-être le temps de faire un joli frottis sur pierre pour ce mur vide de ton dressing à flingues.
3011=~Vous entrez dans le secteur industriel. Le taux d'ozone atteint actuellement le niveau trois et l'alerte toxique le niveau quatre. Portez une protection respiratoire en permanence. L'occasion idéale d'essayer le nouveau Safe Sucks 2 de Cabalco ! Une protection pratique et bon marché pour toutes les situations. Évitez les zones à haut risque, comme le plein air. Bonne visite et agréable journée.
3012=~Les trains avaient plus de charme autrefois. De nos jours, on a déjà de la chance d'en sortir vivant. Rien ne détend mieux que de faire sauter les… euh… morceaux encore vivants de l'adversaire. Les repaires de la Cabale respirent le luxe : la puanteur, le mobilier, les rats, l'ambiance, les ivrognes. À propos de rendez-vous, Gideon doit traîner par ici. Ce sera sûrement plus amusant que le tir sur ivrognes. Youhou !
3013=~Les habitants de New Town ont deux sérieux problèmes : ils mangent trop et ils se vident sans retenue. Le mélange sera mortel… pour eux. À l'odeur, leurs tuyaux mériteraient un bon nettoyage. Te voilà, demi-dieu immortel et lavement sur pattes. C'est de toute évidence la faute de Gideon si tu es tombé aussi bas, dans la merde jusqu'aux chevilles. Hmm. Ajoute ça à son ardoise et fais-le payer en morceaux.
3014=~Encore faim de viande ? Bien sûr ! Nous aussi ! Chez Cabalco, la viande, ça nous connaît. Découvrez une gamme qui couvre tous vos besoins : la Viande en boîte ! Délicieuse et abordable. Vos parfums préférés : abats, bœuf, volaille, porc, chèvre et poissons de fond ! Essayez aussi nos nouveautés : viande au levain, viande de pruneau fermenté et viande de champignon très légèrement hallucinogène. Chez Cabalco, nos usines créent l'alimentation du futur. Mieux encore : plus de 82 % de nos produits sont exempts d'E. coli !
3015=~Si t'as d'la joie au cœur, fais péter des cerveaux… Si t'as d'la joie au cœur, tranche quelques veines… Si t'as d'la joie au cœur, les têtes qui rebondissent le feront bien voir… Rien de tel que d'aimer son travail. Encore une gare innommable ? Au moins, celle-ci est plus jolie que la dernière. Fais travailler ce bon vieux doigt sur la gâchette. Tu viens du mauvais côté des rails, et comme d'habitude, la lumière au bout du tunnel pourrait bien être un train.
3016=~Ha ! Ce salaud de Gideon pensait te semer avec son petit tour de passe-passe. Tu rêves, mon prince ! Quand tu le rattraperas, il aura droit à ton tour à toi. Tu pourrais lui tourner la tête pour qu'il ait une vue un peu plus intérieure. Vu le temps qu'il a passé la tête là-dedans, il reconnaîtra le paysage. À l'assaut, et tout le reste. Assez de pensées chaleureuses : cette fois, tu vas peindre la ligne bleue en rouge. Rouge sang.
3017=~Las de jeter votre argent par les fenêtres en loyer ? Bien sûr ! Vos amis de Cabalco Construction et Immobilier viennent d'achever un charmant lotissement. Les terrains sont rares et chers, alors nous avons recouvert d'une bonne couche de terre ce vieux cloaque toxique et radioactif de Love Canal. Une maison Cabalco n'a jamais coûté si peu ! Vous fondez une famille ? Voyez grand ! Ignorez les rumeurs d'infertilité, de malaise, de vomissements incessants ou de bébés à trois têtes. Cabalco se soucie de vous, et nos prix sont plus que raisonnables !
3018=~Pas convaincu par le bilan de sécurité du métro ? Une seule solution : le détruire ! Mets cette saloperie à terre. Un ticket ? Et puis quoi encore ! Ton fusil te sert de billet, et il va faire des ravages. Rien de tel que de prendre plaisir à son travail. Prends peut-être un moment pour sortir respirer de l'air vicié. Les deux derniers trajets étaient un peu trop serrés.
3019=~Ah, là on est bien. Comme à la maison. Ça donne envie de s'allonger pour le grand sommeil. L'immortalité, c'est pas aussi chouette qu'on le dit. Ça demande bien plus d'efforts que prévu. Au moins, tu peux aider les autres à obtenir ce dont tu es privé, et plus vite qu'ils ne l'imaginent. Tout toi, bonté et charité. Il est temps de précipiter leur départ. Sortez, sortez où que vous soyez… vous allez être, hum, élus.
3020=~Bienvenue à New Town, où se dresse l'immense siège de Cabalco Industries ! Les émeutes et les révoltes n'y posent presque plus problème. Au-dessus de la ravissante rivière en feu de White Rock, New Town est l'image presque parfaite d'une ville gentiment opprimée par une mégacorporation amorale. Il y a bien quelques sacrifices rituels, des enlèvements nocturnes, des gens qui disparaissent sans laisser de traces. Mais nos rues sont plutôt sûres et propres et notre économie prospère, à quelques petits accrocs près. Nous sommes New Town ! Cabalco est notre ami !
3021=~Vous vous inquiétez pour votre avenir ? Vos camarades vous terrorisaient au lycée ? Vous rêvez d'un métier exigeant ? Rejoignez la sécurité de Cabalco ! Une journée difficile, c'est passer des heures nu, en nage, dans une boîte métallique sombre presque sans air, avec votre raison vacillante et deux douzaines de rats affamés. Mais assez parlé de moi ! Nos humiliations et passages à tabac vous feront renaître. Au bout de nos douze étapes, vous aurez un gros flingue et le pouvoir de vie et de mort sur les autres, chaque jour. Ça leur apprendra, à ces petits cons du lycée !
3022=~Vous êtes au Grand Temple top secret de Cabalco. Nous sommes absents pour le moment. Vous pouvez laisser votre sang à la porte, de préférence humain ou caprin. En cas d'urgence, allumez 69 bougies blanches, griffez un grand pentagramme dans le béton avec vos ongles et dansez nu en son centre, après vous être enduit du sang de vos doigts en lambeaux, tout en chantant pour notre dieu des ténèbres. Un perfide serviteur des enfers va s'occuper de vous. Merci de votre patience !
3023=~Bienvenue au poste de contrôle gratiné. Ha. Les gardes ont l'air un peu trop… fanatiques. Il doit y avoir une autre entrée au siège de Cabalco. En attendant, fais un peu de ménage et liquide les adversaires indignes. Parfois, pour nettoyer, il faut commencer par salir. Heureusement que ce n'est pas toi qui vas récurer la matière grise sur les murs. Quand ça sèche, ça doit être une vraie corvée. Fabrique ton propre laissez-passer « accès illimité ».
3024=~Vous cherchez du travail ? Cabalco a toujours besoin d'un corps de plus ! Nous recrutons sans cesse et les avantages ne manquent pas. Un immense gratte-ciel neuf, des machines à café et à soda à chaque étage et une couverture médicale, hum, à tomber par terre. Même au bas de l'échelle, vous aurez vite quelqu'un sous vos ordres ! Les Ressources, euh, humaines ne vous imposent pas les formalités pénibles des autres entreprises. Aucune expérience ? Aucun problème ! Même pas besoin de CV ni de candidature. Présentez-vous et vous êtes à nous… enfin, le poste est à vous. Cabalco ne donne pas les mêmes chances à tous.
3025=Il faut le reconnaître : le décorateur de Cabalco n'a pas fait les choses à moitié. De larges escaliers, de l'art bizarre mais joli, des bureaux très amusants et plus de choses à faire sauter que tu ne pourrais en viser avec ton fusil. Bel endroit, en somme. Ça mérite un petit incendie. Mais il va falloir expédier les cultistes, Drudges, Shikari et fanatiques en enfer. Ne passez pas par la case départ, ne touchez pas 200 dollars. Le Behemoth a l'air câlin et ferait un joli compagnon. Dommage qu'il ne soit pas propre.
3026=~Il est temps de débrancher ces salauds. Coupe le jus. Plus de courant alternatif ! Ni de continu, tant qu'à faire ! Bienvenue à la centrale. Tu es la panne incarnée. Ça grésille tellement ici qu'on pourrait te frire jusqu'à ce que tu croustilles, et après tes voyages en train, tu n'as aucune envie de devenir conducteur. Fais ce que tu sais faire : casse tout. Commence par les fanatiques. Au boulot, ô grand disjoncteur.
3027=~Caleb a-t-il vraiment fermé les failles ? Ophelia a-t-elle ses deux minutes de cadeau ? Qu'est-il arrivé à Gabriel… euh, Gabriella ? Et si Ishmael ne peut pas rentrer ? D'où viennent ses tatouages ?|~La suite au prochain épisode de « Ça brûle, ça brûle ». Vous aurez bientôt toutes ces réponses, promis. En attendant, place au grand BAIN DE SANG !
3028=~Ah, la science ! Tu repenses avec tendresse à ta première dissection. Tu frémissais d'excitation en dépeçant ce cadavre fétide. Les muscles dansaient à la moindre décharge, et quelle surprise quand tu as ouvert les intestins par accident ! Quel gaz ! Assez rêvassé. Au boulot, trouve l'entrée du service de recherche et développement de Cabalco.
3029=~Rien de tel qu'une offre de rachat très hostile pour réveiller les sens ! La chasse et la traque t'ont toujours plu. Ça commence à être amusant. Gideon n'a presque plus de cachettes. Coince le rat. Un peu de ménage s'impose, et vider des bureaux n'a jamais été aussi drôle. Où était cet ascenseur pour le toit, déjà ?
3030=~Voilà Gideon, ton pigeon d'argile ! Ça sonne bien : Gideon le pigeon. Youhou ! Le ball-trap est un de tes jeux préférés. Ça va être explosif. Pour lui. Lancez ! Pan. Lancez ! Pan. Fini de courir, Gideon. Ton vol est terminé, crétin. Tu n'as plus de chance.
3031=~C'est un combat à mort. De préférence celle de quelqu'un d'autre. On ne peut plus tirer les ficelles de Gideon. Au marionnettiste de payer. L'Ancien ? Tu écoutes ? Alors écoute bien…
3032=~Quelque chose a changé, mais impossible de mettre le doigt dessus. Tes vieux copains ont l'air pâles, voire malades. Qu'est-ce qui leur a pris de grimper dans ces cercueils ? Hmm. Un petit supplément de plomb devrait arranger ça. Du plomb dans le crâne et au lit ! Bonne nuit, chers Élus. Faites des rêves empoisonnés.
3033=~Pour citer un poète depuis longtemps oublié et pas trop bavard : « Tue-le ! »
