sounds.events.tavoice1=Bienvenue dans le réseau interurbain de Cabalco. Nous savons que vous avez le choix en matière de transports en commun, et nous sommes ravis que vous ayez choisi Cabalco.
sounds.events.tavoice2a=Le réseau interurbain de Cabalco fait peau neuve. Les agressions ont baissé de 13 %, les passages à tabac gratuits de 6 %, les meurtres de 3 % et les pannes générales de pas moins de 7 %. Malheureusement, les mutilations d’animaux ont bondi de 96 %.
sounds.events.tavoice3=Il est strictement interdit d’empaler les autres voyageurs avec des objets pointus. Merci.
