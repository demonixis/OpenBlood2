6000=Le trajet quotidien va prendre une tournure sanglante.
6001=Gideon a gâché votre trajet et s'enfuit comme un lâche. Vous allez laisser passer ça ? Suivez-le jusqu'au musée et donnez-lui ce qu'il mérite. Méfiez-vous de ses sbires en chemin.
6002=Une ruelle toute proche ferait un excellent raccourci vers le musée. Il faudra peut-être fouiller un peu pour la trouver.
6003=Les poubelles sur le rebord d'en face contiennent de bonnes surprises. Essayez de sauter jusque-là pour les prendre ! Vous sautez plus loin en courant.
6004=Vos talents de sauteur ont payé ! Vous avez trouvé une lampe torche. Repérez-la dans votre inventaire et essayez-la. Elle servira dans les endroits sombres.
6005=Essayez ce MAC-10 sur les cibles. Le tir secondaire est plus précis. La plupart des armes de Blood II ont un tir secondaire.
6006=Décrochez avec la touche d'interaction. De nombreux objets de Blood II s'activent de la même façon.
6007=On dirait bien la ruelle que vous cherchez. Il va falloir sauter avec précision pour y monter.
6008=Le musée est droit devant, mais la ville a eu la délicatesse de barrer le passage avec des bennes. Il va falloir jouer les acrobates.
6009=Gideon a filé par la laverie Laundro-Hut. Prenez votre linge et descendez le rejoindre !
6010=Trouvez le chemin de la cathédrale. Prenez garde aux sbires de Gideon et à ce qui pourrait être pire…
6011=Gideon est quelque part par ici. La Cabale a verrouillé les lieux. Prenez garde aux dispositifs de sécurité.
6012=Le canon à singularité de Gideon a eu un effet secondaire intéressant. Au lieu de vous détruire, il a ramené Gabriel. Gideon a repris la fuite. Pas le temps de revoir de vieux amis.
6013=Il paraît qu'une entrée souterraine de Cabalco se trouve tout près. Vous parieriez votre dernière cartouche de fusil que Gideon s'y dirige.
6014=Frayez-vous un passage à coups de feu et trouvez des boutons à actionner !
6015=Vous pouvez maintenant ramper sans danger sur le tapis roulant.
6016=Trouvez un moyen d'atteindre l'étage suivant.
6017=Il va falloir trouver un autre chemin !
6018=Le badge du CRU vous permettra de l'activer.
6019=Un ascenseur express devrait monter au toit tout près d'ici.
6020=Un des gardes du corps de Gideon est tout près. Il faudra lui passer sur le corps pour avoir une chance d'atteindre le grand patron.
6021=Vous n'avez jamais aimé voler. Rejoignez le compartiment avant avant d'avoir la nausée.
6022=Il faut clouer cet oiseau au sol. Le bouton d'autodestruction devrait se trouver sur la passerelle.
6023=Vous avez réussi. Le dirigeable est condamné. Filez avant qu’il ne vous emporte avec lui ! Vous devriez pouvoir vous échapper par la soute à bombes.
6024=Cet endroit aurait bien besoin d'un exorcisme. Vous en apprendrez peut-être plus sur les plans de Gideon.
6025=Le train est hors de contrôle. Prenez les commandes.
6026=Trouvez Gideon dans le repaire désaffecté de la Cabale.
6027=Tout le quartier est envahi et la seule sortie, le métro, a été détruite. Fuyez par l'entrée du sous-sol dans la ruelle voisine.
6028=On vous a piégé ! Des escouades de fanatiques de la Cabale doivent déjà converger vers vous. Remontez dans la rue.
6029=La Cabale vous a tendu une embuscade. Essayez de vous en sortir vivant.
6030=Transformez cette usine de conditionnement en abattoir !
6031=Le broyeur a ouvert la porte du convoyeur. Montez sur le tapis et traversez le broyeur pour avancer.
6032=Retournez faire un massacre !
6033=L'accès au métro est bloqué. Trouvez le tunnel de l'express du centre-ville.
6034=Trouvez le terminus de la ligne bleue pour fuir ce quartier.
6035=Trouvez un moyen d'entrer dans la gare.
6036=L'accès à la ligne bleue est ouvert. Trouvez-le et filez !
6037=Attention au train.
6038=Trouvez un autre chemin vers la station de métro.
6039=Ce n'est pas le bon train. Rejoignez celui qui roule devant.
6040=Frayez-vous un chemin dans les souterrains de Saqqarah.
6041=La commande manuelle a abaissé le pont. Il ne reste qu'à y retourner.
6042=Trouvez un moyen d'abaisser le pont et traversez-le. Prudence, les vermines de Cabalco pullulent ici.
6043=On dirait que c'est le seul accès au siège de la Cabale. Essayez de franchir les grilles sans faire trop de dégâts.
6045=Cette porte mène à la recherche et développement. C'est peut-être là que se trouve le générateur de singularité dont tout le monde parle. Trouvez comment désactiver la sécurité.
6046=Gideon doit être dans le coin. Il sera probablement là où vous êtes le moins susceptible de le trouver. Ça va saigner. J'espère que vous avez un seau et une serpillière.
6049=Les commandes de sécurité sont dans le secteur 4 de la centrale. Vous savez quoi faire quand vous les trouverez. Ne vous étonnez pas de croiser des forces de la Cabale.
6050=À vous de mener des recherches. Trouvez le scientifique cinglé. Il vous dira peut-être où il garde le générateur de singularité.
6051=Vous approchez du sommet de l'immeuble. Gideon n'a presque plus de cachettes. Il est peut-être sous un bureau. Faites tout sauter pour en avoir le cœur net !
6052=Trouvez Gideon et le portail qui mène à l'Ancien.
