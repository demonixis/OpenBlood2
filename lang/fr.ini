6053=Traversez la glace pour rejoindre le domaine de la Cabale. Attention, l’eau est beaucoup trop froide pour s’y aventurer.
6054=Trouvez votre chemin dans ce labyrinthe et rejoignez le cimetière de la Cabale.
6055=Envoyez les fidèles de la Cabale vers la lumière.
6056=La sortie du labyrinthe est verrouillée. La tour qui domine le jardin recèle peut-être la solution.
6057=Entrez dans la maison et montez au grenier. Trouvez l’album photo et détruisez-le.
6058=Laissez tomber le numéro de JoJo et reprenez la conquête du monde. Il va d’abord falloir échapper à vos geôliers.
6059=Trouvez un moyen de sortir d’ici. Toute cette religion vous donne la chair de poule.
6060=Cette ville est trop petite pour qui que ce soit ! Tuez-les tous !
6061=On dirait que le Cauchemar tient à vous présenter quelques-uns de ses copains d’abord…
6062=Un nouveau passage s’est ouvert. Trouvez-le et suivez-le jusqu’au combat final…

