authored.fcfc192a55159c96.text=Vous devriez pouvoir accéder à la recherche et développement. Allez donc voir ce qu'ils y développent.
authored.f509240c18010417.title=Objectif nº 1
authored.f509240c18010417.text=Encore cet endroit ! Gideon est peut-être dans le coin. Les ascenseurs étaient sa meilleure issue. Qu'attendez-vous pour lui régler son compte ?
authored.c9a269968f66b5ac.title=Arène
authored.c9a269968f66b5ac.text=Trouvez le portail qui mène à|l’Ancien.
