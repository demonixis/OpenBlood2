[dialogue]
4prophet1=Je reste.
1acaleb1=Allez, viens !
1acaleb2=Terminus.
2caleb1=Tu viens de faire ta deuxième erreur. Tu es resté.
2caleb2=Me laisser en vie.
3caleb1=… Gabriel ?
3caleb2=Garde ça pour quelqu’un que ça intéresse.
3caleb3=Les choses ont changé. Mais tu le sais déjà.
3caleb4=T’es pas mon genre.
4caleb1=À toi de choisir. Pars maintenant et tu vivras. Reste et tu mourras.
4caleb2=Alors tu vas mourir.
bmpr1caleb1=Je déteste l’avion.
5caleb1=Ça sent mauvais.
6caleb1=Ceux-là ne sont pas de la Cabale.
6caleb2=C’est autre chose.
6caleb3=J’ai un train à prendre. On se reverra.
8caleb1=Tu plaisantes, j’espère.
7caleb1=Tu n’as pas idée.
7caleb2=Et comment, je commence à peine à m’échauffer.
7caleb3=Le déni, c’est moi. Je n’affronterai rien du tout.
7caleb4=J’ai pas besoin de nounou.
9caleb1=Oh, je vais faire bien plus que ça.
9caleb2=Génial.
9caleb3=Laisse brûler. J’ai jamais aimé cet endroit.
9caleb4=Pizza.
9caleb5=Strip-tease à domicile.
11caleb1=J’ai rêvé de te voir ligotée comme ça.
11caleb2=Fais-moi un bisou, bébé.
11caleb3=Oh, encore toi. Tu peux repasser dans deux minutes ?
11caleb4=Ophelia ! Bon, ça suffit. Tu vas mourir !
13caleb1=Il te reste quelques secondes à vivre, abruti.
14caleb1=Alors je vais devoir continuer à te botter le cul.
14caleb2=J’ai jamais dit que j’étais malin.
15caleb1=Vas-y. Je regarde.
15caleb2=On danse, croque-mitaine ?
16caleb1=En enfer, dis que c’est moi qui t’envoie. Tu auras une remise.
16caleb2=Détends-toi, t’es mort.
16caleb3=Trop tard, t’es déjà mort.
16caleb4=La vie est injuste, et la mort aussi. Fais-toi une raison.
16caleb5=Merci et bonne nuit.
17caleb1=Nan.
17caleb2=Tu vas me vexer.
17caleb3=Alors ?
17caleb4=Assez parlé. On se bat.
19caleb1=Tiens, bonjour, monsieur le dandy. Excuse-moi si je te serre pas la main.
20caleb1=J’y connais rien, à ces trucs-là.
20caleb2=Quoi, tu vas me donner la fessée ?
20caleb3=Bon, ferme-la, faut que je me concentre.
20caleb4=Un genre de lavement spirituel. Dans le bon sens.
3gab1=C’est quoi ce bordel ?
3gab2=Caleb ?
3gab3=Gabriella. C’est une longue histoire.
3gab4=C’est comme ça que tu accueilles une vieille amie ?
3gab5=Je dois venir avec toi. Pour savoir ce qui se passe.
3gab6=Tu t’es regardé dans la glace, récemment ? T’es pas un cadeau non plus.
6gab1=Ces trucs sont partout. La Cabale doit être sacrément désespérée pour créer de pareilles créatures.
6gab2=Alors, c’est quoi ?
6gab4=Qu’est-ce que tu fais ?
6gab5=T’en fais pas, petit bonhomme. On se reverra.
14gab1=Il faut le suivre. Qui sait ce qui l’attend ?
17gab1=Insecte, nous sommes l’Ancien. Prosterne-toi devant nous.
17gab2=Tu es tout ce qui nous sépare du pouvoir absolu ? Pathétique.
17gab3=Tout ce qui est cessera d’être. Tout ce qui fut n’a jamais été. Tout ce qui devait venir… euh…
17gab4=Tout ce qui devait venir n’arrivera… jamais.
20gab1=Je vous tue tous les deux si vous la fermez pas.
1agid1=Ici Gideon, votre conducteur pour ce trajet ! Accrochez-vous, le voyage risque d’être un peu… sanglant !
1agid2=Je sais que tu es là, Caleb. J’ai hâte de t’arracher la rate pour m’en faire un chapeau.
2gid1=T’as pas beaucoup de chance avec les trains, hein ?
2gid2=Ah oui ? Et c’était quoi, ma première erreur ?
3gid1=Ton heure est venue, l’Élu.
7gid1=Ça a intérêt à marcher, cette fois.
7gid2=Ishmael ?
7gid3=Tu as eu de la chance cette fois, Traître. Dans quelques heures, tout rentrera dans l’ordre et je serai débarrassé de toi pour de bon. Pour l’instant, je dois te quitter. Mais ne t’inquiète pas, mes troupes te tiendront compagnie. Sois sage.
10gid1=On se croirait à la maison.
10gid2=Dégage de mon chemin, bordel !
11gid1=Je me doutais que tu viendrais ici.
11gid2=Désolé de gâcher ces charmantes retrouvailles, Traître, mais je dois entretenir ta motivation.
14gid1=Ce n’est pas fini ! Tu ne me vaincras jamais vraiment !
15gid1=Ah, Caleb. Je t’attendais, espèce de lourdaud prévisible. J’en ai pour une minute. Je suis juste en train… de me transformer…
15gid2=… en quelque chose de… déplaisant.
15gid3=Que penses-tu de ma nouvelle allure ? Tu n’as pas idée de l’extase que peut procurer la douleur. Permets-moi de te faire une démonstration.
15gid4=Sur toi, je veux dire !
16gid1=Non ! C’est pas juste ! Je vais te tuer !
7ish1=Voilà un rebondissement inattendu.
7ish2=Mauvaise journée ?
7ish3=Tu te rends compte de l’étendue des dégâts que tu causes ?
7ish4=Ce n’est pas ce que je veux dire. Tu es Celui qui lie. Tôt ou tard, il faudra l’accepter.
7ish5=Alors sache que nous sommes les Élus. Que ça te plaise ou non, nous sommes là pour toi.
7ish6=Oui, Ophelia aussi. Elle a traversé la première.
7ish7=Je ne manquerais ça pour rien au monde. Encore faudrait-il que tu ne détruises pas le monde.
9ish1=Tu penses à Ophelia. Touchant.
9ish2=Il y a une faille permanente dans le temple de Gideon. Tous les dégâts convergent vers elle. Un épicentre, pour ainsi dire. Tu y trouveras Ophelia.
9ish3=La destruction de Tchernobog a ouvert de nombreuses portes entre les mondes. Seul Celui qui lie peut les sceller. Ce pouvoir est en toi. Cette réalité périra si tu ne la répares pas.
9ish4=Une autre réalité se fraie un chemin par les failles, ancienne et affamée. Elle n’est ni bonne ni mauvaise, elle existe, c’est tout. Mais elle nous dévorera tous.
14ish1=Tu ne vas pas le suivre, quand même ?
14ish2=Je dirais que c’est quelque chose de très déplaisant.
17ish1=Insecte, nous sommes l’Ancien. Prosterne-toi devant nous.
17ish2=Tu es tout ce qui nous sépare du pouvoir absolu ? Pathétique.
17ish3=Tout ce qui est cessera d’être. Tout ce qui fut n’a jamais été. Tout ce qui devait venir… euh…
17ish4=Tout ce qui devait venir n’arrivera… jamais.
20ish1=Ce n’est pas fini, Caleb. Tu dois sceller les failles. Tu dois retisser la trame de cette réalité avant qu’elle ne se déchire.
20ish2=Ce pouvoir est en toi. Il est temps de t’en servir.
3madsci1=Je ne m’y attendais pas. Hmm, je vais devoir recalibrer la singularité.
7madsci1=Croyez-moi, mes calculs sont parfaits cette fois.
10madsci1=Monsieur, je dois vous conseiller de reconsidérer la question. Mes calculs ne donnent toujours rien de concluant. Les failles sont peut-être une source de puissance illimitée, comme vous le dites, mais aussi des pièges mortels dans la trame de l’espace-temps. Elles pourraient vous mener à un royaume de chaos et de mal à l’état pur, où vous seriez complètement et irrémédiablement anéanti.
10madsci2=Mais, monsieur !
10madsci3=Non ! Je n’ai jamais eu l’occasion… de vous dire… à quel point je vous aime…
12madsci1=Bonjour, bonjour, bonjour. Bienvenue à la Recherche et Développement, ou comme j’aime l’appeler… la R&D. Vous pouvez m’appeler… docteur. Les fluctuations du substrat cosmique m’ont fourni des sujets plutôt intéressants ces derniers temps, mais j’ai particulièrement hâte de procéder à votre… dissection. Avancez jusqu’au laboratoire principal et nous commencerons l’expérience…
11oph1=Le prince charmant, je présume.
11oph2=Détache-moi et je te donnerai une tarte à la vanille tout entière.
14oph1=Il veut que tu le suives, espèce de crétin.
14oph2=Qu’est-ce qu’on attend ?
17oph1=Insecte, nous sommes l’Ancien. Prosterne-toi devant nous.
17oph2=Tu es tout ce qui nous sépare du pouvoir absolu ? Pathétique.
17oph3=Tout ce qui est cessera d’être. Tout ce qui fut n’a jamais été. Tout ce qui devait venir… euh…
17oph4=Tout ce qui devait venir n’arrivera… jamais.
20oph1=Tu n’as pas le choix. Écoute Ishmael, idiot.
20oph2=Je te donne la fessée si tu m’en donnes une.
sounds.chosen.caleb.e1m1_1_cal=Je ne suis pas un mauvais rêve. Je suis leur pire cauchemar.
sounds.chosen.caleb.e1m3_2_cal=On n’en fait plus comme avant.
sounds.chosen.caleb.e1m4_1_cal=On dirait qu’il y a du boulot côté massacre.
sounds.chosen.caleb.e1m4e5a_cal=J’en sais foutre rien. Qu’est-ce que ça peut te faire ? On dirait pas qu’ils te posent problème.
sounds.chosen.caleb.e1m4e7a_cal=Qu’est-ce que ça veut dire, ça ?
sounds.chosen.caleb.e1m4e9a_cal=Je vais le régler !
sounds.chosen.caleb.e1m5_1_cal=Hé, ils devraient me verser une commission, ici.
sounds.chosen.caleb.e2m5_1_cal=C’est l’heure de Howdy Doody, les enfants. Le méchant est arrivé.
sounds.chosen.caleb.e2m5_2_cal=C’est une façon d’ouvrir quelqu’un en deux. Mais ma méthode est bien plus rapide et plus drôle.
sounds.chosen.caleb.e2m5_4_cal=Beurk, j’ai l’impression d’être un morceau de viande.
sounds.chosen.caleb.e3m1_2_cal=Maintenant, ça va chauffer !
sounds.chosen.caleb.e3m1_3_cal=Ah, rien n’est jamais simple.
sounds.chosen.caleb.e3m2_1_cal=Quel gâchis de bonnes munitions !
sounds.chosen.caleb.e3m2_2_cal=Hmm, un poste de sécurité. Oh, zut, me voilà coincé. Il va falloir faire demi-tour.
sounds.chosen.caleb.e3m2_3_cal=Oh, avec des locaux aussi spacieux, je devrais peut-être postuler ici.
sounds.chosen.caleb.e3m3_1_cal=Bonjour ! Et si on ne se revoit pas, bon après-midi, bonne soirée et bonne nuit !
sounds.chosen.caleb.e3m3_2_cal=C’est lui. C’est l’homme que je cherche.
sounds.chosen.caleb.e3m3_3_cal=Je suis pas mécano. Mon truc, c’est surtout de faire mal aux gens. On descend.
sounds.chosen.caleb.e3m5_1_cal=Tu sais, cet endroit paraît presque irréel.
sounds.chosen.caleb.e3m5_3_cal=Ce pont a l’air parfaitement sûr.
sounds.chosen.caleb.e3m5_4_cal=Un bel exemple de construction typique de la Cabale.
sounds.chosen.caleb.kill.c_1liner_2=Tout le monde meurt.
sounds.chosen.caleb.msc11cal=Je te dirais bien que je suis désolé, mais tu sais que ce serait pas sincère. Bonne journée.
sounds.chosen.caleb.msc14_cal=Mmm, rien de tel que de la viande fraîchement emballée.
sounds.chosen.caleb.msc15_cal=Inspecteur sanitaire. Je crains de devoir fermer votre établissement.
sounds.chosen.caleb.msc18_cal=Allez, au boulot…
sounds.chosen.caleb.msccaleb1=Fermé à clé.
sounds.chosen.caleb.taunt.tnt5_cal=Ouais, et moi qui me croyais moche.
sounds.chosen.gabriella.e1m4e3_gab=Il faut bien que quelqu’un retienne le train. Ces trucs sont partout dehors. La Cabale doit être sacrément désespérée pour créer de pareilles créatures.
sounds.chosen.gabriella.e1m4e6_gab=Je n’ai pas de problèmes. Je les règle.
sounds.chosen.gabriella.e1m4e8_gab=Je ne suis plus sûre de pouvoir compter sur toi. Ça tourne mal. Si tu ne peux pas régler ça, je m’en chargerai.
sounds.enemies.civilian.02civ1=Hé, mon vieux, ça va ? T’as une sale tête.
sounds.enemies.civilian.02civ3=Hé, je crois que le train est en panne. Tu sais quoi ? On devrait peut-être prendre un taxi.
sounds.enemies.civilian.02civ4=Tu vas aboyer toute la journée, petit chien, ou tu vas mordre ?
sounds.enemies.civilian.02civ5=Pas d’armes ici, mon vieux ! Sauf si tu m’en achètes une.
sounds.enemies.civilian.11civ2=N’importe quoi, sauf des hamburgers.
sounds.enemies.civilian.11civ4=Ouais, j’en ai un pour toi, de hot-dog.
sounds.enemies.civilian.12civ2=Oh, merde !
sounds.enemies.civilian.12civ3=Y a personne. Allez-vous-en.
sounds.enemies.civilian.12civ4=Laissez-moi tranquille !
sounds.enemies.civilian.12civ5=Ça ne m’intéresse pas !
sounds.enemies.civilian.spot11=Ah, merde. C’est vraiment pas mon jour.
sounds.enemies.civilian.spot2=C’est un asile de fous, ici !
sounds.enemies.f_civ.02civ2=C’est pas possible. Je vais arriver en retard au boulot !
sounds.enemies.f_civ.02civ8=J’en sais rien. J’ai dû lui enfoncer la tête un peu trop loin.
sounds.enemies.f_civ.09civ=Qui est là ?
sounds.enemies.f_civ.09civ3=Vraiment ? Super. Je vous ouvre.
sounds.enemies.f_civ.11civ1=Punaise, tout ce cartilage me donne faim. Tu veux quoi pour déjeuner ?
sounds.enemies.f_civ.11civ3=Et pourquoi pas un hot-dog ?
sounds.enemies.f_civ.spot3=Tout part en vrille ici ! Qu’est-ce que c’est que ça ?
sounds.enemies.gideon.15gid2b=Tu n’as pas idée de l’extase que peut procurer la douleur. Permets-moi de te faire une démonstration.
sounds.enemies.gideon.tnt4_gid=Aujourd’hui, je serai témoin de la chute du Grand Traître !
sounds.enemies.gideon.tnt7_gid=Tu seras purgé. La Cabale renaîtra !
sounds.enemies.loudspeaker.2loudspker=Le musée des Antiquités Lafayette est maintenant fermé. Il ouvre tous les jours de 15 h à 17 h. L’entrée coûte 17 dollars. Veuillez tenir vos enfants en laisse en permanence. Merci.
sounds.enemies.prophet.spot3=Bonjour.
sounds.events.cwvoice11=Arrêt des processeurs.
sounds.events.cwvoice6=Accès refusé.
sounds.events.cwvoice8=Champ de force désactivé.
sounds.events.cwvoice9=Unité de récupération cryogénique activée.
sounds.events.davoice1=Bienvenue au musée des Antiquités Lafayette. Ne manquez pas nos salles égyptiennes fraîchement restaurées. L’exposition du jour porte sur les cultes et les rites. Dans l’aile nord, découvrez la reproduction à demi-échelle d’un dieu mythique.
sounds.events.davoice2=Les Incas vénéraient les hauts sommets qui perçaient le ciel sud-américain. Ces montagnes escarpées leur permettaient d’approcher le dieu du Soleil, au cœur de leur religion. Ils faisaient de nombreux sacrifices sur ces cimes froides et imprévisibles.
sounds.events.davoice3=Ces momies ont été exhumées des tombes de Saqqarah. Des débuts de l’Égypte antique à son déclin plus de 3 000 ans après, le site a servi de nécropole à l’élite de Memphis, toute proche. Plusieurs rois d’Égypte ont choisi d’y être enterrés pendant la période thinite et l’Ancien Empire.
sounds.events.vent2=Je suis très, très gravement brûlé, mais pas encore tout à fait mort.
sounds.phones.phone11=Qui est à l’appareil ? Arrêtez d’appeler ici !
sounds.phones.phone12=Quand j’étais jeune, on n’avait pas de générateur de singularité. On tuait le prêtre Drudge à mains nues, et on aimait ça ! On lui attrapait sa sangsue osseuse et on la lui arrachait !
sounds.phones.phone13=Quand j’étais jeune, on n’avait pas de Sangsue de vie ! On tuait les Drudges d’âme à mains nues ! On leur arrachait les jambes à coups de dents et ils revenaient toujours ! On s’en fichait ! On aimait ça !
sounds.phones.phone2=Euh, bonjour, bon après-midi ou bonsoir, monsieur Cal Eb. Je travaille pour un institut de sondage. Nous enquêtons sur les jeux vidéo. Je n’ai rien à vous vendre. Première question : êtes-vous ou avez-vous déjà été un personnage de jeu vidéo ?
sounds.phones.phone4=Le numéro que vous avez composé n’est pas en service. Restez en ligne comme un imbécile et personne ne vous répondra. Ceci est un enregistrement.
sounds.phones.phone6=Pourquoi je ne trouve pas Amanda Huggin’ Kiss ? Vous pouvez m’aider à trouver Amanda Huggin’ Kiss ?
sounds.phones.phone8=Quelqu’un peut vérifier s’il y a un gros cul aux toilettes des hommes ?
sounds.chosen.caleb.e1m1_3_cal=Alors, où sont passés tous ces cinglés armés jusqu’aux dents ?
sounds.chosen.caleb.e1m1_4_cal=Préparez-vous à une surprise. Voilà Caleb !
sounds.chosen.caleb.e1m1_8_cal=C’est l’heure de l’expulsion !
sounds.chosen.caleb.e1m3_3_cal=Mmm, je prendrai un SLT. Un sandwich sang, laitue, tomate. Sans mayo, hein ?
sounds.chosen.caleb.e1m3_4_cal=Ah, ça, c’est de la boulette épicée.
sounds.chosen.caleb.e1m4_2_cal=Ah, quel trou d’enfer. Hé hé, ça me plaît.
sounds.chosen.caleb.e1m5_3_cal=Mmm, ça va empirer sérieusement avant de s’arranger.
sounds.chosen.caleb.e1m5_5_cal=Beurk. Au moins, je suis pas le seul vieux macchabée dans le coin.
