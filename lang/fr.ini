sounds.events.tavoice8=Prochain arrêt, rue Ingram.
sounds.events.tavoice9=Gardez bras et jambes à l’intérieur du train en permanence. Si vous devez vous en débarrasser rapidement, déposez les membres détachés dans les réceptacles stériles prévus à cet effet près de chaque sortie. Merci de veiller à la propreté et à la sécurité des transports Cabalco.

[intro]
line01=Nous sommes la Cabale.
line02=Moi, Gideon, j’en suis le chef, aussi sinistre que génial.
line03=Nous avons toujours rôdé parmi vous.
line04=Comme des asticots dans la carcasse gonflée et puante d’un rat malade.
line05=Serviteurs de Celui qui lie, le dieu des ténèbres Tchernobog.
line06=Il y a encore un siècle, tout se déroulait selon nos plans maléfiques.
line07=Nous n’aurions jamais cru qu’un des nôtres nous trahirait.
line08=Il s’appelait Caleb.
line09=Il a détruit notre dieu et absorbé le pouvoir de Tchernobog.
line10=Moi, et moi seul, je ramènerai notre dieu des ténèbres.
line11=Je détruirai Caleb.
line12=J’écraserai ses entrailles sous mes pieds comme des raisins pourris.
line13=Et Caleb mourra pour la dernière fois.
