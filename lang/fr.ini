authored.876b96893e6e534e.title=Fichez le camp d'ici !
authored.876b96893e6e534e.text=Vous avez réussi. Le dirigeable est condamné. Sortez avant qu'il ne vous emporte avec lui !
authored.1655b5465594c073.title=Objectif nº 1
authored.1655b5465594c073.text=Ophelia a disparu dans une faille avec Gideon. Ils sont peut-être tout près, mais impossible de le savoir. Évitez d'être le prochain sacrifice.
authored.fcfc192a55159c96.title=Objectif nº 1
authored.fcfc192a55159c96.text=Vous devriez pouvoir accéder à la recherche et développement. Allez donc voir ce qu'ils y développent.
authored.f509240c18010417.title=Objectif nº 1
authored.f509240c18010417.text=Encore cet endroit ! Gideon est peut-être dans le coin. Les ascenseurs étaient sa meilleure issue. Qu'attendez-vous pour lui régler son compte ?
authored.c9a269968f66b5ac.title=Arène
authored.c9a269968f66b5ac.text=Trouvez le portail qui mène à|l’Ancien.
authored.e395d02eb7f66023.title=Objectif nº 1
authored.e395d02eb7f66023.text=|Battez l’Ancien pour|rétablir l’ordre dans|l’univers.
authored.1b23dee31a697548.title=Courez et tirez
authored.1b23dee31a697548.text=Frayez-vous un passage à coups de feu et trouvez des boutons à actionner !
authored.04dfc168e9f20485.title=Baissez-vous et rampez
authored.04dfc168e9f20485.text=Vous pouvez maintenant ramper sans danger sur le tapis roulant.
authored.e8938b9bf78b5c45.title=Traquez et tuez
