sounds.events.davoice1=Les damos la bienvenida al Museo de Antigüedades Lafayette. No se pierdan nuestras salas egipcias recién restauradas. La exposición de hoy trata sobre cultos y rituales. En el ala norte pueden ver una reproducción a media escala de un dios mítico.
sounds.events.davoice2=Los incas adoraban las altas cumbres que perforaban el cielo sudamericano. Esas cimas escarpadas eran una forma de acercarse al dios del Sol, centro de su religión. Hacían muchos sacrificios en aquellas cumbres frías e impredecibles.
sounds.events.davoice3=Estas momias se desenterraron en las tumbas de Saqqara. Desde los albores del antiguo Egipto hasta su ocaso más de 3.000 años después, el lugar sirvió de cementerio a la élite de la cercana Menfis. Varios reyes egipcios eligieron Saqqara para enterrarse durante el periodo arcaico y el Imperio Antiguo.
sounds.events.vent2=Tengo quemaduras muy, muy graves, pero aún no estoy del todo muerto.
sounds.phones.phone11=¿Quién es? ¡Deje de llamar aquí!
sounds.phones.phone12=Cuando era joven no teníamos generadores de singularidad. ¡Matábamos al sacerdote Drudge con las manos desnudas y nos gustaba! ¡Le agarrábamos la sanguijuela ósea y se la arrancábamos!
sounds.phones.phone13=¡Cuando era joven no teníamos Sanguijuelas de Vida! ¡Matábamos a los Drudges del Alma con las manos desnudas! ¡Les arrancábamos las piernas a mordiscos y siempre volvían! ¡Nos daba igual! ¡Nos gustaba así!
sounds.phones.phone2=Eh, buenos días, tardes o noches, señor Cal Eb. Trabajo para una empresa de estudios de mercado. Hacemos una encuesta sobre videojuegos. No intento venderle nada. Primera pregunta: ¿es usted o ha sido alguna vez un personaje de videojuego?
sounds.phones.phone4=El número que ha marcado está fuera de servicio. Quédese en línea como un idiota y no le contestará nadie. Esto es una grabación.
sounds.phones.phone6=¿Por qué no encuentro a Amanda Huggin’ Kiss? ¿Me ayudas a encontrar a Amanda Huggin’ Kiss?
sounds.phones.phone8=¡Que alguien mire en el baño de hombres si hay un culo enorme!
