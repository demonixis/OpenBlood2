sounds.enemies.loudspeaker.2loudspker=El Museo de Antigüedades Lafayette ha cerrado. El horario habitual es de 15:00 a 17:00 todos los días. La entrada cuesta 17 dólares. Lleven a sus hijos con correa en todo momento, por favor. Gracias.
