3000=~Ya ni en el metro puedes leer tranquilo el último número de Guns N' Gibs. Primero el revisor se atrevió a confiscarte la petaca de Ol' Red '99. Luego el maquinista, un cobarde, paró el tren una hora porque un crío mocoso había acabado en las vías con su cochecito. Ibas a subir a cantarle las cuarenta cuando reconociste su voz… y supiste que el día se iba a poner… interesante.
3001=~Eso ha dolido. Y mucho. La última vez que perdiste el conocimiento fue después de diecinueve chupitos seguidos de Black Label n.º 47 de JoJo. Aunque quizá influyó más que estuvieras demasiado cerca del puesto de helados que volaste. El idiota del vendedor no debió ponerte virutas en el Killer Kiddy Kone. Hablando de virutas, te convendría encontrar a Gideon y esparcirlo generosamente por la pared más cercana.
3002=~Gideon se te ha escapado, pero sigue huyendo. Pronto le darás su merecido y le apagarás las luces. De momento te ha dejado unos amiguitos podridos. Esos pedazos de carne apestosa recuerdan a los no muertos que fabricaba la Cábala en otros tiempos… salvo por esas raras costuras en el pecho. Esos cadáveres ambulantes tienen algo distinto. Pero, en fin, las vísceras son vísceras.
3003=~Ha sido divertido… casi todo. Por desgracia, Gideon no estaba a bordo. Pero ya sabes dónde buscarlo: ¡en la catedral! Eso decía el cartel: «EL 30 DE OCTUBRE GIDEON PRESENTA SU TESIS SOBRE EL DELITO RITUAL DEL PECADO Y CÓMO SALIR IMPUNE. LLEGUE PRONTO PARA ASISTIR A SU BREVE SIMPOSIO SOBRE LA INCREÍBLEMENTE ONEROSA VIDA MEDIA DE UNA VÁLVULA». No va a decepcionar a sus seguidores. Ve y hazle saber que estás entre el público.
3004=~El Museo de Antigüedades Lafayette de Cabalco anuncia su nueva exposición: Cultos y rituales. Disfrute de una visita guiada por la historia de las organizaciones fanáticas más insólitas del mundo, desde la maldita Secta de la Rana Arborícola Ladradora hasta los temibles Shriners con fez. No olvide sacrificar un momento de su día para ver la nueva exposición animatrónica del Dios Oscuro. ¡Da miedo!
3005=~¡Cómo odias las alcantarillas! El olor tiene su encanto, pero vadear entre cosas que flotan acaba cansando. Cuando gobiernes el mundo, lo declararás zona sin saneamiento. Con alcantarillas al aire libre no habrá que gastar en reparar tuberías. Todo encontrará el mar por su cuenta. Hasta con este perfume local hueles la peste de Gideon. El cobarde debe de ir a un refugio de la Cábala.
3006=~La humanidad se reproduce como las cucarachas y la superpoblación asola el planeta. ¡La enfermedad es ya nuestro segundo gran negocio! Nos enorgullece el cuasimonopolio del Centro de Gestión de Enfermedades de Cabalco. Sus modernas instalaciones cuentan con amplios centros de investigación, disección y traumatología. El CGE está a la vanguardia de toda clase de plagas y dolencias, del virus del Ébola a la rica sífilis de toda la vida. ¿Nuestro lema? Invierta e infeste. ¡Cabalco hace el resto!
3007=~Gideon va hacia una de las aeronaves ejecutivas amarradas en lo alto del edificio. Ya toca aflojar con la carne chamuscada del Beefy Queen. No estás en forma para subir las escaleras. Resulta que Gideon también se atiborra en el BQ, así que ha instalado ascensores exprés en todos sus rascacielos. Ahorrarte más de mil pisos es un detalle, si al menos supieras apagar esa música infernal.
3008=~La aeronave modelo 1701D de Cabalco Industries es una de las mejores y más versátiles que han surcado nuestros cielos mugrientos. Versatilidad es la palabra: sirve a la vez para viajes de negocios de lujo y operaciones militares. ¿Para qué hacer dos viajes? ¡Bombardee ese molesto país del tercer mundo mientras sus mejores clientes vuelan con estilo! Bajo su blindaje, la aeronave Cabalco tiene un corazón de oro. Asientos amplios, cabinas cómodas, azafatas bien armadas y los mejores frutos secos del cielo. Vuele con Cabalco. Vuele con estilo.
3009=~¡Nos estrellamos! ¡Posición de impacto! Pongan los respaldos y las bandejas en posición vertical y bloqueada. Metan la cabeza entre sus propias piernas. Si están fumando, apáguense. Que tengan un buen día y gracias por elegir Cabalco Air.
3010=~¡En esta catedral no hay monjas! La cosa que acecha desde el más allá la ha deformado a su gusto. Hasta te mudarías aquí si estuviera en venta, a un precio razonable y sin esos pesados porteros de la Cábala. Toca hacer limpieza y averiguar adónde ha ido Gideon. Quizá te dé tiempo a sacar un bonito calco en piedra para esa pared vacía de tu vestidor de armas.
3011=~Está entrando en el sector industrial. El ozono se encuentra en nivel tres y la alerta tóxica en nivel cuatro. Use protección respiratoria en todo momento. ¡La ocasión ideal para probar el nuevo Safe Sucks 2 de Cabalco! Protección fácil y barata para cualquier ocasión. Evite zonas de alto riesgo, como el aire libre. Que disfrute de la visita y tenga un buen día.
3012=~Antes los trenes tenían más encanto. Hoy uno se da por satisfecho con salir vivo. Pocas cosas alivian tanto la tensión como volarle a la competencia los trozos vivos… eh… que le queden. Los refugios de la Cábala son el colmo del lujo: la peste, el mobiliario, las ratas, el ambiente y los borrachos. Hablando de citas, Gideon debe de andar por aquí. Ese encuentro promete ser más divertido que practicar tiro con borrachos. ¡Yuju!
3013=~Los habitantes de New Town tienen dos problemas graves: comen demasiado y lo sueltan todo. La combinación será letal… para ellos. A juzgar por el olor, a sus tuberías les vendría bien una buena limpieza. Ahí entras tú, semidiós inmortal y enema andante. Es culpa de Gideon que hayas caído tan bajo, con mierda hasta los tobillos. Añádeselo a la cuenta y cóbraselo en pedazos.
3014=~¿Hambre de más carne? ¡Claro que sí! ¡Todos la tenemos! En Cabalco entendemos de carne. ¡Por eso presentamos Carne en Lata, la gama que satisface todas sus necesidades cárnicas! Sabrosa y asequible. Pruébela en sus sabores favoritos: casquería, vacuno, aves, cerdo, cabra y pescado de fondo. También tenemos carne de masa madre, carne de ciruela fermentada y carne de hongos muy ligeramente alucinógena. En las plantas cárnicas Cabalco creamos los alimentos del futuro. ¡Más del 82 por ciento está libre de E. coli!
3015=~Si estás feliz y lo sabes, revienta unos sesos… Si estás feliz y lo sabes, corta unas venas… Si estás feliz y lo sabes, las cabezas que reboten lo dirán… No hay como amar el trabajo. ¿Otra estación innombrable? Al menos es más bonita que la anterior. Pon a trabajar el dedo del gatillo. Vienes del lado malo de las vías y, como siempre, la luz al final del túnel bien podría ser un tren.
3016=~¡Ja! El cabrón de Gideon pensó que te despistaría con su cambiazo. ¡Ni en sueños, señorito! Cuando lo atrapes, le harás un cambio a tu manera. Podrías empezar por girarle la cabeza para que mire más hacia dentro. Con el tiempo que lleva con la cabeza ahí metida, le resultará familiar el paisaje. Al ataque y todo eso. Basta de ideas entrañables: esta vez pintarás de rojo la línea azul. Rojo sangre.
3017=~¿Harto de tirar el dinero en alquiler? ¡Claro que sí! Sus amigos de Cabalco Construcción e Inmobiliaria acaban de terminar una encantadora urbanización. Como el suelo escasea y es caro, hemos cubierto con tierra fresca aquel asqueroso pozo tóxico y radiactivo de Love Canal. ¡Nunca ha sido tan barata una casa Cabalco! ¿Piensa formar una familia? ¡Compre a lo grande! Ignore los rumores de infertilidad, malestar, vómitos persistentes o bebés de tres cabezas. En Cabalco nos preocupamos por usted y nuestros precios son más que justos.
3018=~¿No te convence el historial de seguridad del transporte local? Solo queda una cosa: ¡destrúyelo! Tira abajo esa porquería. ¿Billete? ¡Ni hablar! El único billete que te hace falta es la escopeta, y va a sembrar el caos. Disfrutar del trabajo siempre ayuda. Quizá convenga salir un momento a respirar aire viciado. Los dos últimos viajes han sido un poco demasiado apretados.
3019=~Esto ya es otra cosa. Como en casa. Dan ganas de tumbarse para el sueño eterno. La inmortalidad no es para tanto; cuesta mucho más de lo previsto. Al menos puedes ayudar a otros a conseguir lo que tú nunca tendrás, y hacerlo más rápido de lo que imaginan. Así eres tú, todo bondad y caridad. Acelera su partida. Salid, estéis donde estéis… vais a ser, ejem, elegidos.
3020=~Bienvenido a New Town, sede de la inmensa central de Cabalco Industries. ¡Los disturbios y las revueltas casi han desaparecido! Sobre el hermoso río en llamas de White Rock, New Town es la estampa casi perfecta de una ciudad apenas oprimida por una megacorporación amoral. Admitimos algún sacrificio ritual, secuestros nocturnos y desapariciones sin dejar rastro. Pero las calles suelen estar limpias y ser seguras, y la economía prospera con algún contratiempo menor. ¡Somos New Town! ¡Cabalco es nuestro amigo!
3021=~¿Le preocupa su futuro? ¿Lo acosaban en el instituto? ¿Busca una carrera exigente? Únase a la División de Seguridad de Cabalco. Un día duro es pasarlo desnudo y sudando dentro de una caja metálica pequeña, oscura y casi sin aire, aferrado a la cordura y acompañado de un par de docenas de ratas hambrientas. ¡Pero basta de hablar de mí! Con nuestro intenso programa de humillaciones y palizas se sentirá como nuevo. Al cabo de doce pasos tendrá un arma bien grande y poder diario de vida y muerte sobre los demás. ¡Ya verán esos imbéciles del instituto!
3022=~Ha llegado al Gran Templo ultrasecreto de Cabalco. No estamos ahora, pero puede dejar sangre en la puerta, a ser posible humana o de cabra. Si es una urgencia, encienda 69 velas blancas, arañe un gran pentagrama en el hormigón con las uñas y baile desnudo en su interior, untado con la sangre de sus dedos destrozados, mientras canta a nuestro Dios Oscuro. En breve le atenderá un pérfido siervo del inframundo. ¡Gracias por su paciencia!
3023=~Bienvenido al control más chungo. Ja. La seguridad de aquí parece un poco demasiado… fanática. Debe de haber otra entrada a la sede de Cabalco. Mientras tanto, haz algo de limpieza y elimina a los que no estén a la altura. A veces hay que manchar para limpiar. Menos mal que no te toca sacar la materia gris de las paredes. Cuando se seca, debe de ser un fastidio. Fabrica tu propio pase de acceso ilimitado.
3024=~¿Busca trabajo? ¡Cabalco siempre necesita un cuerpo más! Contratamos a todas horas y damos muchas ventajas. Trabajará en un enorme rascacielos nuevo, con máquinas de café y refrescos en cada planta y un plan médico, ejem, de otro mundo. Aunque empiece desde abajo, enseguida tendrá a alguien a su cargo. Nuestro departamento de Recursos, eh, Humanos le ahorra las formalidades de las otras empresas. ¿Sin experiencia? ¡No pasa nada! Ni siquiera pedimos currículo ni solicitud. Preséntese y será nuestro… quiero decir, el puesto será suyo. Cabalco es una empresa de oportunidades desiguales.
3025=Hay que reconocer que Cabalco se ha esmerado con este inmueble. Escaleras imponentes, arte raro pero bonito, cubículos divertidísimos y más cosas que volar de las que puedes apuntar con la escopeta. Bonito lugar. Le sentaría bien un pequeño incendio. Pero cultistas, Drudges, Shikari y fanáticos tendrán que irse al infierno. No pase por la casilla de salida ni cobre 200 dólares. El Behemoth parece adorable; sería una buena mascota. Lástima que aún no sepa hacer sus necesidades fuera.
3026=~Toca cortarles la corriente a esos cabrones. Desenchúfalos. Se acabó la alterna. Y la continua también. Bienvenido a la central eléctrica: eres el apagón hecho carne. Esto chisporrotea tanto que podrías salir frito y crujiente. Después de lo de los trenes no te apetece nada ser conductor. Haz lo que mejor sabes hacer: romper cosas. Empieza por los fanáticos. Al trabajo, oh gran cortacircuitos.
3027=~¿Cierra Caleb de verdad las grietas? ¿Recibe Ophelia sus dos minutos de regalo? ¿Qué fue de Gabriel… digo, Gabriella? ¿Y si Ishmael no puede volver a casa? ¿De dónde sacó esos tatuajes?|~No se pierda el próximo episodio de «Arde, arde». Tendrá todas estas respuestas y más, se lo prometemos. Mientras tanto, ¡que empiece el gran BAÑO DE SANGRE!
3028=~¡Ah, la ciencia! Recuerdas con cariño tu primera disección. Temblabas de emoción al despellejar aquel cadáver fétido. Los músculos bailaban con un poco de voltaje. ¡Y qué sorpresa al abrir las tripas por accidente! ¡Menudo gas! Basta de soñar despierto. Ponte a buscar la entrada al departamento de I+D de Cabalco.
3029=~No hay como una opa muy hostil para despertar los sentidos. La caza siempre te ha gustado, tanto de un lado como del otro. Esto se pone divertido. A Gideon se le acaban los escondites. Arrincona a esa rata. Toca hacer un poco de limpieza. Nunca había sido tan divertido vaciar oficinas. ¿Dónde estaba el ascensor a la azotea?
3030=~¡Ahí está tu palomo, Gideon! Suena bien: Gideon el palomo. ¡Yuju! El tiro al plato es uno de tus juegos favoritos. Esto va a ser explosivo. Para él. ¡Lanza! Pum. ¡Lanza! Pum. Se acabó la huida, Gideon. Fin de tu vuelo, imbécil. Se te acabó la suerte.
3031=~Es una lucha a muerte. Preferiblemente la de otro. Ya no se puede tirar de los hilos de Gideon. Le ha llegado la hora al titiritero. ¿Anciano? ¿Estás escuchando? Pues escucha esto…
3032=~Algo ha cambiado, pero no logras poner el dedo en la llaga. Tus viejos amigos están pálidos, hasta enfermizos. ¿Qué demonios les hizo meterse en esos ataúdes? En fin, no hay nada que un poco más de plomo no cure. Plomo en la cabeza y a la cama. Buenas noches, compañeros Elegidos. Que tengáis sueños venenosos.
