authored.876b96893e6e534e.title=¡Lárgate de aquí!
authored.876b96893e6e534e.text=Lo has conseguido. La nave está condenada. ¡Sal de aquí antes de que te arrastre con ella!
authored.1655b5465594c073.title=Objetivo n.º 1
authored.1655b5465594c073.text=Ophelia ha desaparecido en una grieta con Gideon. Quizá estén cerca, pero no hay forma de saberlo. Procura no ser el próximo sacrificio.
authored.fcfc192a55159c96.title=Objetivo n.º 1
authored.fcfc192a55159c96.text=Ya deberías poder acceder a Investigación y Desarrollo. Acércate y averigua qué están tramando.
authored.f509240c18010417.title=Objetivo n.º 1
authored.f509240c18010417.text=¡Otra vez aquí! A lo mejor Gideon anda cerca. Los ascensores eran su mejor vía de escape. ¿A qué esperas para darle una paliza?
authored.c9a269968f66b5ac.title=Arena
authored.c9a269968f66b5ac.text=Encuentra el portal que lleva al|Anciano.
authored.e395d02eb7f66023.title=Objetivo n.º 1
authored.e395d02eb7f66023.text=|Derrota al Anciano|para restaurar el orden|en el universo.
authored.1b23dee31a697548.title=Corre y dispara
authored.1b23dee31a697548.text=¡Ábrete paso a tiros y busca botones que pulsar!
authored.04dfc168e9f20485.title=Agáchate y repta
authored.04dfc168e9f20485.text=Ya puedes arrastrarte sin peligro por la cinta transportadora.
authored.e8938b9bf78b5c45.title=Caza y mata
authored.e8938b9bf78b5c45.text=Busca una forma de llegar a la siguiente planta.
authored.36e16d96eef3f3f2.title=Ascensores inútiles
authored.36e16d96eef3f3f2.text=¡Parece que toca buscar otra ruta!
authored.74ccd748f4e969fb.title=¡Usa el CRU!
authored.74ccd748f4e969fb.text=La tarjeta del CRU te permitirá activarlo.
authored.b99fc6253496e264.title=Ya casi estás…
authored.b99fc6253496e264.text=Cerca de aquí debería haber un ascensor rápido hasta la azotea.
authored.85584cfb63a6b672.title=El escondite
authored.85584cfb63a6b672.text=Busca la forma de llegar al ático de la casa y destruye el álbum de fotos.

