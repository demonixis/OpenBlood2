sounds.events.tavoice9=Mantengan los brazos y las piernas dentro del tren en todo momento. Si necesitan deshacerse de ellos rápidamente, depositen los miembros amputados en los recipientes estériles situados junto a cada salida. Gracias por mantener la red de Cabalco limpia y segura.
