6000=El viaje de cada día se va a poner un poco sangriento.
6001=Gideon te ha fastidiado el viaje y ahora huye como un cobarde. ¿Vas a dejar que se salga con la suya? Síguelo hasta el museo y dale su merecido. Ojo con sus secuaces.
6002=Hay un callejón cerca que sería un buen atajo al museo. Quizá tengas que explorar un poco para encontrarlo.
6003=Los cubos de basura del saliente de enfrente esconden algunas sorpresas. ¡Salta hasta allí y recógelas! Si saltas a la carrera, llegarás más lejos.
6004=¡Tus saltos han dado fruto! Has encontrado una linterna. Búscala en el inventario y pruébala. Te vendrá bien en zonas oscuras.
6005=Prueba esta MAC-10 con los blancos. El disparo secundario es más preciso. La mayoría de las armas de Blood II tienen un modo de disparo alternativo.
6006=Contesta con la tecla de interactuar. Puedes usarla para activar muchos objetos de Blood II.
6007=¡Parece que es el callejón que buscas! Tendrás que afinar los saltos para llegar allí.
6008=El museo está al otro lado, pero el ayuntamiento ha tenido el detalle de cerrar el paso con contenedores. Te tocará hacer unas cuantas piruetas.
6009=Gideon se ha escapado por la lavandería Laundro-Hut. ¡Coge la ropa y baja tras él!
6010=Busca el camino a la catedral. Cuidado con los esbirros de Gideon y con lo que pueda ser peor…
6011=Gideon anda por aquí. La Cábala ha cerrado bien el recinto. Ojo con sus sistemas de seguridad.
6012=El cañón de singularidad de Gideon ha tenido un efecto curioso. En vez de destruirte, ha traído de vuelta a Gabriel. Gideon vuelve a huir. No hay tiempo para viejos amigos.
6013=Se rumorea que hay una entrada subterránea a una instalación de Cabalco cerca. Te jugarías el último cartucho a que Gideon va hacia allí.
6014=¡Ábrete paso a tiros y busca botones que pulsar!
6015=Ya puedes arrastrarte sin peligro por la cinta transportadora.
6016=Busca una forma de llegar a la siguiente planta.
6017=¡Parece que toca buscar otra ruta!
6018=La tarjeta del CRU te permitirá activarlo.
6019=Cerca de aquí debería haber un ascensor rápido hasta la azotea.
6020=Hay un guardaespaldas de Gideon cerca. Tendrás que pasar por encima de él para llegar al pez gordo.
6021=Nunca te ha gustado volar. Llega al compartimento delantero antes de que te marees.
6022=Hay que bajar a tierra este pájaro. El botón de autodestrucción debería estar en el puente de mando.
6024=A este sitio le vendría bien un exorcismo. Quizá también descubras qué trama Gideon.
6025=El tren va descontrolado. Hazte con los mandos.
6026=Encuentra a Gideon en el refugio en ruinas de la Cábala.
6027=Han tomado todo el barrio y el metro, la única salida, ha quedado destruido. Escapa por la entrada al sótano del callejón cercano.
6028=¡Has caído en una trampa! Seguro que varios pelotones de fanáticos de la Cábala ya van a por ti. Vuelve a la calle.
6029=La Cábala te ha tendido una emboscada. Intenta salir de aquí con vida.
6030=¡Convierte esta planta de envasado de carne en un matadero!
6031=Al activar la trituradora se ha abierto la puerta de la cinta. Súbete y atraviesa la trituradora para avanzar.
6032=¡Vuelve a la matanza!
6033=El acceso al metro está bloqueado. Busca el túnel del exprés del centro.
6034=Busca la terminal de la línea azul para escapar de esta parte de la ciudad.
6035=Busca la forma de entrar en la estación.
6036=El acceso a la línea azul del metro ya está abierto. ¡Encuéntralo y lárgate!
6037=Cuidado con el tren.
6038=Busca otra ruta a la estación de metro.
6039=Este no es el tren correcto. Pasa al que va por delante.
6040=Ábrete paso por el subsuelo de Saqqara.
6041=El mando manual ha bajado el puente. Ahora toca volver hasta él.
6042=Busca cómo bajar el puente y crúzalo. Ten cuidado, esto está infestado de alimañas de Cabalco.
6043=Parece la única entrada a la sede de la Cábala. Intenta superar las puertas de seguridad sin armar demasiada carnicería.
6045=La puerta de delante lleva a Investigación y Desarrollo. Quizá allí esté el generador de singularidad del que todos hablan. Busca cómo desactivar la seguridad.
6046=Gideon tiene que andar cerca. Lo más seguro para él es estar lo más lejos posible de ti. Va a correr sangre. Espero que hayas traído cubo y fregona.
6049=Los mandos de seguridad están en el sector 4 de la central. Ya sabes qué hacer al encontrarlos. No te sorprendas si aparecen tropas de la Cábala.
6050=Toca investigar por tu cuenta. Encuentra al científico chalado y quizá te diga dónde guarda el generador de singularidad.
6051=Te acercas a lo alto del edificio. A Gideon se le acaban los escondites. Igual está debajo de un escritorio. ¡Vuela todo por los aires y sal de dudas!
6052=Encuentra a Gideon y el portal que lleva al Anciano.
