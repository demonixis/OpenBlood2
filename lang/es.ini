2caleb2=Dejarme con vida.
3caleb1=… ¿Gabriel?
3caleb2=Cuéntaselo a alguien a quien le importe.
3caleb3=Las cosas han cambiado. Pero no hace falta que te lo diga.
3caleb4=No eres mi tipo.
4caleb1=Tú eliges. Lárgate ahora y vivirás. Quédate y morirás.
4caleb2=Pues vas a morir.
bmpr1caleb1=Odio volar.
5caleb1=Esto puede ponerse feo.
6caleb1=Estos no son de la Cábala.
6caleb2=Son otra cosa.
6caleb3=Tengo un tren que coger. Ya nos veremos.
8caleb1=Estás de broma.
7caleb1=No te haces una idea.
7caleb2=Ya lo creo. Y apenas estoy calentando.
7caleb3=Soy la negación en persona. No voy a afrontar nada.
7caleb4=No necesito niñera.
9caleb1=Oh, haré mucho más que eso.
9caleb2=Genial.
9caleb3=Que arda. Nunca me ha gustado este sitio.
9caleb4=Pizza.
9caleb5=Un estriptis a domicilio.
