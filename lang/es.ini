[dialogue]
4prophet1=Me quedo.
1acaleb1=¡Vamos, ven!
1acaleb2=Fin de trayecto.
2caleb1=Acabas de cometer tu segundo error. Te has quedado.
2caleb2=Dejarme con vida.
3caleb1=… ¿Gabriel?
3caleb2=Cuéntaselo a alguien a quien le importe.
3caleb3=Las cosas han cambiado. Pero no hace falta que te lo diga.
3caleb4=No eres mi tipo.
4caleb1=Tú eliges. Lárgate ahora y vivirás. Quédate y morirás.
4caleb2=Pues vas a morir.
bmpr1caleb1=Odio volar.
5caleb1=Esto puede ponerse feo.
6caleb1=Estos no son de la Cábala.
6caleb2=Son otra cosa.
6caleb3=Tengo un tren que coger. Ya nos veremos.
8caleb1=Estás de broma.
7caleb1=No te haces una idea.
7caleb2=Ya lo creo. Y apenas estoy calentando.
7caleb3=Soy la negación en persona. No voy a afrontar nada.
7caleb4=No necesito niñera.
9caleb1=Oh, haré mucho más que eso.
9caleb2=Genial.
9caleb3=Que arda. Nunca me ha gustado este sitio.
9caleb4=Pizza.
9caleb5=Un estriptis a domicilio.
11caleb1=He soñado con verte atada así.
11caleb2=Dame un besito, nena.
11caleb3=Ah, otra vez tú. ¿Por qué no vuelves en un par de minutos?
11caleb4=¡Ophelia! Vale, ya basta. ¡Te toca morir!
13caleb1=Lo que te queda de vida se mide en segundos, imbécil.
14caleb1=Pues tendré que seguir pateándote el culo.
14caleb2=Nunca he dicho que sea listo.
15caleb1=Adelante. Yo miro.
15caleb2=¿Bailamos, hombre del saco?
16caleb1=Cuando llegues al infierno, diles que vas de mi parte. Te harán un descuento.
16caleb2=Relájate, estás muerto.
16caleb3=Demasiado tarde, ya estás muerto.
16caleb4=La vida no es justa y la muerte tampoco. Acostúmbrate.
16caleb5=Gracias y buenas noches.
17caleb1=Qué va.
17caleb2=Me vas a herir los sentimientos.
17caleb3=¿Y bien?
17caleb4=Basta de charla. Peleemos.
19caleb1=Vaya, hola, señor Elegante. Perdona si no te doy la mano.
20caleb1=No entiendo nada de esas cosas.
20caleb2=¿Qué vas a hacer, darme unos azotes?
20caleb3=Vale, cállate, tengo que concentrarme.
20caleb4=Algo así como un enema espiritual. En el buen sentido.
3gab1=¿Qué coño es esto?
3gab2=¿Caleb?
3gab3=Gabriella. Es una larga historia.
3gab4=¿Así se saluda a una vieja amiga?
3gab5=Tengo que ir contigo. Para averiguar qué está pasando.
3gab6=¿Te has mirado al espejo últimamente? Tú tampoco eres un partidazo.
6gab1=Esas cosas están por todas partes. La Cábala tiene que estar desesperada para crear criaturas así.
6gab2=Entonces, ¿qué son?
6gab4=¿Qué estás haciendo?
6gab5=No te preocupes, hombrecillo. Volveremos a vernos.
14gab1=Tenemos que ir tras él. Quién sabe qué le espera.
17gab1=Insecto, somos el Anciano. Póstrate ante nosotros.
17gab2=¿Eres lo único que nos separa del dominio absoluto? Patético.
17gab3=Todo lo que es dejará de ser. Todo lo que fue nunca ha sido. Todo lo que estaba por venir… eh…
17gab4=Todo lo que estaba por venir nunca… ocurrirá.
20gab1=Os mato a los dos como no os calléis.
1agid1=¡Les habla Gideon, su maquinista invitado! ¡Agárrense, que el viaje podría ponerse un poco… sangriento!
1agid2=Sé que estás aquí, Caleb. Estoy deseando arrancarte el bazo y ponérmelo de sombrero.
2gid1=No tienes mucha suerte con los trenes, ¿eh?
2gid2=¿Ah, sí? ¿Y cuál fue mi primer error?
3gid1=Es hora de morir, Elegido.
7gid1=Más vale que funcione esta vez.
7gid2=¿Ishmael?
7gid3=Esta vez has tenido suerte, Traidor. En unas horas todo volverá a su sitio y me habré librado de ti para siempre. Por ahora, debo retirarme. No te preocupes, mis tropas te harán compañía. Pórtate bien.
10gid1=Suena a casa.
10gid2=¡Quítate de mi puto camino!
11gid1=Me imaginaba que vendrías aquí.
11gid2=Siento interrumpir este bonito reencuentro, Traidor, pero necesito mantenerte motivado.
14gid1=¡Esto no ha acabado! ¡Nunca me derrotarás de verdad!
15gid1=Ah, Caleb. Te esperaba, bruto predecible. No tardaré ni un minuto. Solo estoy… transformándome…
15gid2=… en algo… desagradable.
15gid3=¿Qué te parece mi nuevo aspecto? No sabes lo exquisito que puede ser el dolor. Permíteme una demostración.
15gid4=¡Me refiero a contigo!
16gid1=¡No! ¡No es justo! ¡Voy a matarte!
7ish1=Esto sí que es un giro inesperado.
7ish2=¿Un mal día?
7ish3=¿Eres consciente de cuánto daño estás haciendo?
7ish4=No me refiero a eso. Eres el Que Une. Tarde o temprano tendrás que afrontarlo.
7ish5=Pues que sepas que somos los Elegidos. Estamos contigo, te guste o no.
7ish6=Sí, Ophelia también. Fue la primera en cruzar.
7ish7=No me lo perdería por nada del mundo. Aunque igual acabas destruyéndolo.
9ish1=Estás pensando en Ophelia. Conmovedor.
9ish2=Hay una grieta permanente en el templo de Gideon. Es el foco de todo el daño que se está causando. El epicentro, por así decirlo. Allí encontrarás a Ophelia.
9ish3=La destrucción de Tchernobog abrió muchas puertas entre los mundos. Solo el Que Une puede sellarlas. Ese poder está en ti. Esta realidad perecerá si no la restauras.
9ish4=Otra realidad se está abriendo paso por las grietas, antigua y voraz. No es buena ni mala, simplemente es. Pero nos devorará a todos.
14ish1=No pensarás ir tras él, ¿verdad?
14ish2=Supongo que será algo muy desagradable.
17ish1=Insecto, somos el Anciano. Póstrate ante nosotros.
17ish2=¿Eres lo único que nos separa del dominio absoluto? Patético.
17ish3=Todo lo que es dejará de ser. Todo lo que fue nunca ha sido. Todo lo que estaba por venir… eh…
17ish4=Todo lo que estaba por venir nunca… ocurrirá.
20ish1=Esto no ha terminado, Caleb. Debes sellar las grietas. Debes recomponer el tejido de esta realidad antes de que se desgarre.
20ish2=El poder está en ti. Ya es hora de usarlo.
3madsci1=No me lo esperaba. Mmm, tendré que recalibrar los parámetros de la singularidad.
7madsci1=Créame, esta vez mis cálculos son perfectos.
10madsci1=Señor, debo aconsejarle que lo reconsidere. Mis cálculos siguen sin ser concluyentes. Puede que las grietas sean una fuente de poder ilimitado, como sugiere, pero también podrían ser trampas mortales en el tejido del espacio-tiempo. Podrían llevarlo a un reino de caos y maldad puros donde sería aniquilado por completo.
10madsci2=¡Pero, señor!
10madsci3=¡No! Nunca tuve ocasión… de decirle… cuánto le quiero…
12madsci1=Hola, hola, hola. Le doy la bienvenida a Investigación y Desarrollo, o como me gusta llamarlo… I+D. Puede llamarme… doctor. Últimamente he tenido sujetos muy interesantes con todas las fluctuaciones del sustrato cósmico, pero he de decir que espero con especial interés su… disección. Pase al laboratorio principal y empezaremos el experimento…
11oph1=El príncipe azul, supongo.
11oph2=Desátame y te daré una tarta de vainilla entera.
14oph1=Quiere que le sigas, imbécil.
14oph2=¿A qué esperamos?
17oph1=Insecto, somos el Anciano. Póstrate ante nosotros.
17oph2=¿Eres lo único que nos separa del dominio absoluto? Patético.
17oph3=Todo lo que es dejará de ser. Todo lo que fue nunca ha sido. Todo lo que estaba por venir… eh…
17oph4=Todo lo que estaba por venir nunca… ocurrirá.
20oph1=No tienes elección. Escucha a Ishmael, idiota.
20oph2=Yo te azoto si tú me azotas.
sounds.chosen.caleb.e1m1_1_cal=No soy un mal sueño. Soy su peor pesadilla.
sounds.chosen.caleb.e1m3_2_cal=Ya no los hacen como antes.
sounds.chosen.caleb.e1m4_1_cal=Parece que toca matar.
sounds.chosen.caleb.e1m4e5a_cal=Yo qué coño sé. ¿A ti qué te importa? No parece que te den problemas.
sounds.chosen.caleb.e1m4e7a_cal=¿Qué se supone que significa eso?
sounds.chosen.caleb.e1m4e9a_cal=¡Lo resolveré!
sounds.chosen.caleb.e1m5_1_cal=Oye, aquí deberían darme una comisión.
sounds.chosen.caleb.e2m5_1_cal=Es la hora de Howdy Doody, chavales. Ya está aquí el malo.
sounds.chosen.caleb.e2m5_2_cal=Bueno, es una manera de abrir a alguien en canal. Pero mi método es mucho más rápido y divertido.
sounds.chosen.caleb.e2m5_4_cal=Buf, me siento como un trozo de carne.
sounds.chosen.caleb.e3m1_2_cal=¡Ahora sí que va a arder esto!
sounds.chosen.caleb.e3m1_3_cal=Ay, nunca hay nada fácil.
sounds.chosen.caleb.e3m2_1_cal=¡Qué desperdicio de munición buena!
sounds.chosen.caleb.e3m2_2_cal=Mmm, un control de seguridad. Vaya, parece que me han pillado. Tendré que dar media vuelta.
sounds.chosen.caleb.e3m2_3_cal=Vaya, con unas instalaciones tan espaciosas, igual debería buscar trabajo aquí.
sounds.chosen.caleb.e3m3_1_cal=¡Buenos días! Y por si no volvemos a vernos, ¡buenas tardes, buenas noches y hasta mañana!
sounds.chosen.caleb.e3m3_2_cal=Es él. Ese es el hombre que busco.
sounds.chosen.caleb.e3m3_3_cal=No soy mecánico. Yo me dedico a hacerle daño a la gente. Para abajo.
sounds.chosen.caleb.e3m5_1_cal=Sabes, este sitio parece casi irreal.
sounds.chosen.caleb.e3m5_3_cal=Este puente parece de lo más seguro.
sounds.chosen.caleb.e3m5_4_cal=Un buen ejemplo de construcción típica de la Cábala.
sounds.chosen.caleb.kill.c_1liner_2=Todo el mundo muere.
sounds.chosen.caleb.msc11cal=Te diría que lo siento, pero sabes que no sería sincero. Que tengas un buen día.
sounds.chosen.caleb.msc14_cal=Mmm, no hay nada como la carne recién envasada.
sounds.chosen.caleb.msc15_cal=Inspección de sanidad. Me temo que voy a tener que cerrar el local.
sounds.chosen.caleb.msc18_cal=Vuelta al tajo…
sounds.chosen.caleb.msccaleb1=Cerrado con llave.
sounds.chosen.caleb.taunt.tnt5_cal=Sí, y yo que me creía feo.
sounds.chosen.gabriella.e1m4e3_gab=Alguien tiene que retener el tren. Está todo lleno de esas cosas ahí fuera. La Cábala tiene que estar desesperada para crear criaturas así.
sounds.chosen.gabriella.e1m4e6_gab=No tengo problemas. Los resuelvo.
sounds.chosen.gabriella.e1m4e8_gab=Ya no sé si puedo contar contigo. Esto se está poniendo feo. Si no puedes resolverlo tú, lo haré yo.
sounds.enemies.civilian.02civ1=Eh, colega, ¿estás bien? Tienes una pinta horrible.
sounds.enemies.civilian.02civ3=Oye, creo que el tren no funciona. ¿Sabes qué? Igual deberíamos pillar un taxi.
sounds.enemies.civilian.02civ4=¿Vas a ladrar todo el día, perrito, o vas a morder?
sounds.enemies.civilian.02civ5=¡Aquí no se admiten armas, colega! A menos que compres una para mí.
sounds.enemies.civilian.11civ2=Cualquier cosa menos hamburguesas.
sounds.enemies.civilian.11civ4=Sí, yo tengo un perrito caliente para ti.
sounds.enemies.civilian.12civ2=¡Joder!
sounds.enemies.civilian.12civ3=No hay nadie en casa. Lárgate.
sounds.enemies.civilian.12civ4=¡Déjame en paz!
sounds.enemies.civilian.12civ5=¡No quiero nada!
sounds.enemies.civilian.spot11=Ah, mierda. Hoy no es mi día.
sounds.enemies.civilian.spot2=¡Esto es un manicomio!
sounds.enemies.f_civ.02civ2=Esto no puede estar pasando. ¡Voy a llegar tarde al trabajo!
sounds.enemies.f_civ.02civ8=No sé. Supongo que le metí la cabeza demasiado adentro.
sounds.enemies.f_civ.09civ=¿Quién es?
sounds.enemies.f_civ.09civ3=¿En serio? Genial. Te abro.
sounds.enemies.f_civ.11civ1=Jo, tanto cartílago me está dando hambre. ¿Qué quieres para comer?
sounds.enemies.f_civ.11civ3=¿Qué tal un perrito caliente?
sounds.enemies.f_civ.spot3=¡Aquí se está yendo todo al carajo! ¿Qué es esto?
sounds.enemies.gideon.15gid2b=No sabes lo exquisito que puede ser el dolor. Permíteme una demostración.
sounds.enemies.gideon.tnt4_gid=¡Hoy presenciaré la caída del Gran Traidor!
sounds.enemies.gideon.tnt7_gid=Serás purgado. ¡La Cábala volverá a vivir!
sounds.enemies.loudspeaker.2loudspker=El Museo de Antigüedades Lafayette ha cerrado. El horario habitual es de 15:00 a 17:00 todos los días. La entrada cuesta 17 dólares. Lleven a sus hijos con correa en todo momento, por favor. Gracias.
sounds.enemies.prophet.spot3=Hola.
sounds.events.cwvoice11=Procesadores apagados.
sounds.events.cwvoice6=Acceso denegado.
sounds.events.cwvoice8=Campo de fuerza desactivado.
sounds.events.cwvoice9=Unidad de recuperación del almacén criogénico activada.
sounds.events.davoice1=Les damos la bienvenida al Museo de Antigüedades Lafayette. No se pierdan nuestras salas egipcias recién restauradas. La exposición de hoy trata sobre cultos y rituales. En el ala norte pueden ver una reproducción a media escala de un dios mítico.
sounds.events.davoice2=Los incas adoraban las altas cumbres que perforaban el cielo sudamericano. Esas cimas escarpadas eran una forma de acercarse al dios del Sol, centro de su religión. Hacían muchos sacrificios en aquellas cumbres frías e impredecibles.
sounds.events.davoice3=Estas momias se desenterraron en las tumbas de Saqqara. Desde los albores del antiguo Egipto hasta su ocaso más de 3.000 años después, el lugar sirvió de cementerio a la élite de la cercana Menfis. Varios reyes egipcios eligieron Saqqara para enterrarse durante el periodo arcaico y el Imperio Antiguo.
sounds.events.vent2=Tengo quemaduras muy, muy graves, pero aún no estoy del todo muerto.
sounds.phones.phone11=¿Quién es? ¡Deje de llamar aquí!
sounds.phones.phone12=Cuando era joven no teníamos generadores de singularidad. ¡Matábamos al sacerdote Drudge con las manos desnudas y nos gustaba! ¡Le agarrábamos la sanguijuela ósea y se la arrancábamos!
sounds.phones.phone13=¡Cuando era joven no teníamos Sanguijuelas de Vida! ¡Matábamos a los Drudges del Alma con las manos desnudas! ¡Les arrancábamos las piernas a mordiscos y siempre volvían! ¡Nos daba igual! ¡Nos gustaba así!
sounds.phones.phone2=Eh, buenos días, tardes o noches, señor Cal Eb. Trabajo para una empresa de estudios de mercado. Hacemos una encuesta sobre videojuegos. No intento venderle nada. Primera pregunta: ¿es usted o ha sido alguna vez un personaje de videojuego?
sounds.phones.phone4=El número que ha marcado está fuera de servicio. Quédese en línea como un idiota y no le contestará nadie. Esto es una grabación.
sounds.phones.phone6=¿Por qué no encuentro a Amanda Huggin’ Kiss? ¿Me ayudas a encontrar a Amanda Huggin’ Kiss?
sounds.phones.phone8=¡Que alguien mire en el baño de hombres si hay un culo enorme!
sounds.chosen.caleb.e1m1_3_cal=A ver, ¿dónde se han metido todos esos locos armados hasta los dientes?
sounds.chosen.caleb.e1m1_4_cal=¡Prepárense para una sorpresa! ¡Aquí está Caleb!
sounds.chosen.caleb.e1m1_8_cal=¡Hora del desalojo!
sounds.chosen.caleb.e1m3_3_cal=Mmm, quiero un SLT. Un sándwich de sangre, lechuga y tomate. Sin mayonesa, ¿eh?
sounds.chosen.caleb.e1m3_4_cal=Ah, eso sí que es una albóndiga picante.
sounds.chosen.caleb.e1m4_2_cal=Ah, este sitio es un agujero infernal. Je, je, me gusta.
sounds.chosen.caleb.e1m5_3_cal=Mmm, esto va a empeorar mucho antes de mejorar.
sounds.chosen.caleb.e1m5_5_cal=Uf. Al menos no soy el único muerto viejo de este sitio.
sounds.chosen.caleb.msc16_cal=Vaya desastre. Las condiciones son de todo menos higiénicas.
sounds.chosen.caleb.msc17_cal=Mmm, el de uva es mi favorito. ¡Ñam!
sounds.chosen.caleb.msccaleb2=Está atascado.
sounds.enemies.civilian.idle2=Esto no está pasando. Esto no está pasando. Esto no está pasando. Esto no está pasando.
sounds.events.cwvoice10=Autodestrucción de emergencia activada. Autodestrucción en 60 segundos.
sounds.events.cwvoice5=Acceso autorizado.
sounds.events.psvoice1=Doctor Vandervoort, preséntese en la sala de disección. Hay una hemorragia que requiere su atención.
sounds.events.psvoice10j=Recuerden, el progreso está por encima de la seguridad.
sounds.events.psvoice11j=Atención, hay un intruso en el nivel 3. Está armado y es extremadamente peligroso. No se acerquen a este hombre bajo ninguna circunstancia. De hecho, corran en dirección contraria tan rápido como puedan. Gracias y que tengan un buen día.
sounds.events.psvoice2l=Doctor Kohler, preséntese en recepción. Doctor Kohler, acuda a recepción, por favor. Su novio lo está esperando.
sounds.events.psvoice3=Doctor Cattell, hay una emergencia en el laboratorio de exploración 7.
sounds.events.psvoice7l=Doctor Coleman, acuda a neurología. Doctor Coleman, preséntese en neurología, por favor.
sounds.events.psvoice8l=Se solicita al personal de los niveles 10, 11 y 12 que se presente en descontaminación.
sounds.events.tavoice1=Bienvenidos a la red interurbana de Cabalco. Sabemos que pueden elegir cómo viajar y nos alegra que hayan elegido Cabalco.
sounds.events.tavoice2a=La red interurbana de Cabalco se está renovando. Los atracos han bajado un 13 %, las palizas al azar un 6 %, los asesinatos un 3 % y las averías generales un 7 %. Por desgracia, las mutilaciones de animales han aumentado un asombroso 96 %.
sounds.events.tavoice3=Está terminantemente prohibido empalar a otros pasajeros con objetos afilados. Gracias.
sounds.events.tavoice4=Está prohibido fumar en los transportes de Cabalco. Gracias.
sounds.events.tavoice5=Nos acercamos al Expreso del Centro.
sounds.events.tavoice6=Próxima parada, calle Pickman.
sounds.events.tavoice7=Estamos entrando en el sector industrial.
sounds.events.tavoice8=Próxima parada, calle Ingram.
sounds.events.tavoice9=Mantengan los brazos y las piernas dentro del tren en todo momento. Si necesitan deshacerse de ellos rápidamente, depositen los miembros amputados en los recipientes estériles situados junto a cada salida. Gracias por mantener la red de Cabalco limpia y segura.
sounds_ao.chosen.caleb.calebintro1.1=Allí estaba yo, varado en el páramo helado, corto de munición, sin una gota de matarratas y perseguido por patrullas de la Cábala.
sounds_ao.chosen.caleb.calebintro1.2=Apenas veía nada entre tanta nieve, pero juraría que distinguí una luz delante de mí. Verdosa, bastante inquietante.
sounds_ao.chosen.caleb.calebintro1.3=«Un sitio de los que me gustan», recuerdo haber pensado.
sounds_ao.chosen.caleb.calebintro1.4=Así que seguí avanzando a duras penas y… ¡Hala! ¿A vosotros también os está dando el telele?
sounds_ao.chosen.caleb.calebl1a=¿Qué demonios? ¿Qué es esto? ¿Un viaje de ácido con distorsión temporal?
sounds_ao.chosen.caleb.calebl1b=Maldita sea, ¿otro portal? Odio estas cosas. En fin, allá voy.
sounds_ao.chosen.caleb.calebl2a=Pero qué… Ophelia, ¿qué pasa?
sounds_ao.chosen.caleb.calebl2b=¿Dónde estoy? Mmm, una fraternidad. Espera… ¡No puede ser!
sounds_ao.chosen.caleb.calebl2c=No creo, hermana. ¡Oh, no, ya está pasando otra vez!
sounds_ao.chosen.caleb.calebl3a=Malditas esferas temporales. Me estoy hartando.
sounds_ao.chosen.caleb.calebl3b=¿Qué? ¿JoJo?
sounds_ao.chosen.caleb.calebl3c=¡Anda! Oye, ¿me haces un momento el número de la cuerda floja? Siempre me ha encantado. Uy.
sounds_ao.chosen.caleb.calebl4at1=Por el amor de…
sounds_ao.chosen.caleb.calebl4b=Hola, Gabriella.
sounds_ao.chosen.caleb.calebl4c=Da igual. Empiezo a ver un patrón. ¿Adónde me mandará ahora? Ya he visitado a todos los Elegidos.
sounds_ao.chosen.caleb.calebl4d=Vale, hasta luego.
sounds_ao.chosen.caleb.calebl6a=Así que tú eres lo que me arrastra por todas estas grietas. Ahora vas a pagar. Y más vale que mis salchichas no se quemen mientras vuelvo.
sounds_ao.chosen.caleb.llcaleb1a=Uf, qué frío.
sounds_ao.chosen.caleb.llcaleb1b=Un laberinto de setos. ¡Qué delicia!
sounds_ao.chosen.caleb.llcaleb2a=¡Ay, mi cabeza! ¿Una iglesia? Esto sí que es una pesadilla.
sounds_ao.chosen.caleb.llcaleb2d=Vamos, terneritos. Wyoming será vuestro nuevo hogar.
sounds_ao.chosen.caleb.llcaleb2e=Es hora de quitarme la resaca con otro trago.
sounds_ao.chosen.caleb.llcaleb2g=Ah, sí, con esto te saldrán pelos en el culo.
sounds_ao.chosen.caleb.llcaleb2h=Ah, lo mejor para la resaca es otro trago.
sounds_ao.chosen.caleb.llcaleb2i=Mmm… Este es el mejor nivel en el que he estado.
sounds_ao.chosen.caleb.llcaleb2j=Tengo el estómago raro.
sounds_ao.chosen.gabriella.gab43=¡Tú!
sounds_ao.chosen.gabriella.gab44=Gabriella.
sounds_ao.chosen.gabriella.gab45=Ni idea. Tú sigue. Estoy cansada.
sounds_ao.chosen.gabriella.gabint11=Bueno, Ophelia, ¿cuál es tu historia más terrorífica? ¿Te rompiste una uña al recargar?
sounds_ao.chosen.gabriella.gabint21.1=¡Por supuesto!
sounds_ao.chosen.gabriella.gabint21.2=De niña, papá me llevaba todos los años al espectáculo de fenómenos. Y todos los años veía a JoJo.
sounds_ao.chosen.gabriella.gabint21.3=Solía tirarle terrones de tierra.
sounds_ao.chosen.gabriella.gabint31=Una vez tuve que pasar la noche en una mansión espeluznante.
sounds_ao.chosen.gabriella.gabint32=Y ya está. Daba miedo.
sounds_ao.chosen.gabriella.gabint33=¡No!
sounds_ao.chosen.gabriella.gabint34=¿Queréis que cuente la historia o no?
sounds_ao.chosen.gabriella.gabint35=Da mucho más miedo si cuento los detalles.
sounds_ao.chosen.gabriella.gabint36.1=¡Bien, ahora callaos los dos!
sounds_ao.chosen.gabriella.gabint36.2=Allí estaba yo, en una mansión vieja y podrida, en lo más profundo del pantano cerca de donde me crie.
sounds_ao.chosen.gabriella.gabint36.3=Era una noche nublada y el aire estaba cargado de niebla y gases del pantano.
sounds_ao.chosen.gabriella.gabint41=Parece que voy a pasar la noche aquí. Será mejor echar un vistazo y buscar un dormitorio.
sounds_ao.chosen.gabriella.gabint42=Ya está. Ahora, a dormir bien.
sounds_ao.chosen.ishmael.ish31=Aquí está JoJo, amo.
sounds_ao.chosen.ishmael.ish32=JoJo escucha y obedece, amo.
sounds_ao.chosen.ishmael.ish33=Bueno, no ha sido tan malo. Me pregunto si algún día echaré de menos el olor de mi propio estiércol mezclado con heno.
sounds_ao.chosen.ishmael.ish34=¡Oh, hola! ¿No tendrás plátanos por casualidad?
sounds_ao.chosen.ishmael.ish35=Así es.
sounds_ao.chosen.ishmael.ishint21.1=Bueno, supongo que me toca, ¿no? Vaya, vaya. Igual que Ophelia, guardo un secreto.
sounds_ao.chosen.ishmael.ishint21.2=Seguro que los dos habéis oído hablar de JoJo, el chico idiota del circo.
sounds_ao.chosen.ishmael.ishint22.1=Sí, bueno, me acuerdo. Veréis, JoJo era yo.
sounds_ao.chosen.ishmael.ishint22.2=Por entonces el paro no cubría a los sectarios malvados, y el circo era el único sitio donde un tipo tatuado sin empleo podía encontrar trabajo.
sounds_ao.chosen.ishmael.ishint22.3=Así que me convertí en JoJo por un tiempo. El JoJo anterior me legó el venerable manto de ser JoJo.
sounds_ao.chosen.ishmael.ishint22.4=Y con orgullosa elegancia me pavoneé por el escenario en mi primer día.
sounds_ao.chosen.ishmael.ishint22.5=Luego, mocosos cabrones que tiraban tierra como tú me enseñaron lo que de verdad significaba ser un fenómeno.
sounds_ao.chosen.ishmael.ishint22.6=Al cabo de un año, estaba preso de mi propia baja autoestima. Pero un día todo cambió.
sounds_ao.chosen.ishmael.ishint22.7=Tchernobog me habló y me ordenó librarme de aquella burla mortal.
sounds_ao.chosen.ishmael.ishint22.8=Y eso hice. Pero no fue fácil.
sounds_ao.chosen.ishmael.ishint31=Debo decir que me siento bastante estafado.
sounds_ao.chosen.ishmael.ishint32=Adelante. De todos modos, aún nos queda media bolsa de nubes.
sounds_ao.chosen.ishmael.ishintro=Eh, ¿podéis pasarme las salchichas?
sounds_ao.chosen.ishmael.ishoutro=Eh, disculpad, ¿quién cogió la última nube?
sounds_ao.chosen.ophelia.oph21=¡Tengo que destruir esos álbumes de fotos!
sounds_ao.chosen.ophelia.oph22=¡Ya está! ¡He borrado mi pasado y puedo unirme a la Cábala!
sounds_ao.chosen.ophelia.oph23=Oye, ¿qué haces en mi historia?
sounds_ao.chosen.ophelia.oph24=Eh… Estás teniendo un mal sueño, querido Caleb. Solo es una pesadilla.
sounds_ao.chosen.ophelia.ophint11.1=Qué gracioso. La verdad es que tengo que contaros un secretillo para poder contar esta historia.
sounds_ao.chosen.ophelia.ophint11.2=Pero no se lo digáis a Caleb. No me lo perdonaría jamás. Veréis, hace mucho, mucho tiempo…
sounds_ao.chosen.ophelia.ophint11.3=Antes de aspirar a dominar el mundo, no era más que una alegre muchachita de una hermandad universitaria.
sounds_ao.chosen.ophelia.ophint12.1=Sí, lo sé, Ish. Suena jodidamente improbable. Pero es verdad. Mi oscuro secretillo.
sounds_ao.chosen.ophelia.ophint12.2=Así conocí a la Cábala. Un día mandaron una horda de zombis para apoderarse del campus.
sounds_ao.chosen.ophelia.ophint12.3=Por lo visto, había allí un estudiante genial que había inventado un suero de reanimación, pero lo dudo.
sounds_ao.chosen.ophelia.ophint12.4=Como suelen hacer los zombis, se fueron directos al sitio con más mujeres indefensas y ligeras de ropa: la casa de mi hermandad.
sounds_ao.chosen.ophelia.ophint12.5=Ya estaba harta de aquella vida tan pizpireta. Así que, en vez de salvar a mis hermanas, decidí dejar de teñirme de rubia platino…
sounds_ao.chosen.ophelia.ophint12.6=Y juntarme con los de la Cábala. El problema era que no me admitirían ni de broma si sabían que yo estaba en una hermandad.
sounds_ao.chosen.ophelia.ophint12.7=Los zombis se encargarían de las chicas, pero los álbumes de fotos seguían en la casa. Tenía que entrar y destruirlos.
sounds_ao.chosen.ophelia.ophint31=Bueno, Gabby, te toca. ¿Cuál es tu historia?
sounds_ao.chosen.ophelia.ophint32=¿Y?
sounds_ao.chosen.ophelia.ophint33=¿Ningún gran secreto que revelar? ¿Ninguna trama cutre que destapar?
sounds_ao.chosen.ophelia.ophint34=Por lo que veo, ya la has contado.
sounds_ao.chosen.ophelia.ophint35=¡Ahora sí que la cosa se anima!
sounds_ao.chosen.ophelia.ophintro=Siempre se le ha dado fatal contar historias.
sounds_ao.enemies.gideon.gideoni1.1=Ah, sí, hola. Seguro que os acordáis de mí, ¿verdad? ¿Gideon, el vanidoso y loco por el poder?
sounds_ao.enemies.gideon.gideoni1.2=Hubo un tiempo en que aspiraba al trono de los dioses. Bueno, supongo que se cumplió mi deseo.
sounds_ao.enemies.gideon.gideoni1.3=Mi alma inmortal está atada a esta prisión craneal por toda la eternidad, por culpa de Caleb y sus Elegidos.
sounds_ao.enemies.gideon.gideoni1.4=En fin, no tiene sentido amargarse por eso.
sounds_ao.enemies.gideon.gideoni1.5=Imagino que algún día serviré de musa a algún dramaturgo desafortunado que pase por aquí.
sounds_ao.enemies.gideon.gideoni1.6=Hasta entonces, amable jugador, os entretendré con esta pequeña anécdota.
sounds_ao.enemies.gideon.gideoni2.1=Tras derrotar al Anciano, a los Elegidos les esperaba una larga caminata a casa por el Otro Mundo.
sounds_ao.enemies.gideon.gideoni2.2=Pudieron con los demonios que se les cruzaron, pero no estaban preparados para…
sounds_ao.enemies.gideon.gideoni2.3=El poderoso terror psíquico que acechaba en el páramo. La Pesadilla.
sounds_ao.enemies.gideon.gideoni2.4=Insensatos como eran, los Elegidos prácticamente invitaron a ese diablo a visitarlos cuando decidieron contar historias de miedo…
sounds_ao.enemies.gideon.gideoni2.5=Durante una de sus comidas. Poco imaginaban que cada uno estaba a punto de ser transportado…
sounds_ao.enemies.gideon.gideoni2.6=A su propio infierno. Observad y divertíos, querido jugador.
sounds_ao.enemies.gideon.gideoni3.1=Y así llega a su fin nuestra historia. Caleb vuelve a alzarse con la victoria. Parece que nada puede detenerlo.
sounds_ao.enemies.gideon.gideoni3.2=A veces es casi como si la mano invisible de algún ser de otro mundo guiara sus actos.
sounds_ao.enemies.gideon.gideoni3.3=Pero es mejor que no me detenga en esas cosas. Por ahora me conformaré con observar.
sounds_ao.enemies.gideon.gideoni3.4=A los Elegidos les quedan muchas aventuras por delante. Historias que contar, batallas que librar e imperios que forjar.
sounds_ao.enemies.gideon.gideoni3.5=Quizá algún día encuentre la manera de regresar.
sounds_ao.enemies.gideon.gideoni3.6=Y ese día, os lo aseguro, Caleb arderá.
sounds_ao.enemies.tchernobog.tcherno31=Ishmael. Escucha.
sounds_ao.enemies.tchernobog.tcherno32=Ya no eres JoJo. Ve. Mata a estos mortales y ven a mi lado. Tenemos mucho trabajo.

[intro]
line01=Somos la Cábala.
line02=Yo, Gideon, soy su líder siniestro y genial.
line03=Siempre hemos acechado entre vosotros.
line04=Como gusanos en el cadáver hinchado y apestoso de una rata enferma.
line05=Servidores del Que Une, el dios oscuro Tchernobog.
line06=Hasta hace un siglo, todo marchaba según nuestros planes maléficos.
line07=Jamás imaginamos que uno de los nuestros nos traicionaría.
line08=Se llamaba Caleb.
line09=Destruyó a nuestro dios y absorbió el poder de Tchernobog.
line10=Yo, y solo yo, traeré de vuelta a nuestro dios oscuro.
line11=Destruiré a Caleb.
line12=Aplastaré sus entrañas bajo mis pies como uvas podridas.
line13=Y Caleb morirá por última vez.

