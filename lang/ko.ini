3000=~이젠 지하철에서 얌전히 앉아 건즈 앤 깁스 최신호를 읽는 것조차 쉽지 않다. 처음엔 검표원이 감히 올드 레드 99년산이 든 휴대용 술병을 빼앗더니, 겁쟁이 기관사는 콧물 흘리는 꼬마가 유모차째 선로에 굴러들었다고 열차를 한 시간이나 세웠다! 올라가서 한 소리 할 참이었는데, 그 목소리를 알아듣고 말았다… 오늘 하루가 꽤… 재미있어지겠군.
3001=~아팠다. 지독하게 아팠다. 마지막으로 기절한 건 조조의 블랙 라벨 47번을 열아홉 잔 내리 마셨을 때다. 그때도 실은 네가 날려 버린 아이스크림 가판대에 너무 가까이 있었던 탓 같지만. 멍청한 장사꾼이 킬러 키디 콘에 스프링클을 뿌려 신경을 긁지만 않았어도. 뿌린다는 말이 나온 김에, 기디언을 찾아 가까운 벽에 후하게 뿌려 주는 게 좋겠다!
3002=~기디언을 놓쳤지만 놈은 여전히 도망 중이다. 머지않아 대가를 치르게 하고 눈앞을 깜깜하게 만들어 주지. 그동안 놈이 남겨 둔 썩은 친구들을 처리해야겠다. 이 역겨운 고깃덩이들은 예전에 카발이 찍어 내던 언데드와 비슷하다… 가슴의 이상한 봉합 자국만 빼면. 이 걸어 다니는 시체들은 뭔가 다르다. 뭐, 살점은 다 같은 살점이지.
3003=~재미있었어… 대체로. 아쉽게도 기디언은 비행선에 없었지만, 이제 어디 있는지는 확실하다. 대성당이다! 바깥 간판에 그렇게 적혀 있었다. ‘10월 30일, 기디언이 죄라는 의식적 범죄와 그 처벌을 피하는 법에 관한 논문을 발표합니다. 일찍 오시면 밸브의 믿기 힘들 만큼 고된 반감기에 관한 소규모 심포지엄도 들으실 수 있습니다!’ 팬을 실망시킬 놈이 아니니, 가서 네가 객석에 있다고 알려 줘라.
3004=~카발코 라파예트 고대 유물 박물관의 새 특별전, ‘교단과 의식’을 소개합니다. 저주받은 짖는 청개구리 교단부터 페즈를 쓴 무시무시한 슈라이너들까지, 세상에서 가장 기괴한 광신 조직의 역사를 안내와 함께 알아보세요. 하루 중 잠깐을 제물로 바쳐 새로 문을 연 기계 장치 어둠의 신 전시에도 들러 주세요. 소름이 돋습니다!
3005=~하수구라면 질색이다! 냄새는 제법 마음에 들지만, 떠다니는 것들 사이를 첨벙거리며 걷다 보면 질린다. 세계를 지배하게 되면 전역을 위생 금지 구역으로 선포해야겠다. 하수구를 개방하면 배관 수리비도 안 들고, 저것들은 알아서 바다로 흘러갈 테니까. 어쨌든 이 향기 속에서도 기디언의 악취는 맡을 수 있다. 겁쟁이 녀석은 카발 은신처로 향하고 있을 것이다.
3006=~인류는 바퀴벌레처럼 번식하고 온 행성이 인구 과잉으로 몸살을 앓고 있습니다. 질병이 저희의 두 번째 주력 사업이 된 이유죠! 카발코 질병 관리 센터가 시장을 사실상 독점하고 있음을 자랑스럽게 알려 드립니다. 최첨단 시설에 대규모 연구실, 해부실, 외상 센터를 갖췄습니다. 에볼라 바이러스든 익숙하고 맛깔나는 매독이든, 온갖 질환과 역병의 최전선에는 저희 센터가 있습니다. 사훈이요? 투자하고 전염시켜라. 나머지는 카발코가 합니다!
3007=~기디언은 건물 꼭대기에 정박한 임원용 비행선 중 하나로 향하고 있다. 모퉁이의 비피 퀸에서 새까맣게 구운 고기를 그만 퍼먹을 때다. 이 몸으로는 계단을 오르기 벅차니까. 재미있게도 기디언도 거기서 고기를 실컷 먹어 왔고, 그래서 자기 고층 건물마다 직행 승강기를 설치했다. 천 층이 넘는 계단을 오르지 않아도 된다니 고맙군. 저 지옥 같은 음악을 끌 방법만 알면 좋을 텐데!
3008=~카발코 산업의 1701D형 비행선은 더럽혀진 우리 하늘을 가른 가장 훌륭하고 다재다능한 기체 중 하나입니다. 다재다능함이 핵심입니다. 품격 있는 출장과 군사 작전을 동시에 수행할 수 있거든요. 왜 두 번이나 비행합니까? 가장 중요한 고객들을 우아하게 모시면서 저 성가신 제3세계 국가를 융단 폭격해 버리세요! 장갑 외피 아래에는 황금 같은 마음이 있습니다. 널찍한 좌석과 편안한 객실, 중무장한 승무원과 하늘에서 제일 맛있는 견과류까지! 카발코를 타세요. 품격 있게 비행하세요.
3009=~추락합니다! 충격에 대비하세요! 등받이와 접이식 탁자를 세워 잠가 주세요. 머리는 본인의 양다리 사이에 넣으세요. 흡연 중인 분은 본인에게 붙은 불을 꺼 주시기 바랍니다. 좋은 하루 되시고, 카발코 항공을 이용해 주셔서 감사합니다.
3010=~이 대성당에 수녀는 없다! 저 너머에서 온 괴물이 제 취향대로 이곳을 뒤틀어 놓았다. 합리적인 가격에 팔고 성가신 카발 문지기만 딸려 오지 않는다면, 너도 살 만하다고 생각할지 모르지. 뭐, 이제 이곳을 쓸어버리고 기디언이 어디로 갔는지 알아낼 차례다. 겸사겸사 총기 전용 방의 빈 벽에 걸 멋진 돌 탁본을 뜰 시간이 있을지도.
3011=~산업 구역에 진입합니다. 현재 오존 농도 3단계 및 독성 경보 4단계입니다. 항상 호흡기 보호 장비를 착용하세요. 카발코의 개선된 신제품 세이프 석스 2를 시험하기에 더없이 좋은 기회입니다! 언제 어디서나 쓰기 쉽고 저렴한 보호 장비죠. 실외 같은 고위험 구역을 피하세요. 안전한 방문과 즐거운 하루 되십시오.
3012=~예전의 열차에는 훨씬 운치가 있었다. 요즘은 타고서 죽지 않는 것만도 벅차다. 상대의 살아 있는… 어, 살아 있던 부분을 날려 버리는 것만큼 긴장이 풀리는 일은 드물다. 카발 은신처는 사치의 극치다. 악취, 집기, 쥐, 분위기, 술꾼까지. 약속 얘기가 나와서 말인데, 기디언이 여기 어디쯤 있을 것이다. 술꾼을 표적으로 사격 연습을 하는 것보다 재미난 만남이 되겠지. 야호!
3013=~뉴타운 시민들에게는 두 가지 심각한 문제가 있다. 너무 많이 먹고 너무 잘 배설한다는 것. 둘이 합쳐지면 치명적이다… 그들한테는. 냄새를 보니 배관을 말끔히 청소해야겠다. 바로 네가 할 일이다. 불멸의 반신이자 걸어 다니는 관장기인 네가 말이지. 발목까지 똥에 잠기는 신세가 된 건 분명 기디언 때문이다. 흠. 그놈의 계산서에 달아 두고 살점으로 받아 내자.
3014=~고기가 더 먹고 싶으십니까? 당연하죠. 다들 그렇습니다! 고기를 아는 카발코가 갖가지 육류 수요를 충족할 새 제품을 만들었습니다. 통조림 고기! 싸고 맛있습니다. 내장, 소, 닭, 돼지, 염소, 바닥에서 먹이를 찾는 물고기 등 좋아하시는 맛으로 골라 보세요. 신제품으로는 발효 반죽 고기, 발효 자두 고기, 아주 살짝 환각을 일으키는 버섯 고기도 있습니다! 카발코 육가공 공장은 미래의 식품을 만듭니다. 더 좋은 소식은 평균 82%가 넘는 제품에서 대장균이 검출되지 않는다는 겁니다!
3015=~행복하고 그걸 안다면 뇌를 터뜨려… 행복하고 그걸 안다면 정맥을 잘라… 행복하고 그걸 안다면 튀어 오르는 머리가 보여 주겠지… 자기 일을 사랑하는 것만 한 게 없다. 또 말하기도 싫은 역이군? 적어도 지난번보다는 보기 낫다. 방아쇠를 당길 손가락을 움직일 시간이다. 넌 이 선로의 험한 쪽에서 왔고, 늘 그렇듯 터널 끝의 빛은 열차일 수도 있다.
3016=~하! 기디언 그 개자식이 슬쩍 바꿔 타면 널 따돌릴 줄 알았나 보다. 어림없지, 잘난 양반! 붙잡으면 네 방식으로 바꿔 주마. 우선 고개를 돌려 좀 더 자기 속을 들여다보게 해 주는 게 어때? 그렇게 오랫동안 자기 엉덩이에 머리를 박고 살았으니 익숙한 광경일 거다. 자, 돌격이다. 훈훈한 생각은 이쯤 하고 일하자. 이번엔 파란 노선을 빨갛게 칠할 거다. 핏빛으로.
3017=~힘들게 번 돈을 월세로 날리는 게 지겨우십니까? 물론이죠! 카발코 주택 건설 및 부동산이 사랑스러운 새 주택 단지를 완공했습니다. 땅이 귀하고 비싸다는 걸 잘 알기에, 러브 운하의 옛 방사능·독성 오물 웅덩이를 새 흙으로 덮었습니다! 카발코 새집을 이렇게 싸게 구할 기회는 없었습니다. 가족 계획이 있으시면 큰 집을 사세요! 불임, 권태감, 끝없는 구토, 흔하다는 ‘머리 셋 달린 사랑의 결실’ 따위의 소문은 무시하세요. 카발코는 여러분을 생각합니다. 집값도 아주 공정하죠!
3018=~이곳 교통망의 안전 기록이 영 못 미덥다고? 방법은 하나다. 부숴 버려! 그래, 싹 허물어. 표를 내라고? 웃기지 마! 산탄총만 있으면 표 따윈 필요 없고, 그 표로 놈들을 쑥대밭으로 만들 거다. 일에 보람을 느끼면 좋지. 이번에는 잠깐 나가서 퀴퀴한 공기라도 마시는 게 현명하겠다. 지난 두 번은 너무 ‘아슬아슬’했으니까.
3019=~이제야 마음에 드는군. 집에 온 기분이다. 누워서 긴 잠을 청하고 싶어진다. 불멸은 소문만큼 좋지 않다. 생각보다 훨씬 손이 많이 가거든. 적어도 남들에게 네가 결코 얻지 못할 것을 줄 수 있다. 더 좋은 건 그들이 상상도 못 할 만큼 빨리 보내 줄 수 있다는 거지. 그게 너다. 언제나 친절하고 자비롭지. 자, 서둘러 보내 주자. 어디에 숨었든 나와라… 곧 너희는, 크흠, 선택받을 테니까.
3020=~카발코 산업의 거대한 본사가 자리한 뉴타운에 오신 것을 환영합니다! 폭동과 시민 봉기는 이제 거의 문제가 되지 않습니다. 아름답게 불타는 화이트 록 강을 내려다보는 뉴타운은, 도덕성 없는 거대 기업에 아주 조금 억압받는 도시의 이상적인 모습에 가깝습니다! 가끔 제물 의식이나 야간 납치가 있고, 두 번 다시 소식이 없는 실종자도 나옵니다만, 거리는 대체로 깨끗하고 안전합니다. 자잘한 문제만 빼면 경제도 성장 중입니다. 여기는 뉴타운! 카발코는 우리 친구입니다!
3021=~미래가 걱정되십니까? 고등학교 때 다른 학생들에게 괴롭힘을 당했습니까? 진짜 도전적인 직업을 찾고 있습니까? 카발코 보안부에 지원하세요. 좁고 어둡고 숨 쉬기 힘든 쇠 상자 안에서 홀딱 벗고 땀을 흘리며, 간신히 정신을 붙들고 굶주린 쥐 두어 다스와 하루를 지내 보지 않았다면 힘든 하루가 뭔지 모르는 겁니다! 제 얘기는 그만하죠. 모욕과 구타가 가득한 강도 높은 훈련을 마치면 새사람이 된 기분일 겁니다. 12단계 과정을 끝내면 커다란 총을 쥐여 드리고, 매일 남들의 생사를 좌우하게 해 드립니다! 같이 학교 다녔던 그 속 좁은 놈들한테 본때를 보여 주세요!
3022=~카발코 극비 대신전에 도착하셨습니다. 지금은 자리를 비웠으니 문 앞에 피를 기증해 주세요. 사람이나 염소의 피를 선호합니다. 급한 일이면 흰 양초 69개를 켜고, 손톱으로 콘크리트 바닥에 커다란 오망성을 긁어 그리세요. 찢겨 뭉툭해진 손가락의 피를 몸에 바르고, 그 안에서 알몸으로 춤추며 어둠의 신께 주문을 외우세요. 잠시 후 지하 세계의 음험한 종이 찾아뵙겠습니다. 기다려 주셔서 감사합니다!
3023=~험악한 검문소에 온 걸 환영한다. 하. 이곳의 보안은 좀 지나치게… 광신적이다. 카발코 본사로 가는 다른 입구가 있을 것이다. 그동안 청소나 하고 상대할 가치도 없는 적을 정리해라. 깨끗하게 하려면 먼저 어질러야 할 때도 있다. 벽에 튄 뇌 조각을 네가 닦을 필요는 없으니 다행이다. 마른 뒤에는 꽤 골치 아플 테지. 네 손으로 ‘무제한 출입증’을 만들 시간이다.
3024=~일자리를 찾으십니까? 카발코는 언제나 몸 하나가 더 필요합니다! 늘 채용하고 있으며, 특전도 푸짐합니다. 드넓은 새 고층 건물에서 일하고 층마다 커피와 탄산음료를 뽑을 수 있습니다. 저희 의료 복지는, 크흠, 저세상급이고요. 말단에서 시작해도 곧 부하를 두게 해 드립니다! 저희 인적, 어, 자원부는 다른 기업이 요구하는 번거로운 절차를 거치지 않습니다. 경력이 없으세요? 문제없습니다! 이력서도 지원서도 필요 없습니다. 찾아오시면 당신은 저희 것이 됩니다. 그러니까, 일자리가 생깁니다. 카발코는 기회를 불평등하게 제공합니다.
3025=카발코는 인정해 줘야 한다. 설계자가 이 건물에 아주 힘을 줬다. 웅장하게 뻗은 계단, 괴상하지만 멋진 예술품, 유난히 재미있는 칸막이 사무실, 산탄총으로 일일이 겨누기도 버거울 만큼 많은 폭파 대상까지. 대체로 근사하다. 불을 좀 질러 주면 더 좋겠군. 다만 교도, 드러지, 시카리, 광신도들은 사라져야 한다. 지옥으로 가라. 출발 칸을 지나지 마라. 200달러도 받지 마라. 껴안고 싶게 생긴 베히모스는 네 반려동물 무리에 더할 만하겠군. 아쉽게도 배변 훈련이 안 됐지만.
3026=~이 개자식들의 전기를 끊을 시간이다. 플러그를 뽑고 전력을 끊어라. 교류는 끝이다! 젠장, 직류도 끝이다! 발전소에 온 것을 환영한다… 넌 정전 그 자체다. 여기선 흥분도 지지직거린다. 바삭하게 튀겨질 만큼 말이지. 최근에 열차에서 겪은 일을 생각하면 전기든 열차든 ‘전도체’나 ‘차장’이 될 마음은 없다. 가장 잘하는 일을 할 때다. 부수는 것. 광신도부터 시작하면 좋겠군. 일해라, 위대한 차단기여.
3027=~케일럽은 정말 균열을 닫을까요? 오필리아는 2분짜리 선물을 받을까요? 가브리엘… 아니, 가브리엘라에게 무슨 일이 생긴 걸까요? 이슈마엘이 집에 못 돌아가면요? 그 문신은 또 어디서 했죠?|~다음 회 ‘불탄다, 불타’에서 확인하세요. 머지않아 이 모든 질문과 그 이상의 답을 들려 드리겠습니다. 약속합니다. 그동안 신나게 피의 난투를 즐기세요!
3028=~아, 과학! 처음 뭔가를 해부하던 때가 정겹게 떠오른다. 고약한 냄새가 나는 시체의 가죽을 벗기기 시작할 때는 흥분에 몸이 떨렸다. 전압을 아주 조금만 가해도 근육 조직이 춤을 췄지. 실수로 창자를 열었을 땐 얼마나 놀랐던가! 끝내주는 가스였어! 공상은 그만하고, 이제 카발코 연구 개발실 입구를 찾자.
3029=~아주 적대적인 기업 인수만큼 감각을 깨우는 일은 없다! 사냥꾼과 먹잇감의 게임에는 늘 매력이 있었다. 슬슬 재미있어진다. 기디언이 숨을 곳도 얼마 남지 않았다. 그 쥐새끼를 몰아붙일 때다. 청소할 일도 좀 있다. 사무실을 싹 비우는 게 이렇게 재미있을 줄이야! 그런데 옥상으로 가는 승강기가 어디 있었더라?
3030=~저기 사격 표적 기디언이 있군! 입에 착 붙네. 비둘기 기디언. 야호! 클레이 사격은 네가 가장 좋아하는 게임 중 하나다. 아주 신나겠군! 그놈이 터져 나갈 테니까. 발사! 탕. 발사! 탕. 더는 못 도망간다, 기디언. 네 비행은 끝났다, 멍청이. 운도 다했고.
3031=~죽을 때까지 싸운다. 가급적 다른 누군가가 죽기를. 이제 기디언의 꼭두각시 줄을 당길 수 없고, 꼭두각시를 조종하던 놈이 대가를 치를 차례다. 고대의 존재여, 듣고 있나? 그렇다면 이 말을 들어라…
3032=~뭔가 다르다. 방아쇠를 당기는 손가락으로도 딱 짚을 수 없다. 옛 친구들이 창백하다. 아픈 것 같기도 하다. 대체 뭐에 홀려 그 관 속에 들어갔을까? 흠. 납을 좀 더 먹이면 낫겠지… 머리에 납을 먹이고 잠자리에 보내자. 잘 자라, 동료 선택받은 자들아. 독이 든 꿈을 꿔라.
3033=~오래전에 잊혔고 말수도 적었던 어느 시인의 말처럼. ‘죽여라!’
4001=피의 향연을 시작하라!
4002=피의 향연을 계속하라!
4003=피의 향연을 지배할 자를 가려라!
4004=살육은 계속된다!
4005=피바람을 일으켜라!
4006=학살을 계속하라!
4007=피의 향연을 열어라!
4008=나의 아이들아, 피바람을 일으켜라!
4100=파괴했다
4101=벌집으로 만들었다
4102=망신을 주었다
4103=구워 버렸다
4104=지옥으로 보냈다
4105=칠리 좀 넘겨
4106=응징 완료
4107=보비트처럼 잘라 버렸다!
4108=뻣뻣한 시체가 됐다
4109=슛! 골!
4110=사방에 튀었다
4111=흩뿌렸다
4112=개밥이 됐다
4113=이제 안녕
4114=통째로 뜯어냈다
4115=커크처럼 두들겨 팼다
4116=크림처럼 휘저었다
4117=불을 꺼 버렸다
