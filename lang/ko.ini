6001=기디언이 네 출근길을 망쳐 놓고 겁쟁이처럼 달아나고 있다. 그냥 보고만 있을 건가? 박물관까지 쫓아가서 대가를 치르게 해라. 가는 길에는 그의 졸개를 조심해라.
6002=근처 골목을 통하면 박물관으로 지름길을 잡을 수 있다. 찾으려면 조금 둘러봐야 할지도 모른다.
6003=맞은편 발판의 쓰레기통에 쓸 만한 물건이 들어 있다. 건너뛰어 챙겨라! 달리면서 점프하면 더 멀리 뛸 수 있다.
6004=점프 실력이 빛을 발했다! 손전등을 찾았다. 인벤토리에서 골라 켜 봐라. 어두운 곳에서 유용하다.
6005=MAC-10으로 표적을 쏴 봐라. 보조 공격을 쓰면 더 정확하게 맞힐 수 있다. Blood II의 무기 대부분에는 보조 공격이 있다.
6006=전화기를 향해 사용 키를 눌러 전화를 받아라. Blood II에서는 여러 물건을 사용 키로 작동시킬 수 있다.
6007=찾던 골목이 저기 있는 것 같다! 올라가려면 정확하게 뛰어야겠다.
6008=이 통로를 지나면 바로 박물관인데 시에서 친절하게도 쓰레기통으로 길을 막아 놨다. 곡예 좀 해야겠군.
6009=기디언이 런드로 헛 세탁소로 도망쳤다. 빨랫감을 챙겨 내려가라!
6010=대성당으로 가는 길을 찾아라. 기디언의 하수인과 그보다 더 끔찍한 것들을 조심해라…
6011=기디언이 이 근처 어딘가에 있다. 카발이 이곳을 단단히 봉쇄했다. 위험한 보안 장치를 조심해라.
6012=기디언의 특이점 포는 묘한 부작용을 일으켰다. 널 없애는 대신 가브리엘을 되살렸다. 기디언은 다시 달아났다. 옛 친구와 회포를 풀 때가 아니다.
6013=근처에 카발코 시설로 들어가는 지하 입구가 있다는 소문이다. 기디언이 거기로 간다는 데 마지막 산탄 한 발도 걸 수 있겠군.
6014=총으로 길을 뚫고 누를 버튼을 찾아라!
6015=이제 컨베이어 벨트 위로 안전하게 기어갈 수 있다.
6016=다음 층으로 갈 방법을 찾아라.
6017=다른 길을 찾아야 할 것 같다!
6018=CRU 카드로 장치를 작동시킬 수 있다.
6019=근처에 옥상까지 직행하는 승강기가 있을 것이다.
6020=기디언의 경호원 한 명이 근처에 있다. 우두머리에게 총을 겨누려면 그놈부터 뚫고 가야 한다.
6021=비행은 영 체질에 맞지 않는다. 멀미가 나기 전에 앞쪽 구획으로 가라.
6022=이 새를 땅에 내려앉혀야 한다. 자폭 버튼은 함교에 있을 것이다.
6024=이곳은 퇴마 의식이 좀 필요하겠군! 기디언이 무슨 일을 꾸미는지도 알아낼 수 있을지 모른다.
6025=열차가 폭주 중이다. 조종권을 빼앗아라.
6026=폐쇄된 카발 은신처에서 기디언을 찾아라.
6027=이 구역은 완전히 점령당했다. 유일한 출구였던 지하철도 파괴됐다. 근처 골목의 지하실 입구로 탈출해라.
6028=함정에 걸렸다! 지금 이 순간에도 카발 광신도 몇 개 분대가 몰려올 것이다. 거리로 돌아가라.
6029=카발이 이곳에 매복해 있다. 살아서 통과해 봐라.
6030=이 육가공 공장을 도살장으로 만들어라!
6031=분쇄기를 가동하자 컨베이어 문이 열렸다. 벨트에 올라 분쇄기를 지나 앞으로 가라.
6032=다시 살육에 나서라!
6033=지하철 입구가 막혔다. 도심 급행 터널을 찾아라.
6034=이 구역을 탈출하려면 파란색 노선의 종착역을 찾아라.
6035=역 안으로 들어갈 길을 찾아라.
6036=파란색 지하철 노선 입구가 열렸다. 찾아서 빠져나가라!
6037=열차를 조심해라.
6038=지하철역으로 갈 다른 길을 찾아라.
6039=이 열차가 아니다. 바로 앞에서 달리는 열차로 옮겨 타라.
6040=사카라 지하 통로를 뚫고 나가라.
6041=수동 조작으로 다리가 내려왔다. 이제 다리까지 돌아가면 된다.
6042=다리를 내릴 방법을 찾아 건너라. 조심해라. 여기는 카발코 놈들이 득실거린다.
6043=카발 본사로 들어가는 길은 여기뿐인 것 같다. 가급적 큰 난장판 없이 보안문을 통과해라.
6045=앞문은 연구 개발실로 이어진다. 모두가 떠드는 특이점 발생기가 거기 있을지도 모른다. 보안 시스템을 끌 방법을 찾아라.
6046=기디언이 근처에 있을 것이다. 그놈에게 가장 안전한 곳은 아마 너와 가장 먼 곳이겠지. 피바다가 될 테니 양동이와 대걸레를 가져왔길 바란다.
6049=보안 시스템 제어 장치는 발전소 4구역에 있다. 찾으면 뭘 해야 할지 알겠지. 여기서 카발 병력을 마주쳐도 놀라지 마라.
6050=이제 직접 조사할 차례다. 괴짜 과학자를 찾아라. 특이점 발생기를 어디에 숨겼는지 말해 줄지도 모른다.
6051=건물 꼭대기가 가까워졌다. 기디언이 숨을 곳도 거의 없다. 책상 밑에 숨어 있을지도 모르지. 모조리 날려 보면 알겠지!
6052=기디언과 고대의 존재에게 통하는 차원문을 찾아라.
7000=적 팀의 깃발을 빼앗았습니다!
