authored.876b96893e6e534e.title=어서 빠져나가라!
authored.876b96893e6e534e.text=해냈다. 비행선은 끝장났다. 같이 떨어지기 전에 빠져나가라!
authored.1655b5465594c073.title=목표 1
authored.1655b5465594c073.text=오필리아가 기디언과 함께 균열 속으로 사라졌다. 근처에 있을 수도 있지만 알 수는 없다. 다음 제물이 되지 않도록 조심해라.
authored.fcfc192a55159c96.title=목표 1
authored.fcfc192a55159c96.text=이제 연구 개발실에 들어갈 수 있을 것이다. 가서 무슨 일이 벌어지는지 알아봐라.
authored.f509240c18010417.title=목표 1
authored.f509240c18010417.text=또 이곳이라니! 기디언이 근처 어딘가에 있을지도 모른다. 가장 좋은 탈출로는 승강기였을 것이다. 뭘 기다려? 가서 한 방 먹여 줘라.
authored.c9a269968f66b5ac.title=투기장
authored.c9a269968f66b5ac.text=고대의 존재에게 통하는|차원문을 찾아라.
authored.e395d02eb7f66023.title=목표 1
authored.e395d02eb7f66023.text=|고대의 존재를 쓰러뜨리고|우주의 질서를|되찾아라.
authored.1b23dee31a697548.title=달리며 쏴라
authored.1b23dee31a697548.text=총으로 길을 뚫고 누를 버튼을 찾아라!
authored.04dfc168e9f20485.title=몸을 낮추고 기어라
authored.04dfc168e9f20485.text=이제 컨베이어 벨트 위로 안전하게 기어갈 수 있다.
authored.e8938b9bf78b5c45.title=사냥하고 죽여라
authored.e8938b9bf78b5c45.text=다음 층으로 갈 방법을 찾아라.
authored.36e16d96eef3f3f2.title=쓸모없는 승강기
authored.36e16d96eef3f3f2.text=다른 길을 찾아야 할 것 같다!
authored.74ccd748f4e969fb.title=CRU를 가동해라!
authored.74ccd748f4e969fb.text=CRU 카드로 장치를 작동시킬 수 있다.
authored.b99fc6253496e264.title=거의 다 왔다…
authored.b99fc6253496e264.text=근처에 옥상까지 직행하는 승강기가 있을 것이다.

[promotions]
bloodbath_title=피의 학살
bloodbath_tagline=최대 열여섯 명이 펼치는 숨 가쁜 난투!
bloodbath_soon=곧 공개됩니다!!!
blood_brother_title=피의 형제
blood_brother_body=선택받은 자를 고르고 최대 네 명이 함께 협동 전투를 펼치세요!
blood_feud_title=피의 복수
blood_feud_body=최대 16명이 펼치는 폭발적인 아레나 전투! 팀을 선택하고 적을 쓰러뜨리세요.
info_title=볼거리 한가득
info_characters=마음대로 꾸밀 수 있는 네 캐릭터로 거침없는 학살을 즐기세요!
info_weapons=생사를 가르는 스무 가지 무기! 신호탄 권총과 부두 인형으로 적을 물리치거나 죽음의 광선과 특이점 발생기로 난장판을 만드세요!
info_levels=피 튀기는 싱글 플레이 레벨 30개 이상. 협동 모드도 곧 공개됩니다!
info_maps=피의 학살을 즐길 수 있는 박진감 넘치는 아레나 10개 이상. 피의 복수도 곧 공개됩니다!
info_network=GameSpy와 Heat를 완벽히 지원하는 멀티플레이를 마음껏 즐기세요.
info_editor=등록 사용자에게 레벨 편집기와 게임 소스 코드를 무료로 제공합니다. 마음껏 모드를 만들어 보세요!
info_engine=Blood 2 The Chosen은 동적 조명, 화려한 특수 효과, 폭넓은 3D 하드웨어 지원을 갖춘 모놀리스의 LithTech 3D 엔진으로 제작되었습니다!
modes_title=싱글 플레이 액션
modes_caleb=케일럽이 카발코의 적들을 하나씩 산산조각 냅니다. 다른 선택받은 자들은 컷신에서 그를 돕습니다.
modes_chosen_title=선택받은 자들
modes_chosen=마음에 드는 선택받은 자를 고르고 학살의 현장에 뛰어드세요! 컷신을 건너뛰고 곧장 전투를 시작하세요!

[dialogue]
4prophet1=난 남을 거야.
1acaleb1=덤벼!
1acaleb2=종점이다.
2caleb1=두 번째 실수를 저질렀군. 아직도 여기 있잖아.
2caleb2=날 살려 둔 거지.
3caleb1=…가브리엘?
3caleb2=그런 소린 관심 있는 사람한테나 해.
3caleb3=상황이 달라졌어. 너한테 굳이 말할 필요도 없겠지만.
3caleb4=넌 내 취향이 아니야.
4caleb1=선택은 네 몫이야. 지금 떠나면 살고, 남으면 죽는다.
4caleb2=그럼 죽어야겠군.
bmpr1caleb1=난 비행이 싫어.
5caleb1=일이 좀 꼬이겠는데.
6caleb1=이놈들은 카발이 아니야.
6caleb2=뭔가 다른 놈들이야.
6caleb3=기차 타러 가야 해. 또 보자.
8caleb1=농담이지?
7caleb1=넌 상상도 못 할걸.
7caleb2=물론이지. 이제 막 몸이 풀리는 참이야.
7caleb3=난 부정 그 자체야. 아무것도 마주할 생각 없어.
7caleb4=애 봐 주듯 챙겨 줄 필요 없어.
9caleb1=아, 그것보다 훨씬 더 해 줄 거야.
9caleb2=끝내주는군.
9caleb3=타 버리라지. 어차피 이곳은 한 번도 마음에 든 적 없어.
9caleb4=피자 왔습니다.
9caleb5=출장 스트립쇼 왔습니다.
11caleb1=네가 이렇게 묶여 있는 모습을 꿈꿔 왔지.
11caleb2=뽀뽀 한 번 해 줘, 자기야.
11caleb3=아, 또 너야? 한 2분 뒤에 다시 오는 게 어때?
11caleb4=오필리아! 좋아, 여기까지야. 이제 죽을 시간이군!
13caleb1=얼간아, 네 남은 목숨은 이제 초 단위로 세면 돼.
14caleb1=그럼 계속 네 엉덩이를 걷어차는 수밖에.
14caleb2=내가 똑똑하다고 한 적은 없잖아.
15caleb1=해 봐. 구경할 테니.
15caleb2=한바탕 춰 보자고, 부기맨.
16caleb1=지옥에 가면 내가 보냈다고 해. 할인해 줄 거야.
16caleb2=긴장 풀어. 넌 죽었어.
16caleb3=너무 늦었어. 넌 이미 죽었거든.
16caleb4=사는 것도 불공평하고 죽는 것도 마찬가지야. 익숙해지라고.
16caleb5=감사합니다. 안녕히 주무세요.
17caleb1=싫은데.
17caleb2=이러다 내 마음에 상처 나겠어.
17caleb3=그래서?
17caleb4=말은 그만. 한판 붙자.
19caleb1=이거 안녕하신가, 멋쟁이 양반. 악수는 생략해도 되겠지.
20caleb1=난 그런 건 하나도 몰라.
20caleb2=뭐 어쩔 건데, 엉덩이라도 때리게?
20caleb3=좋아, 그냥 입 다물어. 집중해야 해.
20caleb4=영혼에 관장하는 기분이랄까. 좋은 뜻으로.
3gab1=이게 대체 뭐야?
3gab2=케일럽?
3gab3=가브리엘라. 사연이 길어.
3gab4=오랜 친구를 그렇게 맞이하는 거야?
3gab5=나도 같이 가야겠어. 무슨 일이 벌어지는지 알아봐야지.
3gab6=요즘 거울은 봤어? 너도 별로 매력적이지 않거든.
6gab1=이것들이 사방에 깔렸어. 카발도 이런 괴물을 만들어 낼 만큼 절박한가 보네.
6gab2=그럼 이것들은 뭔데?
6gab4=뭐 하는 거야?
6gab5=걱정 마, 꼬맹아. 또 만나게 될 거야.
14gab1=그를 따라가야 해. 뭐가 기다리고 있을지 누가 알아?
17gab1=벌레야, 우리는 고대의 존재다. 우리 앞에 무릎 꿇어라.
17gab2=우리의 지배를 가로막는 게 너 하나뿐이라고? 가소롭군.
17gab3=있는 모든 것은 사라지리라. 있었던 모든 것은 존재한 적 없으리라. 있으려던 모든 것은… 음…
17gab4=있으려던 모든 일은 결코… 일어나지 않으리라.
20gab1=둘 다 입 안 다물면 죽여 버릴 거야.
1agid1=오늘의 특별 차장, 기디언입니다! 꽉 잡으세요. 이번 여행은 조금… 피비린내 날 수 있습니다!
1agid2=네가 여기 있는 거 알아, 케일럽. 네 비장을 뜯어내 모자로 쓰고 싶어서 견딜 수가 없군.
2gid1=기차하고는 영 운이 안 맞는 모양이지?
2gid2=그래? 그럼 첫 번째 실수는 뭐였는데?
3gid1=죽을 때가 됐다, 선택받은 자여.
7gid1=이번에는 꼭 성공해야 할 텐데.
7gid2=이슈마엘?
7gid3=이번에는 운이 좋았군, 배신자. 몇 시간만 지나면 모든 게 제자리로 돌아가고 너도 영영 사라질 거다. 지금은 이만 가 봐야겠어. 걱정 마, 내 부하들이 놀아 줄 테니. 사이좋게 놀아라.
10gid1=집에 온 것 같은 소리군.
10gid2=내 앞에서 당장 꺼져!
11gid1=여기로 올 줄 알았지.
11gid2=감동적인 재회를 방해해서 미안하군, 배신자. 계속 의욕을 내게 해 줘야 하거든.
14gid1=아직 끝나지 않았어! 넌 절대 날 완전히 이기지 못해!
15gid1=아, 케일럽. 기다리고 있었다, 뻔한 멍청이야. 금방 끝나. 지금… 변하는 중이거든…
15gid2=…좀… 불쾌한 것으로.
15gid3=새 모습이 어떤가? 고통이 얼마나 황홀한지 넌 모를 거야. 내가 시범을 보여 주지.
15gid4=네 몸에 말이야!
16gid1=안 돼! 이건 불공평해! 죽여 버리겠어!
7ish1=뜻밖의 전개군.
7ish2=오늘 일이 잘 안 풀리나?
7ish3=네가 얼마나 큰 피해를 일으키고 있는지 아나?
7ish4=그 말이 아니야. 넌 잇는 자다. 조만간 그 사실을 마주해야 해.
7ish5=그럼 이것만은 알아 둬. 우리는 선택받은 자들이다. 네가 원하든 말든 널 위해 온 거야.
7ish6=그래, 오필리아도. 그 애가 제일 먼저 건너왔지.
7ish7=세상을 다 준대도 이 일을 놓치진 않았을 거야. 하긴, 네가 그 세상을 부숴 버릴지도 모르지만.
9ish1=오필리아를 생각하고 있군. 감동적인데.
9ish2=기디언의 사원에 영구적인 균열이 있다. 지금 일어나는 모든 피해가 그곳에 집중돼. 말하자면 진원지지. 거기서 오필리아를 찾을 수 있을 거야.
9ish3=체르노보그가 소멸하면서 세계 사이의 문이 여럿 열렸어. 잇는 자만이 그 문을 봉인할 수 있지. 그 힘은 네 안에 있어. 네가 복구하지 않으면 이 현실은 사라질 거야.
9ish4=태고부터 존재한 굶주린 또 다른 현실이 균열을 뚫고 들어오고 있어. 선도 악도 아니야. 그저 존재할 뿐이지. 하지만 우릴 모두 삼켜 버릴 거야.
14ish1=설마 그를 쫓아가려는 건 아니겠지?
14ish2=아주 불쾌한 게 기다리고 있을 거라 짐작해.
17ish1=벌레야, 우리는 고대의 존재다. 우리 앞에 무릎 꿇어라.
17ish2=우리의 지배를 가로막는 게 너 하나뿐이라고? 가소롭군.
17ish3=있는 모든 것은 사라지리라. 있었던 모든 것은 존재한 적 없으리라. 있으려던 모든 것은… 음…
17ish4=있으려던 모든 일은 결코… 일어나지 않으리라.
20ish1=아직 끝나지 않았어, 케일럽. 균열을 봉인해야 한다. 이 현실이 산산조각 나기 전에 그 구조를 다시 이어 붙여야 해.
20ish2=그 힘은 네 안에 있다. 이제 쓸 때가 됐어.
3madsci1=뜻밖이군요. 흠, 특이점 설정을 다시 보정해야겠어요.
7madsci1=절 믿으세요. 이번 계산은 완벽합니다.
10madsci1=각하, 다시 생각해 보시길 권합니다. 계산 결과가 아직 확실치 않습니다. 말씀하신 대로 균열이 무한한 힘의 원천일 수도 있지만, 시공간의 구조에 도사린 치명적인 함정일 수도 있습니다. 순수한 혼돈과 악의 영역으로 끌려가 흔적도 없이 소멸할지도 모릅니다.
10madsci2=하지만 각하!
10madsci3=안 돼! …한 번도 말씀드리지 못했는데… 제가 얼마나 사랑하는지…
12madsci1=안녕, 안녕, 안녕하세요. 연구 개발 부서에 오신 걸 환영합니다. 제가 즐겨 부르는 이름으론… R&D죠. 저를… 박사라고 부르세요. 최근 우주의 바탕이 요동치는 통에 꽤 흥미로운 실험체를 만났습니다만, 특히 기대되는 건 당신의… 해부입니다. 주 실험실로 오세요. 실험을 시작하죠…
11oph1=백마 탄 왕자님이신가 봐?
11oph2=날 풀어 주면 바닐라 파이 한 판을 통째로 줄게.
14oph1=따라오라는 거잖아, 이 멍청한 자식아.
14oph2=뭘 기다리는 거야?
17oph1=벌레야, 우리는 고대의 존재다. 우리 앞에 무릎 꿇어라.
17oph2=우리의 지배를 가로막는 게 너 하나뿐이라고? 가소롭군.
17oph3=있는 모든 것은 사라지리라. 있었던 모든 것은 존재한 적 없으리라. 있으려던 모든 것은… 음…
17oph4=있으려던 모든 일은 결코… 일어나지 않으리라.
20oph1=선택의 여지가 없어. 이슈마엘 말 좀 들어, 이 바보야.
20oph2=네가 내 엉덩이를 때리면 나도 때려 줄게.
sounds.chosen.caleb.e1m1_1_cal=난 그저 나쁜 꿈이 아니야. 놈들한테는 최악의 악몽이지.
sounds.chosen.caleb.e1m3_2_cal=요즘 것들은 옛날만 못하다니까.
sounds.chosen.caleb.e1m4_1_cal=죽여야 할 놈들이 있는 모양이군.
sounds.chosen.caleb.e1m4e5a_cal=내가 알 게 뭐야. 넌 왜 신경 쓰는데? 너한텐 별문제 없어 보이더만.
sounds.chosen.caleb.e1m4e7a_cal=그게 무슨 뜻이야?
sounds.chosen.caleb.e1m4e9a_cal=내가 해결하겠어!
sounds.chosen.caleb.e1m5_1_cal=이봐, 이 정도면 나한테 뒷돈이라도 줘야지.
sounds.chosen.caleb.e2m5_1_cal=얘들아, ‘하우디 두디 쇼’ 시간이다. 나쁜 아저씨가 왔어.
sounds.chosen.caleb.e2m5_2_cal=흠, 저것도 사람 배를 가르는 방법이긴 하지. 내 방법만큼 빠르거나 재미있진 않지만.
sounds.chosen.caleb.e2m5_4_cal=으, 고깃덩이가 된 기분이군.
sounds.chosen.caleb.e3m1_2_cal=이제야 화끈하게 돌아가는군!
sounds.chosen.caleb.e3m1_3_cal=아, 쉽게 풀리는 일이 하나도 없어.
sounds.chosen.caleb.e3m2_1_cal=아까운 탄약만 낭비했군!
sounds.chosen.caleb.e3m2_2_cal=흠, 보안 검문소군. 젠장, 이거 막혔나 봐. 되돌아가는 수밖에.
sounds.chosen.caleb.e3m2_3_cal=이야, 이렇게 넓고 쾌적하다니. 여기에 취직이나 해 볼까?
sounds.chosen.caleb.e3m3_1_cal=좋은 아침입니다. 또 못 뵐 수도 있으니 좋은 오후, 좋은 저녁 보내시고 안녕히 주무세요!
sounds.chosen.caleb.e3m3_2_cal=저놈이야. 내가 찾는 놈이 저기 있어.
sounds.chosen.caleb.e3m3_3_cal=난 정비공이 아니야. 주로 사람을 다치게 하지. 내려갑니다.
sounds.chosen.caleb.e3m5_1_cal=이봐, 여기 좀 비현실적인 것 같지 않아?
sounds.chosen.caleb.e3m5_3_cal=이 다리, 건너도 완전히 안전해 보이는군.
sounds.chosen.caleb.e3m5_4_cal=카발식 건축의 훌륭한 표본이군.
sounds.chosen.caleb.kill.c_1liner_2=누구나 죽는다.
sounds.chosen.caleb.msc11cal=미안하다고 할까 했는데, 진심이 아니란 건 너도 알잖아. 좋은 하루 보내.
sounds.chosen.caleb.msc14_cal=음, 갓 포장한 고기만 한 게 없지.
sounds.chosen.caleb.msc15_cal=육류 검사관입니다. 아무래도 영업을 중단시키겠군요.
sounds.chosen.caleb.msc18_cal=다시 일상으로 돌아가는군…
sounds.chosen.caleb.msccaleb1=잠겼군.
sounds.chosen.caleb.taunt.tnt5_cal=그래, 내가 못생긴 줄 알았는데 말이지.
sounds.chosen.gabriella.e1m4e3_gab=누군가는 기차를 지켜야 해. 밖에는 이것들이 사방에 깔렸어. 카발도 이런 괴물을 만들어 낼 만큼 절박한가 보네.
sounds.chosen.gabriella.e1m4e6_gab=난 문제 없어. 생기면 해결하니까.
sounds.chosen.gabriella.e1m4e8_gab=이제 널 믿어도 될지 모르겠어. 상황이 점점 나빠지고 있어. 네가 해결 못 하면 내가 할 거야.
sounds.enemies.civilian.02civ1=어이, 친구, 괜찮아? 몰골이 말이 아닌데.
sounds.enemies.civilian.02civ3=이봐, 기차가 끊긴 것 같아. 택시라도 잡는 게 어때?
sounds.enemies.civilian.02civ4=강아지야, 온종일 짖기만 할 거냐, 아니면 물 거냐?
sounds.enemies.civilian.02civ5=친구, 여긴 무기 반입 금지야! 내게 주려고 산 거라면 몰라도.
sounds.enemies.civilian.11civ2=햄버거만 빼고 아무거나.
sounds.enemies.civilian.11civ4=그래, 너 줄 핫도그가 여기 있지.
sounds.enemies.civilian.12civ2=아, 젠장!
sounds.enemies.civilian.12civ3=집에 아무도 없어! 저리 가!
sounds.enemies.civilian.12civ4=날 좀 내버려 둬!
sounds.enemies.civilian.12civ5=아무것도 안 사요!
sounds.enemies.civilian.spot11=아, 씨발. 오늘 되는 일이 없네.
sounds.enemies.civilian.spot2=여긴 완전히 정신병원이야!
sounds.enemies.f_civ.02civ2=이럴 리가 없어. 출근에 늦겠어!
sounds.enemies.f_civ.02civ8=몰라. 내가 그 사람 머리를 너무 깊이 집어넣었나 봐.
sounds.enemies.f_civ.09civ=누구세요?
sounds.enemies.f_civ.09civ3=정말? 좋아. 문 열어 줄게.
sounds.enemies.f_civ.11civ1=아, 연골을 이렇게 보고 있자니 배고파진다. 점심 뭐 먹을래?
sounds.enemies.f_civ.11civ3=핫도그 어때?
sounds.enemies.f_civ.spot3=여긴 완전히 엉망이야! 이게 뭐야?
sounds.enemies.gideon.15gid2b=고통이 얼마나 황홀한지 넌 모를 거야. 내가 시범을 보여 주지.
sounds.enemies.gideon.tnt4_gid=오늘, 위대한 배신자의 몰락을 내 눈으로 보겠노라!
sounds.enemies.gideon.tnt7_gid=넌 정화될 것이다. 카발은 다시 살아나리라!
sounds.enemies.loudspeaker.2loudspker=라파예트 고대 유물 박물관이 문을 닫았습니다. 정규 운영 시간은 매일 오후 3시부터 5시이며, 입장료는 17달러입니다. 자녀에게는 항상 목줄을 채워 주십시오. 감사합니다.
sounds.enemies.prophet.spot3=안녕.
sounds.events.cwvoice11=처리 장치를 정지했습니다.
sounds.events.cwvoice6=접근이 거부되었습니다.
sounds.events.cwvoice8=역장이 해제되었습니다.
sounds.events.cwvoice9=냉동 보관물 회수 장치를 작동합니다.
sounds.events.davoice1=라파예트 고대 유물 박물관에 오신 것을 환영합니다. 관람 중에 새로 복원한 이집트 전시도 꼭 둘러보세요. 오늘의 특별전은 교단과 의식입니다. 북쪽 전시관에 있는 신화 속 교단 신의 절반 크기 복제품도 놓치지 마세요.
sounds.events.davoice2=잉카인들은 남아메리카 하늘을 찌르는 높은 봉우리들을 숭배했습니다. 험준한 산꼭대기는 그들 신앙의 중심인 태양신에게 다가가는 길이었고, 춥고 예측할 수 없는 봉우리 위에서 수많은 제물을 바쳤습니다.
sounds.events.davoice3=이 고대 미라들은 사카라의 지하 무덤에서 발굴되었습니다. 사카라는 고대 이집트 문명이 시작될 때부터 3천여 년 뒤 쇠퇴할 때까지 인근 멤피스 상류층의 묘지였습니다. 초기 왕조 시대와 고왕국 시대에는 여러 이집트 왕도 사카라를 매장지로 택했습니다.
sounds.events.vent2=화상이 아주, 아주 심하지만 아직 완전히 죽진 않았어.
sounds.phones.phone11=누구야? 여기로 전화 좀 그만해!
sounds.phones.phone12=내가 젊었을 땐 특이점 발생기 같은 건 없었어. 맨손으로 드러지 사제를 죽여야 했다니까! 그래도 좋았지! 손을 뻗어 놈의 본 리치를 잡고 확 뜯어내는 거야!
sounds.phones.phone13=내가 젊었을 땐 생명 거머리 같은 게 없었어! 맨손으로 소울 드러지를 죽여야 했다니까! 다리를 물어뜯어도 놈들은 계속 돌아왔지! 그래도 상관없었어! 그게 좋았다고!
sounds.phones.phone2=어, 좋은 아침, 오후, 저녁입니다, 케일 럽 씨. 시장 조사 회사에서 컴퓨터 게임에 관한 설문을 하고 있습니다. 무언가를 팔려는 전화는 아닙니다. 첫 질문입니다. 현재 컴퓨터 게임 캐릭터이시거나, 과거에 그런 적이 있으십니까?
sounds.phones.phone4=지금 거신 번호는 쓰이지 않는 번호입니다. 바보처럼 끊지 말고 기다리세요. 아무도 받지 않을 겁니다. 이 안내는 녹음입니다.
sounds.phones.phone6=왜 안아키스 씨가 안 보이지? 안아키스 씨 좀 찾아 주겠어요?
sounds.phones.phone8=누가 남자 화장실에 엉덩이 큰 양반 있는지 좀 봐 줘요!
sounds.chosen.caleb.e1m1_3_cal=자, 총 든 미친놈들은 다 어디로 갔지?
sounds.chosen.caleb.e1m1_4_cal=깜짝 놀랄 준비 해라. 케일럽이 왔다!
sounds.chosen.caleb.e1m1_8_cal=쫓아낼 시간이다!
sounds.chosen.caleb.e1m3_3_cal=음, BLT 하나 줘. 양상추, 토마토, 피가 들어간 샌드위치. 마요네즈는 빼고.
sounds.chosen.caleb.e1m3_4_cal=아, 이 미트볼 한번 매콤하네.
sounds.chosen.caleb.e1m4_2_cal=아, 이곳은 지옥 구덩이군. 헤헤, 마음에 들어.
sounds.chosen.caleb.e1m5_3_cal=음, 나아지기 전에 훨씬 더 나빠지겠군.
sounds.chosen.caleb.e1m5_5_cal=으, 적어도 여기 늙은 시체가 나 하나뿐인 건 아니군.
sounds.chosen.caleb.msc16_cal=아, 이 난장판이라니. 위생 상태가 말이 아니군.
sounds.chosen.caleb.msc17_cal=음, 포도 맛을 제일 좋아하지. 맛있군!
sounds.chosen.caleb.msccaleb2=꼼짝도 안 하는군.
sounds.enemies.civilian.idle2=이럴 리가 없어. 이럴 리가 없어. 이럴 리가 없어. 이럴 리가 없어.
sounds.events.cwvoice10=긴급 자폭 절차를 시작합니다. 60초 후 자폭합니다.
sounds.events.cwvoice5=접근이 허가되었습니다.
sounds.events.psvoice1=반데르보르트 박사님, 해부실로 와 주십시오. 지혈이 필요한 환자가 있습니다.
sounds.events.psvoice10j=명심하십시오. 안전보다 발전이 먼저입니다.
sounds.events.psvoice11j=알려 드립니다. 3층에 침입자가 있습니다. 무장한 상태로 매우 위험하니 어떤 경우에도 접근하지 마십시오. 되도록이면 반대 방향으로 최대한 빨리 달아나십시오. 감사합니다. 좋은 하루 되십시오.
sounds.events.psvoice2l=쾰러 박사님, 안내 데스크로 와 주십시오. 쾰러 박사님, 안내 데스크로 와 주십시오. 남자 친구가 기다리고 있습니다.
sounds.events.psvoice3=캐텔 박사님, 제7 검사실에 응급 상황입니다.
sounds.events.psvoice7l=콜먼 박사님, 신경과로 와 주십시오. 콜먼 박사님, 신경과로 와 주십시오.
sounds.events.psvoice8l=10층, 11층, 12층 직원 여러분은 제염 구역으로 모여 주십시오.
sounds.events.tavoice1=카발코 도시간 교통망에 오신 것을 환영합니다. 대중교통을 이용하실 때 선택지가 여럿 있다는 것을 알고 있습니다. 카발코를 선택해 주셔서 대단히 기쁩니다.
sounds.events.tavoice2a=카발코 도시간 교통망이 새단장 중입니다. 강도는 13%, 무차별 폭행은 6%, 살인은 3% 줄었으며 교통망 전체 장애는 무려 7% 줄었습니다. 안타깝게도 동물 훼손은 놀랍게도 96% 증가했습니다.
sounds.events.tavoice3=날카로운 물건으로 다른 승객을 꿰뚫는 행위는 엄격히 금지됩니다. 감사합니다.
sounds.events.tavoice4=카발코 교통망 전 구역은 금연입니다. 감사합니다.
sounds.events.tavoice5=곧 도심 급행선에 도착합니다.
sounds.events.tavoice6=다음 역은 픽먼가입니다.
sounds.events.tavoice7=산업 구역에 진입합니다.
sounds.events.tavoice8=다음 역은 잉그램가입니다.
sounds.events.tavoice9=팔과 다리는 항상 열차 안에 두십시오. 절단된 팔다리를 빨리 버리셔야 한다면 각 출구 근처의 무균 사지 수거함을 이용해 주십시오. 카발코 교통망의 청결과 안전에 협조해 주셔서 감사합니다.
