6005=用这把 Mac-10 打靶试试。副射击模式能打得更准。《Blood 2》的大多数武器都有副射击模式。
6006=对着电话按使用键接听。《Blood 2》里的很多物件都可以用这个键启动。
6007=看来这就是你要找的小巷！想上去，恐怕得好好跳几下。
6008=穿过这条通道就是博物馆，不过市政的人还真贴心，用垃圾箱把路给堵了。得露两手才过得去。
6009=吉迪恩从洗衣店溜了。带上衣服，赶紧追！
6010=找到通往大教堂的路。提防吉迪恩的手下，还有比他们更可怕的东西……
6011=吉迪恩就在附近。秘会把这里封得严严实实。小心危险的安保设施。
6012=吉迪恩的奇点枪引发了有趣的副作用：你没被消灭，盖布里埃尔反倒回来了。但吉迪恩又逃了，没空和老朋友叙旧。
6013=听说附近有条地下通道能进入秘会公司的设施。你敢拿最后一发霰弹打赌，吉迪恩准是往那儿去了。
6014=杀出一条路，找找有什么按钮可以按！
6015=现在可以安全地从传送带爬过去了。
6016=你得找到通往上一层的路。
6017=看来该另找一条路了！
6018=用 CRU 门卡就能启动 CRU。
6019=附近应该有一部直达屋顶的电梯。
6020=吉迪恩的一名贴身保镖就在附近。想对付那个大头目，先过他这一关。
6021=你向来不喜欢坐飞机。趁还没晕机，赶紧到前舱去。
6022=该让这只大鸟落地了。自毁按钮应该在驾驶舱。
6024=没错，这地方真该好好驱驱邪！说不定还能弄清吉迪恩在打什么主意。
6025=列车失控了，去夺回控制权。
6026=到秘会那栋被判定为危楼的藏身处找吉迪恩。
6027=这片城区已经沦陷，唯一的出口原本是地铁，现在也被毁了。从附近小巷的地下室入口逃出去。
6028=你中了圈套！现在肯定有好几队秘会狂徒正朝你冲来。快回到街上。
6029=秘会在这里设了伏。想办法活着闯过去。
6030=把这家肉类加工厂变成屠宰场！
6031=启动绞肉机后，传送带的门打开了。跳上传送带，穿过绞肉机继续前进。
6032=回去继续杀个痛快！
6033=地铁入口被堵住了。去找市中心快线的隧道。
6034=找到地铁蓝线的终点站，离开这片城区。
6035=找到进入车站的办法。
6036=地铁蓝线的入口打开了。找到入口，赶快撤离！
6037=小心列车。
6038=另找一条通往地铁站的路。
6039=这不是你要搭的车。到前面那辆列车上去。
6040=设法穿过萨卡拉的地下通道。
6041=用手动装置放下了桥。现在去找回桥上的路。
6042=想办法放下桥，然后过桥。小心，这里到处都是秘会公司的走狗。
6043=看来这是进入秘会总部的唯一办法。尽量别闹出太大的动静，设法穿过安检门。
6045=前面的门通向研发部。大家都在说的奇点发生器可能就在那里。想办法关闭安保系统。
6046=吉迪恩一定在附近。他肯定觉得离你越远越安全。接下来要见血了，但愿你带了水桶和拖把。
6049=安保控制装置在发电站的 4 区。找到后该怎么做，你心里有数。这里碰上秘会的部队也别意外。
6050=该自己做点研究了。找到那个古怪的科学家，也许他会告诉你奇点发生器藏在哪儿。
6051=快到楼顶了，吉迪恩已经没几个地方可躲了。说不定正缩在办公桌下面。把这里炸个遍就知道了！
6052=找到吉迪恩，以及通往古神的传送门。
