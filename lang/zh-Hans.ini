3000=~如今坐趟地铁，连安安静静看一期新的《Guns N’ Gibs》都不行。先是那查票的竟敢没收你那壶 Ol’ Red ’99，接着那个没骨气的司机，居然只因为一个小鬼的婴儿车滑到轨道上，就把车停了整整一小时！你正要上去好好数落他一顿，忽然听出了他的声音……这才明白，今天就要变得……有意思了。
3001=~疼。疼得要命。上次你昏过去，还是一口气灌了十九杯 JoJo’s Black Label #47。可就算那回，你也觉得更可能是因为你炸掉冰激凌摊时离得太近。算了。那个蠢货就不该往你的 Killer Kiddy Kone 上撒糖粒惹你生气。说到撒糖粒，你最好找到吉迪恩，把他慷慨地撒在最近的墙上！
3002=~吉迪恩跑了，可还在逃。你很快就会收拾他，让他永远闭眼。他倒是留了几个腐烂的朋友给你料理。这些带着瘟气的肉块确实像卡巴尔过去批量造出来的亡灵……除了胸口那几道怪缝线。这批会走路的尸体有点不一样。管它呢，炸成碎肉都一样。
3003=~唔，刚才挺有趣的……大体上。可惜吉迪恩没在船上，但你现在大致知道他去了哪儿——大教堂！至少外头的牌子是这么说的：「10 月 30 日，吉迪恩发表论文《罪恶这一仪式性犯罪及其脱罪之道》。早到的听众还可参加他的简短研讨会，探讨一只阀门那长得要命的半衰期！」他不是会让粉丝失望的人。去那儿让他知道你就在台下。
3004=~卡巴尔科拉斐特古物博物馆隆重推出新展览《邪教与仪式》。欢迎参加精彩又长知识的导览，了解世上几种最古怪的狂热组织，从受诅咒的吠叫树蛙教派，到戴毡帽的可怕 Shriners。也请牺牲片刻，光临全新推出的机械黑暗之神展览。好吓人啊！
3005=~天啊，你可真讨厌下水道！味道其实不赖，可老在漂浮的脏东西里跋涉，迟早会腻。等你终于统治世界，就宣布这里不再搞公共卫生。下水道敞开用的好处，就是不用拨款修水管。那些玩意儿自己会流进大海。反正这儿再香，你也闻得到吉迪恩那股恶臭。那个胆小鬼多半正往卡巴尔的藏身处跑。
3006=~人类像蟑螂一样繁殖，整个星球都饱受人口过剩之苦，疾病如今已是我们第二大的生意！我们自豪地宣布，卡巴尔科疾病管理中心已经近乎垄断这一行！这座先进设施设有大型研究、解剖和创伤中心。无论是疾病、瘟疫还是其他苦难，本中心始终走在最前沿。无论您爱好埃博拉病毒，还是普普通通、美味可口的梅毒，我们的口号都是：投资，传播。剩下的交给卡巴尔科！
3007=~吉迪恩正赶往停在楼顶的一艘高管飞艇。显然，你该少去街角的 Beefy Queen 猛吃烤焦的肉了。照你这体力，哪爬得动楼梯。巧的是，吉迪恩也没少在 BQ 吃肉，于是不得不给每栋摩天楼都装上直达电梯。不用走上一千多层楼，确实够体贴。要是能把那该死的音乐关掉就好了！
3008=~卡巴尔科工业的 1701D 型飞艇，是飞过我们这片肮脏天空的最精良、也最全能的飞行器之一。关键就在「全能」二字。我们的飞艇既能让贵宾享受豪华商务出行，又能同时执行军事任务。何必飞两趟？一边对那个讨厌的第三世界小国实施地毯式轰炸，一边让最重要的客户飞得体面！装甲之下，卡巴尔科飞艇真有一颗金子般的心。宽敞的座椅、舒适的客舱、全副武装的空姐，还有空中最好吃的坚果！飞就选卡巴尔科，飞得有派头。
3009=~我们要坠毁了！请做好撞击准备！请将座椅靠背和小桌板恢复直立位置并锁好。请把脑袋夹在自己的两腿之间。正在吸烟的乘客，请把自己熄灭。祝您今天愉快，感谢选择卡巴尔科航空。
3010=~这座大教堂里可没有修女！藏在这里的异界怪物已经把这地方扭成了自己喜欢的样子。要是它肯按合理价格出售，又不附送那些烦人的卡巴尔门卫，你自己说不定都乐意住在这儿。算了。该把这里清理干净，弄清吉迪恩去了哪里。顺便也许还有空拓一幅漂亮的石刻，挂在你那间步入式武器柜的空墙上。
3011=~您正在进入工业区。请注意，当前臭氧浓度为三级，毒素警报为四级。请全程佩戴呼吸防护装备。这正是试用卡巴尔科全新升级版 Safe Sucks 2 的好机会！经济实惠，使用方便，适合各种场合。请避开户外之类的高危区域。祝您安全参观、愉快度过今天。
3012=~火车从前可气派多了。现在坐一趟，不在车上丧命就算不错。能比把对手炸成，呃……碎块更解压的事，实在不多。这些卡巴尔藏身处可谓奢华到了极点……那臭味、陈设、老鼠、气氛，还有酒鬼。说到约会，吉迪恩应该就在这附近。这次会面应该比拿酒鬼当靶子更有趣。哇哈哈哈！
3013=~显然，新城居民有两个大毛病……吃得多，拉得更痛快。两样合在一起可是要命的……要他们的命。闻起来，他们的管道该好好清一清了。轮到你出场了，不死的半神、活体灌肠器。让你落到这步田地，显然是吉迪恩的错。所谓落到田地，其实是脚踝泡在粪水里。嗯，这也可以记在他账上，再一块一块地讨回来。
3014=~还想多吃点肉？当然想。我们都想！卡巴尔科懂肉，专门开发了全新系列，满足您各种各样的吃肉需求！罐头肉！价廉味美！有您最爱的经典口味：下水、牛肉、禽肉、猪肉、山羊肉，还有吃水底残渣的鱼！或者试试我们的新品！新添了酵母味浓郁的酸面团肉、上等的发酵梅干肉，以及略带一点致幻效果的菌菇肉！卡巴尔科肉类加工厂一直在创造未来食品！更棒的是，我们现在平均有超过 82% 的产品不含大肠杆菌！
3015=~如果感到幸福你就爆个脑……如果感到幸福你就割条血管……如果感到幸福，蹦蹦跳跳的人头会替你说出来……爱自己的工作，真是没得比。又一座不堪入目的车站？好吧，至少比上一站好看。该让你扣扳机的老伙计开工了。你肯定是从铁轨的另一边来的，而且一如既往，隧道尽头那点亮光说不定是列火车。
3016=~哈！吉迪恩那混蛋居然想靠调包的老把戏甩掉你。做梦吧，花裤衩！等你逮住他，一定给他尝尝你自己的调包手法。想想看，可以先把他的脑袋扭到一个更能向内反省的角度。反正他的脑袋早就插在那儿了，想必对那景色熟得很。冲进去之类的，随便啦。少想这些温馨的事了，正事要紧。这一次要把蓝线刷成红色。血红色。
3017=~厌倦了把辛苦挣来的钱都扔进房租这个无底洞？当然啦！所以您在卡巴尔科住宅建设与地产部的朋友们，刚建好了一个可爱的新社区。我们知道土地又贵又少，于是往爱河运河边那座又脏又老、带放射性还有毒的污坑上倒了层新土！卡巴尔科的新房从没这么便宜过！要是您打算成家，记得买大一点！有关不孕、全身不适、不停呕吐、到处都是「长三个脑袋的爱情结晶」之类的谣言，请一概别理。卡巴尔科关心您，房价更是公道！
3018=~觉得本地公共交通的安全纪录不怎么样？办法只有一个！毁掉它！对，把这破玩意儿全拆了。车票？要个屁！你唯一需要的车票是手里的喷子。这张票会让对手倒大霉。工作能让人快乐，当然是件好事。这回也许该下车歇一会儿，呼吸点浑浊的空气。前两趟车实在太「挤」了。
3019=~这才像样嘛。简直跟回家一样，真想躺下来一睡不醒。长生不死可没吹得那么好，费的劲比想象中大多了。至少你能帮别人得到自己永远得不到的东西。更妙的是，你能帮得比他们想象的还快。你就是这样，满脑子都是善意和慈悲。该加快他们上路的速度了。出来吧，不管你们藏在哪儿……你们就要，咳，被选中了。
3020=~即将进入新城，这里坐落着卡巴尔科工业庞大的企业总部！如今，骚乱和市民暴动很少再是问题！俯瞰白岩镇美丽的燃烧河，新城近乎完美地展现了一座只被毫无道德的大公司略微压迫的城市！没错，我们承认偶尔还有仪式献祭或夜间绑架。是的，有时也会有人失踪，从此音信全无。但街道大体上安全又整洁，经济正蒸蒸日上，只有一点小磕绊。我们是新城！卡巴尔科是我们的朋友！
3021=~ 担心自己的前途吗？高中时同学欺负过你吗？想找一份真正有挑战性的职业吗？那就加入卡巴尔科安保部吧。你根本不知道什么叫难熬的一天……除非你曾光着身子闷在又黑又小、几乎不透气的金属盒子里，汗流浃背，只剩一线理智和两打饥饿的老鼠陪你！不过别说我的事了！我们的强化训练包括各种羞辱和套进麻袋里殴打，会让你觉得自己脱胎换骨，成为全新的男人或女人！完成这十二步，你就会领到一把大枪，每天掌握他人的生杀大权！这下你那些心胸狭窄的混蛋同学可有好瞧的了！
3022=~ 您已到达卡巴尔科的绝密大圣殿。我们暂时不在，请随意在门口献血，最好是人血或羊血。如有紧急情况，请点燃 69 支白蜡烛，用指甲在水泥地板上刻一个大五芒星。然后用被磨烂、只剩短截的手指流出的血涂满身体，裸体在星中起舞，咏唱赞颂黑暗之神的歌谣。阴间一位阴险的仆人很快就来接待您。感谢您的耐心！
3023=~欢迎来到 Gnarly 检查站。哈。这里的安保好像有点过于……狂热了。卡巴尔科总部肯定还有另一个入口。眼下，还是先做点清理，干掉几个不配活着的对手。有时候，要把地方收拾干净，先得弄出点乱子。你只庆幸自己不用擦掉墙上的脑浆印子。等那些东西干了，肯定很难收拾。该自己做一张「通行无阻」的通行证了。
3024=~在找工作？卡巴尔科总用得上多一具身体！我们一直在招人，福利还真不少。您能在崭新宽敞的摩天楼里上班，每层都有汽水和咖啡机，我们的，咳，医疗方案简直超凡脱俗。在卡巴尔科，就算您从最底层往上看，我们也保证很快给您配个下属！我们的，呃，人力资源部不会像别的公司一样让您走烦琐的流程。没经验？没问题！我们连简历都不要，更别提申请表了。人来了就是我们的……我是说，嗯，您就被录用了。卡巴尔科提供不平等的就业机会。
3025=这回得承认卡巴尔科有两下子。他们的设计师在这块地皮上可真豁出去了。有开阔的楼梯、古怪却好看的艺术品、格外有趣的办公室隔间，还有比你能拿喷子瞄过来的更多的可炸之物。总的来说，这地方挺不错。再放把火就更好了。不过，那些教徒、苦役怪、沙卡利和狂信徒都得走人。滚去地狱。不许经过起点。不许领 200 美元。那个看着还挺好抱的大块头 Behemoth，也许适合加入你的私人宠物队伍。可惜它还没学会到外头上厕所。
3026=~该把这些混蛋关停了。拔掉他们的插头。切断供电。再没交流电了！妈的，直流电也甭想！欢迎来到发电站……你就是电网故障本身。这里刺激得滋滋冒火花。火花大得能一眨眼把你炸成焦脆的一块。最近几次坐火车的经历过后，你对当「导体」或者「列车员」一点兴趣也没有。该做你最擅长的事了……砸东西。还有什么比拿那些狂热分子开刀更好的开端？上工吧，断路器先生。
3027=~凯莱布真的能关上裂隙吗？奥菲莉娅能拿到她的两分钟礼物吗？盖布里埃尔……呃，盖布里埃拉，到底怎么了？要是伊什梅尔回不了家怎么办？还有，他那些文身是在哪儿弄的？|~敬请收看《烧起来了，烧起来了！》下一集。这些问题的答案，还有更多精彩内容，很快就会揭晓……我们保证。在此期间，去 BLOODBATH 大杀一场吧！！
3028=~啊，科学！你深情地回想起第一次可以解剖东西的时候。刚动手剥下那具恶臭尸体的皮时，你兴奋得浑身发抖。只加了一点点电压，肌肉组织就跳起了舞。后来不小心切开肠子，可把你惊着了！真有趣，还有股怪气！好吧，别做白日梦了。该行动起来，找到卡巴尔科研发部的入口。
3029=~没有什么比一次非常恶意的公司收购更能提神了！猎人和猎物的游戏一直很吸引你。事情开始有趣了。吉迪恩很快就无处可躲了。也就是说，该把这只老鼠逼上绝路了。眼下有点清洁工作要做。扫荡办公室从没这么好玩！话说通往楼顶的那部电梯在哪儿来着？
3030=~那个泥飞碟吉迪恩就在那儿！念着还挺顺口：鸽子吉迪恩。呜呼！打飞碟是你最爱玩的游戏之一。这回可要好好炸一场！炸他。放靶！砰。放靶！砰。放靶！别再跑了，吉迪恩。你的飞行结束了，蠢货。你的好运也到头了。
3031=~这是场生死之战。最好死的是别人。吉迪恩这具木偶的线再也拉不动了，该轮到提线的家伙遭报应。远古者？你在听吗？那就听听这个……
3032=~有点不一样，你用扣扳机的指头也指不出究竟哪儿不对。你的老伙计们个个脸色发白，甚至有点病恹恹的。他们到底着了什么魔，竟钻进那些棺材？嗯，算了。没有什么是多给一点铅治不好的……往头里送点铅，再把他们送上床。晚安，各位同为「天选者」的朋友。做个带毒的梦吧。
3033=~借用某位早已被忘得一干二净、话不多的诗人的话：「干掉它！」
