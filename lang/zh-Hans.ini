authored.876b96893e6e534e.text=你成功了，这艘飞艇完蛋了。趁它还没拉你陪葬，赶紧离开！
authored.1655b5465594c073.title=目标一
authored.1655b5465594c073.text=奥菲莉娅和吉迪恩一起消失在裂隙里。也许他们就在附近，谁也说不准。别让自己成为下一个祭品。
authored.fcfc192a55159c96.title=目标一
