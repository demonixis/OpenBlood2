[dialogue]
4prophet1=我不走。
1acaleb1=放马过来！
1acaleb2=到终点了。
2caleb1=你刚犯了第二个错。你居然还没跑。
2caleb2=没杀了我。
3caleb1=……盖布里埃尔？
3caleb2=留着说给在乎的人听吧。
3caleb3=情况变了。不过这不用我告诉你。
3caleb4=你不是我喜欢的类型。
4caleb1=你自己选。现在走，还能活。留下，就得死。
4caleb2=那你就去死吧。
bmpr1caleb1=我讨厌飞。
5caleb1=这下可能要糟。
6caleb1=这些不是秘会的人。
6caleb2=是别的东西。
6caleb3=我得去赶火车了。回头见。
8caleb1=你不是在开玩笑吧。
7caleb1=你根本想不到。
7caleb2=那当然，我这才刚热身呢。
7caleb3=我就是死不承认。什么都别指望我去面对。
7caleb4=我不需要保姆。
9caleb1=哦，我还要干得更绝。
9caleb2=带劲。
9caleb3=烧吧，烧个干净。反正我从没喜欢过这地方。
9caleb4=披萨。
9caleb5=上门脱衣舞。
11caleb1=我一直梦见你被这样绑着。
11caleb2=来亲一个，宝贝。
11caleb3=哦，又是你。过两分钟再来怎么样？
11caleb4=奥菲莉娅！行了，到此为止。你该死了！
13caleb1=你剩下的命得按秒算了，蠢货。
14caleb1=那我只好接着揍你了。
14caleb2=我可没说过自己聪明。
15caleb1=来吧，我看着。
15caleb2=来跳一曲吧，吓人鬼。
16caleb1=到了地狱就说是我送你来的。能打折。
16caleb2=放松，你已经死了。
16caleb3=太晚了，你早就死了。
16caleb4=活着没什么公平，死了也一样。习惯就好。
16caleb5=谢谢各位，晚安。
17caleb1=免了。
17caleb2=你这样要伤我的心了。
17caleb3=怎么？
17caleb4=废话够了，动手吧。
19caleb1=哟，你好啊，花裤衩先生。恕我就不握手了。
20caleb1=那种事我一窍不通。
20caleb2=怎么，你要打我屁股？
20caleb3=好了，闭嘴吧，我得集中精神。
20caleb4=有点像给灵魂灌肠。往好的方面说。
3gab1=这到底是什么鬼东西？
3gab2=凯莱布？
3gab3=加布里埃拉。说来话长。
3gab4=见到老朋友就这么打招呼？
3gab5=我得跟你一起去，弄清楚到底出了什么事。
3gab6=最近照过镜子没？你也好不到哪儿去。
6gab1=这些东西到处都是。秘会居然造出这种生物，看来已经急疯了。
6gab2=那它们到底是什么？
6gab4=你在干什么？
6gab5=别担心，小个子。我们还会见面的。
14gab1=我们得追上他。谁知道前头有什么在等他。
17gab1=虫子，我们是远古者。跪拜吧。
17gab2=挡在我们和统治大业之间的只有你？真可怜。
17gab3=现有的一切都将不复存在。曾有的一切都不曾存在。将有的一切……呃……
17gab4=将有的一切永远都不会……发生。
20gab1=你俩再不闭嘴，我就把你们都杀了。
1agid1=我是吉迪恩，今天来客串列车长！抓紧了，这趟车可能会有点……血腥！
1agid2=我知道你在这儿，凯莱布。我等不及要扯出你的脾脏，当帽子戴了。
2gid1=你跟火车真是八字不合，对吧？
2gid2=是吗？那我犯的第一个错是什么？
3gid1=你该死了，天选者。
