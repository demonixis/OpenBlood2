authored.fcfc192a55159c96.text=Agora deve dar para entrar em Pesquisa e Desenvolvimento. Vá até lá e veja o que se desenvolve.
authored.f509240c18010417.title=Objetivo 1
authored.f509240c18010417.text=Esse lugar de novo?! Bom, talvez Gideon esteja por aqui. A melhor rota de fuga para ele deve ter sido pelos elevadores. Está esperando o quê? Vá acabar com ele.
