[dialogue]
4prophet1=Eu fico.
1acaleb1=Manda ver!
1acaleb2=Fim da linha.
2caleb1=Você acabou de cometer seu segundo erro. Ficou por aqui.
2caleb2=Me deixar vivo.
3caleb1=… Gabriel?
3caleb2=Guarde isso pra quem se importa.
3caleb3=As coisas mudaram. Mas não preciso te dizer isso.
3caleb4=Você não faz meu tipo.
4caleb1=A escolha é sua. Vá embora agora e viva. Fique e morra.
4caleb2=Então você vai morrer.
bmpr1caleb1=Odeio voar.
5caleb1=Isso pode dar ruim.
6caleb1=Esses não são da Cabala.
6caleb2=São outra coisa.
6caleb3=Tenho um trem pra pegar. A gente se vê.
8caleb1=Você só pode estar brincando.
7caleb1=Você nem imagina.
7caleb2=Com certeza. Só estou me aquecendo.
7caleb3=Eu sou a negação em pessoa. Não vou encarar nada.
7caleb4=Não preciso de babá.
9caleb1=Ah, vou fazer muito mais que isso.
9caleb2=Irado.
9caleb3=Deixa queimar. Nunca gostei deste lugar mesmo.
9caleb4=Pizza.
9caleb5=Entrega de strip-tease.
11caleb1=Sonhei com você toda amarrada assim.
11caleb2=Me dá um beijinho, gata.
11caleb3=Ah, você de novo. Que tal voltar daqui a uns dois minutos?
11caleb4=Ophelia! Chega. Está na hora de você morrer!
13caleb1=O resto da sua vida vai ser contado em segundos, otário.
14caleb1=Então vou ter que continuar chutando a sua bunda.
14caleb2=Nunca disse que eu era esperto.
15caleb1=Vai em frente. Vou ficar olhando.
15caleb2=Vamos dançar, bicho-papão?
16caleb1=Quando chegar ao inferno, diga que fui eu que te mandei. Você ganha desconto.
16caleb2=Relaxa, você já morreu.
16caleb3=Tarde demais, você já morreu.
16caleb4=A vida não é justa, e a morte também não. Acostume-se.
16caleb5=Obrigado e boa noite.
17caleb1=Nem.
17caleb2=Assim você vai ferir meus sentimentos.
17caleb3=E aí?
17caleb4=Chega de conversa. Vamos brigar.
19caleb1=Ora, olá, senhor Engomadinho. Desculpe se eu não apertar sua mão.
20caleb1=Não sei nada dessas coisas.
20caleb2=Vai fazer o quê, me dar umas palmadas?
20caleb3=Tá, cala a boca. Preciso me concentrar.
20caleb4=Tipo uma lavagem intestinal espiritual. No bom sentido.
3gab1=Mas que porra é essa?
3gab2=Caleb?
3gab3=Gabriella. É uma longa história.
3gab4=É assim que se cumprimenta uma velha amiga?
3gab5=Preciso ir com você. Descobrir o que está acontecendo.
3gab6=Andou se olhando no espelho? Você também não é lá grande coisa.
6gab1=Essas coisas estão por toda parte. A Cabala deve estar desesperada pra criar criaturas assim.
6gab2=Então o que são?
6gab4=O que você está fazendo?
6gab5=Não se preocupe, homenzinho. A gente se vê de novo.
14gab1=Temos que ir atrás dele. Quem sabe o que o espera?
17gab1=Inseto, somos o Ancião. Curve-se diante de nós.
17gab2=Você é tudo que se interpõe entre nós e o domínio absoluto? Patético.
17gab3=Tudo o que é deixará de ser. Tudo o que foi nunca existiu. Tudo o que estava por vir… hum…
17gab4=Tudo o que estava por vir nunca vai… acontecer.
20gab1=Vou matar vocês dois se não calarem a boca.
1agid1=Aqui é Gideon, seu maquinista convidado! Segurem firme, a viagem pode ficar um pouco… sangrenta!
1agid2=Sei que você está aqui, Caleb. Mal posso esperar pra arrancar seu baço e usar de chapéu.
2gid1=Você não tem muita sorte com trens, né?
2gid2=Ah, é? Qual foi meu primeiro erro?
3gid1=Hora de morrer, Escolhido.
7gid1=É bom que funcione desta vez.
7gid2=Ishmael?
7gid3=Você teve sorte desta vez, Traidor. Em poucas horas, tudo vai voltar aos eixos e eu vou me livrar de você de uma vez por todas. Por enquanto, preciso me retirar. Não se preocupe, minhas tropas vão fazer companhia. Comportem-se.
10gid1=Parece até que estou em casa.
10gid2=Sai da porra do meu caminho!
11gid1=Imaginei que você pudesse vir aqui.
11gid2=Desculpe interromper esse belo reencontro, Traidor, mas preciso manter você motivado.
14gid1=Não acabou! Você nunca vai me derrotar de verdade!
15gid1=Ah, Caleb. Eu estava esperando por você, brutamontes previsível. Não vou demorar. Só estou… me transformando…
15gid2=… em algo… desagradável.
15gid3=O que achou do meu novo visual? Você não faz ideia do quanto a dor pode ser deliciosa. Permita-me demonstrar.
15gid4=Em você, é claro!
16gid1=Não! Não é justo! Vou te matar!
7ish1=Essa foi uma reviravolta surpreendente.
7ish2=Dia ruim?
7ish3=Você tem noção do estrago que está causando?
7ish4=Não foi isso que eu quis dizer. Você é Aquele que Une. Mais cedo ou mais tarde vai ter que encarar isso.
7ish5=Então saiba disto: nós somos os Escolhidos. Estamos aqui por você, goste ou não.
7ish6=Sim, Ophelia também. Ela foi a primeira a atravessar.
7ish7=Não perderia isso por nada neste mundo. A não ser que você acabe destruindo o mundo.
9ish1=Você está pensando em Ophelia. Comovente.
9ish2=Há uma fenda permanente no templo de Gideon. É o foco de todo o estrago que está sendo causado. Um epicentro, por assim dizer. Você vai encontrar Ophelia lá.
9ish3=A destruição de Tchernobog abriu muitas portas entre os mundos. Só Aquele que Une pode selá-las. Esse poder está em você. Esta realidade vai perecer se você não a restaurar.
9ish4=Outra realidade está forçando a passagem pelas fendas, antiga e faminta. Não é boa nem má, apenas existe. Mas vai devorar todos nós.
14ish1=Você não vai atrás dele, vai?
14ish2=Eu diria que é algo bem desagradável.
17ish1=Inseto, somos o Ancião. Curve-se diante de nós.
17ish2=Você é tudo que se interpõe entre nós e o domínio absoluto? Patético.
17ish3=Tudo o que é deixará de ser. Tudo o que foi nunca existiu. Tudo o que estava por vir… hum…
17ish4=Tudo o que estava por vir nunca vai… acontecer.
20ish1=Não acabou, Caleb. Você precisa selar as fendas. Precisa unir de novo o tecido desta realidade antes que ele se rasgue.
20ish2=O poder está dentro de você. Está na hora de usá-lo.
3madsci1=Essa eu não esperava. Hmm, acho que vou precisar recalibrar a singularidade.
7madsci1=Confie em mim. Desta vez meus cálculos estão perfeitos.
10madsci1=Senhor, recomendo que reconsidere. Meus cálculos ainda são inconclusivos. As fendas podem ser uma fonte de poder ilimitado, como sugere, mas também podem ser armadilhas mortais no tecido do contínuo espaço-tempo. Podem levá-lo a um reino de caos e mal absolutos onde o senhor seria completa e inteiramente aniquilado.
10madsci2=Mas, senhor!
10madsci3=Não! Nunca tive a chance… de lhe dizer… o quanto eu o amo…
12madsci1=Olá, olá, olá. Boas-vindas ao setor de Pesquisa e Desenvolvimento, ou, como gosto de chamar… P&D. Pode me chamar de… doutor. Tive cobaias interessantes ultimamente com todas essas flutuações no substrato cósmico, mas confesso que mal posso esperar pela sua… dissecação. Por favor, prossiga até o laboratório principal e começaremos o experimento…
11oph1=O príncipe encantado, suponho.
11oph2=Me desamarre e eu te dou uma torta de baunilha inteirinha.
14oph1=Ele quer que você siga atrás dele, seu imbecil.
14oph2=O que estamos esperando?
17oph1=Inseto, somos o Ancião. Curve-se diante de nós.
17oph2=Você é tudo que se interpõe entre nós e o domínio absoluto? Patético.
17oph3=Tudo o que é deixará de ser. Tudo o que foi nunca existiu. Tudo o que estava por vir… hum…
17oph4=Tudo o que estava por vir nunca vai… acontecer.
20oph1=Você não tem escolha. Escute o Ishmael, seu idiota.
20oph2=Eu te dou umas palmadas se você me der umas também.
sounds.chosen.caleb.e1m1_1_cal=Não sou um sonho ruim. Sou o pior pesadelo deles.
sounds.chosen.caleb.e1m3_2_cal=Não fazem mais como antigamente.
sounds.chosen.caleb.e1m4_1_cal=Parece que tem gente pra matar.
sounds.chosen.caleb.e1m4e5a_cal=Sei lá, porra. Que te importa? Você não parece estar tendo problema com eles.
sounds.chosen.caleb.e1m4e7a_cal=O que é que isso quer dizer?
sounds.chosen.caleb.e1m4e9a_cal=Eu vou resolver!
sounds.chosen.caleb.e1m5_1_cal=Ei, este lugar devia me dar uma comissão.
sounds.chosen.caleb.e2m5_1_cal=É hora do Howdy Doody, criançada. O vilão chegou.
sounds.chosen.caleb.e2m5_2_cal=Bom, é um jeito de abrir alguém no meio. Mas o meu método é muito mais rápido e divertido.
sounds.chosen.caleb.e2m5_4_cal=Urgh, estou me sentindo um pedaço de carne.
sounds.chosen.caleb.e3m1_2_cal=Agora a coisa vai esquentar!
sounds.chosen.caleb.e3m1_3_cal=Ah, nada nunca é fácil.
sounds.chosen.caleb.e3m2_1_cal=Que desperdício de munição boa!
sounds.chosen.caleb.e3m2_2_cal=Hmm, um posto de segurança. Ah, droga, acho que me pegaram. Vou ter que voltar.
sounds.chosen.caleb.e3m2_3_cal=Nossa, com instalações tão espaçosas, talvez eu devesse procurar emprego aqui.
sounds.chosen.caleb.e3m3_1_cal=Bom dia! E, caso eu não veja vocês de novo, boa tarde, boa noite e durmam bem!
sounds.chosen.caleb.e3m3_2_cal=É ele. É o cara que eu estou procurando.
sounds.chosen.caleb.e3m3_3_cal=Não sou mecânico. Meu negócio é machucar gente. Descendo.
sounds.chosen.caleb.e3m5_1_cal=Sabe, este lugar parece quase irreal.
sounds.chosen.caleb.e3m5_3_cal=Essa ponte parece perfeitamente segura pra atravessar.
sounds.chosen.caleb.e3m5_4_cal=Um belo exemplo de construção típica da Cabala.
sounds.chosen.caleb.kill.c_1liner_2=Todo mundo morre.
sounds.chosen.caleb.msc11cal=Eu até diria que sinto muito, mas você sabe que não seria sincero. Tenha um bom dia.
sounds.chosen.caleb.msc14_cal=Hmm, nada como carne recém-embalada.
sounds.chosen.caleb.msc15_cal=Inspeção sanitária. Receio que vou ter que fechar seu estabelecimento.
sounds.chosen.caleb.msc18_cal=De volta à labuta…
sounds.chosen.caleb.msccaleb1=Trancado.
sounds.chosen.caleb.taunt.tnt5_cal=É, e eu achando que era feio.
sounds.chosen.gabriella.e1m4e3_gab=Alguém tem que segurar o trem. Essas coisas estão por toda parte lá fora. A Cabala deve estar desesperada pra criar criaturas assim.
sounds.chosen.gabriella.e1m4e6_gab=Eu não tenho problemas. Eu resolvo.
sounds.chosen.gabriella.e1m4e8_gab=Não sei mais se posso contar com você. A situação está ficando feia. Se você não resolver, eu resolvo.
sounds.enemies.civilian.02civ1=Ei, camarada, você está bem? Você está um trapo.
sounds.enemies.civilian.02civ3=Ei, acho que o trem parou de funcionar. Quer saber? Talvez a gente devesse pegar um táxi.
sounds.enemies.civilian.02civ4=Vai latir o dia todo, cachorrinho, ou vai morder?
sounds.enemies.civilian.02civ5=Armas são proibidas aqui, amigão! A não ser que você compre uma pra mim.
sounds.enemies.civilian.11civ2=Qualquer coisa, menos hambúrguer.
sounds.enemies.civilian.11civ4=É, eu tenho um cachorro-quente pra você.
sounds.enemies.civilian.12civ2=Ah, merda!
sounds.enemies.civilian.12civ3=Não tem ninguém em casa. Vai embora.
sounds.enemies.civilian.12civ4=Me deixa em paz!
sounds.enemies.civilian.12civ5=Não quero nada!
sounds.enemies.civilian.spot11=Ah, merda. Hoje não é meu dia.
sounds.enemies.civilian.spot2=Isto aqui é um hospício!
sounds.enemies.f_civ.02civ2=Isso não pode estar acontecendo. Vou me atrasar pro trabalho!
sounds.enemies.f_civ.02civ8=Não sei. Acho que enfiei a cabeça dele fundo demais.
sounds.enemies.f_civ.09civ=Quem é?
sounds.enemies.f_civ.09civ3=Sério? Legal. Vou destrancar a porta.
sounds.enemies.f_civ.11civ1=Cara, toda essa cartilagem está me dando fome. O que você quer almoçar?
sounds.enemies.f_civ.11civ3=Que tal um cachorro-quente?
sounds.enemies.f_civ.spot3=Tudo está indo pro inferno aqui! O que é isso?
sounds.enemies.gideon.15gid2b=Você não faz ideia do quanto a dor pode ser deliciosa. Permita-me demonstrar.
sounds.enemies.gideon.tnt4_gid=Hoje testemunharei a queda do Grande Traidor!
sounds.enemies.gideon.tnt7_gid=Você será purgado. A Cabala voltará a viver!
sounds.enemies.loudspeaker.2loudspker=O Museu de Antiguidades Lafayette está fechado. O horário de funcionamento é das 15h às 17h, todos os dias. A entrada custa 17 dólares. Mantenham suas crianças na coleira o tempo todo, por favor. Obrigado.
sounds.enemies.prophet.spot3=Olá.
sounds.events.cwvoice11=Processadores desligados.
sounds.events.cwvoice6=Acesso negado.
sounds.events.cwvoice8=Campo de força desativado.
sounds.events.cwvoice9=Unidade de recuperação do depósito criogênico ativada.
sounds.events.davoice1=Bem-vindos ao Museu de Antiguidades Lafayette. Não deixem de visitar as exposições egípcias recém-restauradas. A mostra de hoje é sobre cultos e rituais. Na ala norte, confiram a reprodução em meia escala de uma divindade mítica.
sounds.events.davoice2=Os incas adoravam os altos picos que rasgavam o céu da América do Sul. Essas montanhas escarpadas eram um meio de se aproximar do deus Sol, centro de sua religião. Muitos sacrifícios foram feitos no topo desses picos frios e imprevisíveis.
sounds.events.davoice3=Essas múmias foram desenterradas nas tumbas de Sacará. Dos primórdios do Egito Antigo até seu declínio mais de 3.000 anos depois, o local serviu de necrópole para a elite da vizinha Mênfis. Vários reis egípcios escolheram Sacará para seu enterro no Período Arcaico e no Antigo Império.
sounds.events.vent2=Estou muito, muito queimado, mas ainda não estou bem morto.
sounds.phones.phone11=Quem está falando? Pare de ligar pra cá!
sounds.phones.phone12=Quando eu era jovem, não tinha Gerador de Singularidade. Matávamos o Sacerdote Drudge com as próprias mãos, e gostávamos! A gente agarrava a sanguessuga óssea dele e arrancava!
sounds.phones.phone13=Quando eu era jovem, não tinha Sanguessuga Vital! Matávamos os Drudges de Alma com as próprias mãos! Arrancávamos as pernas deles na mordida e eles sempre voltavam! Não estávamos nem aí! Gostávamos assim!
sounds.phones.phone2=Hum, bom dia, boa tarde ou boa noite, sr. Cal Eb. Trabalho para um instituto de pesquisa de mercado. Estamos fazendo uma pesquisa sobre jogos de computador. Não estou tentando vender nada. Primeira pergunta: o senhor é ou já foi personagem de um jogo de computador?
sounds.phones.phone4=O número discado está fora de serviço. Fique na linha feito idiota e ninguém vai atender. Isto é uma gravação.
sounds.phones.phone6=Por que não encontro Amanda Huggin’ Kiss? Você pode me ajudar a encontrar Amanda Huggin’ Kiss?
sounds.phones.phone8=Alguém procura um bundão no banheiro masculino!
sounds.chosen.caleb.e1m1_3_cal=Ora, onde foram parar aqueles malucos armados até os dentes?
sounds.chosen.caleb.e1m1_4_cal=Preparem-se para uma surpresa. Aí vem Caleb!
sounds.chosen.caleb.e1m1_8_cal=Hora do despejo!
sounds.chosen.caleb.e1m3_3_cal=Hmm, vou querer um SAT. Sanduíche de sangue, alface e tomate. Sem maionese, tá?
sounds.chosen.caleb.e1m3_4_cal=Ah, isso que é uma almôndega apimentada.
sounds.chosen.caleb.e1m4_2_cal=Ah, este lugar é um buraco infernal. Hehe, gostei.
sounds.chosen.caleb.e1m5_3_cal=Hmm, isso vai piorar muito antes de melhorar.
sounds.chosen.caleb.e1m5_5_cal=Argh. Pelo menos não sou o único defunto velho aqui embaixo.
sounds.chosen.caleb.msc16_cal=Nossa, que bagunça. As condições não são nada higiênicas.
sounds.chosen.caleb.msc17_cal=Hmm, uva é o meu sabor preferido. Nhac!
sounds.chosen.caleb.msccaleb2=Está emperrado.
sounds.enemies.civilian.idle2=Isso não está acontecendo. Isso não está acontecendo. Isso não está acontecendo. Isso não está acontecendo.
sounds.events.cwvoice10=Autodestruição de emergência iniciada. Autodestruição em 60 segundos.
sounds.events.cwvoice5=Acesso autorizado.
sounds.events.psvoice1=Doutor Vandervoort, compareça à sala de dissecação. Temos uma hemorragia que precisa de atenção.
sounds.events.psvoice10j=Lembre-se: o progresso vem antes da segurança.
sounds.events.psvoice11j=Atenção, há um intruso no nível 3. Ele está armado e é extremamente perigoso. Não se aproximem desse homem em hipótese alguma. Na verdade, corram o mais rápido que puderem na direção oposta. Obrigado e tenham um bom dia.
sounds.events.psvoice2l=Doutor Kohler, compareça à recepção. Doutor Kohler, por favor, compareça à recepção. Seu namorado está esperando.
sounds.events.psvoice3=Doutor Cattell, emergência no laboratório de exames 7.
sounds.events.psvoice7l=Doutor Coleman, dirija-se à neurologia. Doutor Coleman, por favor, compareça à neurologia.
sounds.events.psvoice8l=Solicitamos que os funcionários dos níveis 10, 11 e 12 compareçam à descontaminação.
sounds.events.tavoice1=Bem-vindos à rede de transporte intermunicipal da Cabalco. Sabemos que vocês têm opções de transporte público e estamos muito felizes por terem escolhido a Cabalco.
sounds.events.tavoice2a=A rede de transporte intermunicipal da Cabalco está de cara nova. Os assaltos caíram 13%, as surras aleatórias, 6%, os assassinatos, 3%, e as falhas gerais do sistema, expressivos 7%. Infelizmente, as mutilações de animais subiram espantosos 96%.
sounds.events.tavoice3=É estritamente proibido empalar outros passageiros com objetos pontiagudos. Obrigado.
sounds.events.tavoice4=É proibido fumar no transporte da Cabalco. Obrigado.
sounds.events.tavoice5=Estamos nos aproximando do Expresso do Centro.
sounds.events.tavoice6=Próxima parada, rua Pickman.
sounds.events.tavoice7=Estamos entrando no setor industrial.
sounds.events.tavoice8=Próxima parada, rua Ingram.
sounds.events.tavoice9=Mantenham braços e pernas dentro do trem o tempo todo. Se precisarem se livrar deles rapidamente, depositem os membros decepados nos recipientes estéreis ao lado de cada saída. Obrigado por ajudar a manter o transporte da Cabalco limpo e seguro.
sounds_ao.chosen.caleb.calebintro1.1=Lá estava eu, preso naquele ermo gelado, com pouca munição, sem uma gota de goró e perseguido por patrulhas da Cabala.
sounds_ao.chosen.caleb.calebintro1.2=Mal dava para enxergar no meio daquela neve, mas achei que vi uma luz lá na frente. Esverdeada, meio sinistra.
sounds_ao.chosen.caleb.calebintro1.3=«É do tipo de lugar de que eu gosto», lembro de ter pensado.
sounds_ao.chosen.caleb.calebintro1.4=Aí fui me arrastando até lá e… Opa! Vocês também estão se sentindo esquisitos?
sounds_ao.chosen.caleb.calebl1a=Que diabos? O que é isso? Uma viagem de ácido com distorção temporal?
sounds_ao.chosen.caleb.calebl1b=Droga, outro portal? Odeio essas coisas. Bom, lá vou eu.
sounds_ao.chosen.caleb.calebl2a=Mas o que… Ophelia, o que está acontecendo?
sounds_ao.chosen.caleb.calebl2b=Onde eu estou? Hum, parece uma fraternidade. Espera… não pode ser!
sounds_ao.chosen.caleb.calebl2c=Acho que não, irmã. Ah, não, de novo!
sounds_ao.chosen.caleb.calebl3a=Malditas esferas do tempo. Já estou de saco cheio.
sounds_ao.chosen.caleb.calebl3b=Quê? JoJo?
sounds_ao.chosen.caleb.calebl3c=Essa é boa. Ei, dá para fazer rapidinho aquele número na corda bamba? Sempre gostei desse. Ih.
sounds_ao.chosen.caleb.calebl4at1=Pelo amor de…
sounds_ao.chosen.caleb.calebl4b=Oi, Gabriella.
sounds_ao.chosen.caleb.calebl4c=Tanto faz. Estou vendo um padrão aqui. Para onde será que vou parar agora? Já visitei todos os Escolhidos.
sounds_ao.chosen.caleb.calebl4d=Tá, até mais.
sounds_ao.chosen.caleb.calebl6a=Então é você que fica me arrastando por essas fendas. Agora vai pagar. E é bom que minhas salsichas não estejam queimadas quando eu voltar.
sounds_ao.chosen.caleb.llcaleb1a=Brr, que frio.
sounds_ao.chosen.caleb.llcaleb1b=Um labirinto de sebes. Que delícia!
sounds_ao.chosen.caleb.llcaleb2a=Ai, minha cabeça! Uma igreja? Isso é mesmo um pesadelo.
sounds_ao.chosen.caleb.llcaleb2d=Andem, bezerrinhos. Wyoming vai ser o novo lar de vocês.
sounds_ao.chosen.caleb.llcaleb2e=Hora de curar essa ressaca com mais um trago.
sounds_ao.chosen.caleb.llcaleb2g=Ah, sim, isso faz crescer pelo na bunda.
sounds_ao.chosen.caleb.llcaleb2h=Ah, ressaca se cura com mais uma dose.
sounds_ao.chosen.caleb.llcaleb2i=Hum… Essa é a melhor fase em que já estive.
sounds_ao.chosen.caleb.llcaleb2j=Minha barriga está estranha.
sounds_ao.chosen.gabriella.gab43=Você!
sounds_ao.chosen.gabriella.gab44=Gabriella.
sounds_ao.chosen.gabriella.gab45=Sei lá. Só continua. Estou cansada.
sounds_ao.chosen.gabriella.gabint11=Então, Ophelia, qual é sua história mais assustadora? Quebrou uma unha recarregando?
sounds_ao.chosen.gabriella.gabint21.1=Claro!
sounds_ao.chosen.gabriella.gabint21.2=Quando eu era criança, meu papai me levava todo ano ao espetáculo de aberrações. E todo ano eu via o JoJo.
sounds_ao.chosen.gabriella.gabint21.3=Eu jogava torrões de terra nele.
sounds_ao.chosen.gabriella.gabint31=Uma vez tive que passar a noite numa mansão assustadora.
sounds_ao.chosen.gabriella.gabint32=E foi isso. Deu medo.
sounds_ao.chosen.gabriella.gabint33=Não!
sounds_ao.chosen.gabriella.gabint34=Vocês querem que eu conte a história ou não?
sounds_ao.chosen.gabriella.gabint35=Fica muito mais assustadora se eu contar os detalhes.
sounds_ao.chosen.gabriella.gabint36.1=Ótimo, agora calem a boca vocês dois!
sounds_ao.chosen.gabriella.gabint36.2=Lá estava eu, numa mansão velha e apodrecida, no meio do pântano perto de onde cresci.
sounds_ao.chosen.gabriella.gabint36.3=A noite estava nublada e o ar, cheio de neblina e gases do pântano.
sounds_ao.chosen.gabriella.gabint41=Pelo visto, vou passar a noite aqui. Melhor dar uma olhada e tentar achar um quarto.
sounds_ao.chosen.gabriella.gabint42=Pronto. Agora, uma boa noite de sono.
sounds_ao.chosen.ishmael.ish31=JoJo aqui, mestre.
sounds_ao.chosen.ishmael.ish32=JoJo ouve e obedece, mestre.
sounds_ao.chosen.ishmael.ish33=Bom, nem foi tão ruim. Será que um dia vou sentir falta do cheiro do meu próprio esterco misturado com feno?
sounds_ao.chosen.ishmael.ish34=Ah, olá! Por acaso você tem bananas?
sounds_ao.chosen.ishmael.ish35=Exatamente.
sounds_ao.chosen.ishmael.ishint21.1=Bom, suponho que seja a minha vez, não? Ora, ora. Assim como Ophelia, tenho um segredo.
sounds_ao.chosen.ishmael.ishint21.2=Com certeza vocês já ouviram falar de JoJo, o garoto idiota do circo.
sounds_ao.chosen.ishmael.ishint22.1=Sim, bom, eu me lembro. Vejam só: eu era o JoJo.
sounds_ao.chosen.ishmael.ishint22.2=Naquela época, o seguro-desemprego não cobria cultistas malignos, e o circo era o único lugar onde um sujeito tatuado e desempregado conseguia trabalho.
sounds_ao.chosen.ishmael.ishint22.3=Por um tempo, virei o JoJo. O JoJo anterior me passou o venerável manto de ser JoJo.
sounds_ao.chosen.ishmael.ishint22.4=E foi com graça e orgulho que desfilei no palco no meu primeiro dia.
sounds_ao.chosen.ishmael.ishint22.5=Aí uns pirralhos desgraçados que jogavam terra, como você, me ensinaram o que era ser uma aberração de verdade.
sounds_ao.chosen.ishmael.ishint22.6=Depois de um ano, eu era prisioneiro da minha baixa autoestima. Mas um dia tudo mudou.
sounds_ao.chosen.ishmael.ishint22.7=Tchernobog falou comigo e me ordenou que me livrasse daquele escárnio mortal.
sounds_ao.chosen.ishmael.ishint22.8=E foi o que fiz. Mas não foi fácil.
sounds_ao.chosen.ishmael.ishint31=Tenho que dizer que me sinto bem enganado.
sounds_ao.chosen.ishmael.ishint32=Pode contar. Ainda temos meio saco de marshmallows, de qualquer modo.
sounds_ao.chosen.ishmael.ishintro=Ah, podem me passar as salsichas?
sounds_ao.chosen.ishmael.ishoutro=Hum, com licença, mas quem pegou o último marshmallow?
sounds_ao.chosen.ophelia.oph21=Tenho que destruir aqueles álbuns de fotos!
sounds_ao.chosen.ophelia.oph22=Pronto, consegui! Meu passado foi apagado e agora posso entrar na Cabala!
sounds_ao.chosen.ophelia.oph23=Ei, o que você está fazendo na minha história?
sounds_ao.chosen.ophelia.oph24=Hum… Você está tendo um sonho ruim, querido Caleb. Só um pesadelo.
sounds_ao.chosen.ophelia.ophint11.1=Muito engraçado. Na verdade, para contar esta história, vou ter que revelar um segredinho a vocês dois.
sounds_ao.chosen.ophelia.ophint11.2=Mas não contem ao Caleb. Ele nunca me perdoaria. Vejam, há muito, muito tempo…
sounds_ao.chosen.ophelia.ophint11.3=Antes de ter ambições de dominar o mundo, eu era só uma garotinha toda animada de uma irmandade universitária.
sounds_ao.chosen.ophelia.ophint12.1=Sim, eu sei, Ish. Parece absurdo pra caramba. Mas é verdade. Meu segredinho sombrio.
sounds_ao.chosen.ophelia.ophint12.2=Foi assim que conheci a Cabala. Um dia, eles enviaram uma horda de zumbis para tomar o campus.
sounds_ao.chosen.ophelia.ophint12.3=Parece que havia um estudante genial que tinha inventado um soro de reanimação, mas eu duvido.
sounds_ao.chosen.ophelia.ophint12.4=Como é de praxe entre zumbis, eles foram atraídos pelo lugar com mais mulheres indefesas e seminuas: a casa da minha irmandade.
sounds_ao.chosen.ophelia.ophint12.5=Eu já estava de saco cheio daquela vida toda animadinha. Em vez de salvar minhas irmãs, decidi abandonar o visual de loira descolorida…
sounds_ao.chosen.ophelia.ophint12.6=E me juntar ao pessoal da Cabala. O problema é que eles nunca me aceitariam se soubessem que eu fazia parte de uma irmandade.
sounds_ao.chosen.ophelia.ophint12.7=Os zumbis cuidariam das garotas, mas os álbuns de fotos ainda estavam na casa. Eu precisava entrar e destruí-los.
sounds_ao.chosen.ophelia.ophint31=Então, Gabby, é a sua vez. Qual é a sua história?
sounds_ao.chosen.ophelia.ophint32=E aí?
sounds_ao.chosen.ophelia.ophint33=Nenhum grande segredo? Nenhum complô cafona para revelar?
sounds_ao.chosen.ophelia.ophint34=Pelo que vejo, você já contou.
sounds_ao.chosen.ophelia.ophint35=Agora sim!
sounds_ao.chosen.ophelia.ophintro=Ele sempre foi péssimo contando histórias.
sounds_ao.enemies.gideon.gideoni1.1=Ah, sim, olá. Com certeza se lembram de mim, não é? Gideon, o vaidoso e louco pelo poder?
sounds_ao.enemies.gideon.gideoni1.2=Houve um tempo em que eu pretendia ocupar o trono dos deuses. Bom, suponho que meu desejo se realizou.
sounds_ao.enemies.gideon.gideoni1.3=Minha alma imortal está presa a este cárcere craniano por toda a eternidade, graças ao Caleb e a seus Escolhidos.
sounds_ao.enemies.gideon.gideoni1.4=Enfim, não adianta ficar amargurado com isso.
sounds_ao.enemies.gideon.gideoni1.5=Imagino que um dia servirei de musa a algum dramaturgo desafortunado que apareça por aqui.
sounds_ao.enemies.gideon.gideoni1.6=Até lá, gentil jogador, vou entretê-lo com esta pequena anedota.
sounds_ao.enemies.gideon.gideoni2.1=Depois de derrotar o Ancião, os Escolhidos tinham uma longa caminhada de volta para casa pelo Outro Mundo.
sounds_ao.enemies.gideon.gideoni2.2=Eles deram conta de um ou outro demônio que cruzou seu caminho, mas não estavam preparados para…
sounds_ao.enemies.gideon.gideoni2.3=O poderoso terror psíquico que espreitava o ermo. O Pesadelo.
sounds_ao.enemies.gideon.gideoni2.4=Tolos como eram, os Escolhidos praticamente convidaram aquele demônio para uma visita ao decidirem contar histórias de terror…
sounds_ao.enemies.gideon.gideoni2.5=Durante uma de suas refeições. Mal sabiam que cada um estava prestes a ser levado…
sounds_ao.enemies.gideon.gideoni2.6=Ao seu inferno particular. Observe e divirta-se, caro jogador.
sounds_ao.enemies.gideon.gideoni3.1=E assim nossa história chega ao fim. Caleb vence mais uma vez. Parece que nada pode detê-lo.
sounds_ao.enemies.gideon.gideoni3.2=Às vezes, é quase como se a mão invisível de um ser de outro mundo guiasse seus atos.
sounds_ao.enemies.gideon.gideoni3.3=Mas é melhor eu não ficar pensando nessas coisas. Por enquanto, vou me contentar em observar.
sounds_ao.enemies.gideon.gideoni3.4=Os Escolhidos têm muitas aventuras pela frente. Histórias para contar, batalhas para travar e impérios para forjar.
sounds_ao.enemies.gideon.gideoni3.5=Talvez um dia eu encontre uma maneira de voltar.
sounds_ao.enemies.gideon.gideoni3.6=E nesse dia, eu garanto: Caleb vai arder.
sounds_ao.enemies.tchernobog.tcherno31=Ishmael. Escute.
sounds_ao.enemies.tchernobog.tcherno32=Você não é mais JoJo. Vá. Mate esses mortais e venha para o meu lado. Temos muito trabalho.

[intro]
line01=Nós somos a Cabala.
line02=Eu, Gideon, sou seu líder sinistro e genial.
line03=Sempre estivemos à espreita entre vocês.
line04=Como larvas no cadáver inchado e fétido de um rato doente.
line05=Servos d’Aquele que Une, o deus sombrio Tchernobog.
line06=Até um século atrás, tudo corria conforme nossos planos malignos.
line07=Jamais imaginamos que um dos nossos nos trairia.
line08=Seu nome era Caleb.
line09=Ele destruiu nosso deus e absorveu o poder de Tchernobog.
line10=Eu, e só eu, trarei de volta nosso deus sombrio.
line11=Eu vou destruir Caleb.
line12=Vou esmagar suas entranhas sob meus pés como uvas podres.
line13=E Caleb morrerá pela última vez.

