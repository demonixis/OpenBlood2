6001=Gideon estragou seu trajeto e agora está fugindo feito um covarde. Vai deixar barato? Siga-o até o museu e dê a ele o que merece. Cuidado com os capangas dele pelo caminho.
6002=Tem um beco aqui perto que seria um ótimo atalho para o museu. Talvez você precise explorar um pouco para encontrá-lo.
6003=As latas de lixo na plataforma do outro lado guardam umas coisas boas. Pule até lá e pegue tudo! (Pular enquanto corre aumenta a distância do salto.)
6004=Seus pulos deram resultado! Você encontrou uma lanterna. Procure-a no inventário e faça um teste. Ela vai ser útil quando você chegar a um lugar escuro.
6005=Experimente esta Mac-10 nos alvos. O disparo alternativo é mais preciso. A maioria das armas de Blood II tem um modo de disparo alternativo.
6006=Aponte para o telefone e pressione a tecla de usar para atender. Você pode ativar muitos objetos em Blood II com essa tecla.
6007=Parece que esse é o beco que você procura! Vai ter que caprichar nos pulos para chegar lá em cima.
6008=O museu fica logo depois desta passagem, mas a prefeitura teve a gentileza de bloquear o caminho com caçambas. Vai precisar de alguma habilidade para passar.
6009=Gideon fugiu pela lavanderia Laundro-Hut. Pegue suas roupas sujas e desça!
6010=Encontre o caminho para a catedral. Cuidado com os capangas do Gideon e com coisas bem piores...
6011=Gideon está por aqui. A Cabal trancou bem este lugar, então cuidado com as medidas de segurança.
6012=A arma de singularidade de Gideon teve um efeito curioso. Em vez de acabar com você, trouxe Gabriel de volta. Gideon fugiu de novo, então não dá para perder tempo com velhos amigos.
6013=Dizem que há uma entrada subterrânea para uma instalação da Cabalco aqui perto. Você apostaria seu último cartucho que Gideon foi para lá.
6014=Abra caminho a tiros e encontre alguns botões para apertar!
6015=Agora é seguro passar rastejando pela esteira.
6016=Você precisa encontrar um jeito de chegar ao próximo andar.
6017=Parece que está na hora de procurar outro caminho!
6018=O cartão de acesso da CRU permite que você a acione.
6019=Deve haver um elevador expresso para o terraço aqui perto.
6020=Um dos guarda-costas de Gideon está por perto. Você vai ter que passar por ele se quiser acertar o chefão.
6021=Você nunca gostou de voar. Melhor chegar ao compartimento dianteiro antes que fique enjoado.
6022=Essa geringonça precisa voltar para o chão. O botão de autodestruição deve estar na ponte de comando.
6024=É, este lugar está precisando de um bom exorcismo! Talvez você também descubra o que Gideon está tramando.
6025=O trem está desgovernado. Assuma o controle.
6026=Encontre Gideon no esconderijo interditado da Cabal.
6027=Esta parte da cidade foi tomada e o metrô, a única saída, foi destruído. Use a entrada do porão no beco próximo para escapar.
6028=Armaram para você! A esta altura, vários esquadrões de fanáticos da Cabal devem estar indo atrás de você. Volte para a rua.
6029=A Cabal preparou uma emboscada neste lugar. Tente sair vivo.
6030=Transforme esse frigorífico em um matadouro!
6031=Ligar o triturador abriu a porta da esteira. Suba na esteira e atravesse o triturador para continuar.
6032=Volte a matar!
6033=O acesso ao metrô está bloqueado. Encontre o túnel do Expresso para o Centro.
6034=Encontre o terminal da Linha Azul para escapar desta parte da cidade.
6035=Encontre uma forma de entrar na estação.
6036=O acesso à Linha Azul está aberto. Encontre-o e dê o fora!
6037=Cuidado com o trem.
6038=Encontre um caminho alternativo para a estação do metrô.
6039=Este é o trem errado. Alcance o que está viajando logo à frente.
6040=Abra caminho pelos subterrâneos de Saqqara.
6041=O controle manual baixou a ponte. Agora encontre o caminho de volta até ela.
6042=Encontre uma maneira de baixar a ponte para atravessar. Cuidado, este lugar está cheio de vermes da Cabalco.
6043=Parece ser a única entrada para a sede da Cabal. Tente passar pelos portões de segurança sem causar carnificina demais.
6045=A porta à frente leva ao setor de Pesquisa e Desenvolvimento. Talvez o gerador de singularidade de que todos falam esteja lá. Encontre uma forma de desativar o sistema de segurança.
6046=Gideon só pode estar por aqui. Para ele, o lugar mais seguro é o mais longe de você. Vai sobrar sangue por todo lado. Espero que tenha trazido um balde e um esfregão.
6049=Os controles de segurança ficam no Setor 4 da usina. Você sabe o que fazer quando encontrá-los. Não se surpreenda se topar com as forças da Cabal por aqui.
6050=É hora de fazer sua própria pesquisa. Encontre o cientista maluco e talvez ele conte onde guarda o gerador de singularidade.
6051=Você está chegando ao topo do prédio. Gideon está ficando sem lugares para se esconder. Quem sabe ele não está debaixo de uma mesa? Exploda tudo para descobrir!
6052=Encontre Gideon e o portal para o Ancião.
