3000=~Hoje em dia nem dá para aguentar o metrô em paz e curtir a nova edição de Guns N’ Gibs. Primeiro aquele fiscal teve a cara de pau de confiscar seu cantil de Ol’ Red ’99. Depois o maquinista, um frouxo, teve de parar o trem por uma hora só porque o carrinho de um pirralho foi parar nos trilhos! Você já ia lá dizer umas boas para o sujeito quando reconheceu a voz dele... e percebeu que o seu dia estava prestes a ficar... interessante.
3001=~Doeu. Doeu pra valer. Da última vez que apagou, você tinha virado dezenove doses seguidas de JoJo’s Black Label #47. E mesmo naquela vez, você acha que teve mais a ver com estar perto da barraca de sorvete quando a explodiu. Fazer o quê. Aquele vendedor idiota não devia ter te irritado pondo granulado no seu Killer Kiddy Kone. Falando em granulado, talvez seja uma boa ideia encontrar Gideon e salpicar bastante dele na parede mais próxima!
3002=~Gideon escapou, mas continua fugindo. Logo você vai acertar as contas e apagar a luz dele. Enquanto isso, ele deixou uns amigos podres para você resolver. Esses pedaços de carne pestilenta até lembram os mortos-vivos que a Cabal fabricava antigamente... tirando aquelas costuras esquisitas no peito. Tem algo diferente nessas carcaças ambulantes. Mas, ora, pedaços são pedaços.
3003=~Bom, foi divertido... na maior parte. Infelizmente Gideon não estava a bordo, mas agora você tem uma boa ideia de onde ele está: na catedral! Pelo menos era o que dizia a placa lá fora: «30 DE OUTUBRO. GIDEON DEFENDE SUA TESE SOBRE O CRIME RITUAL DO PECADO E COMO SAIR IMPUNE. CHEGUE CEDO PARA O MINI-SIMPÓSIO SOBRE A MEIA-VIDA INCRIVELMENTE ONEROSA DE UMA VÁLVULA!» Ele não costuma decepcionar os fãs. Vá até lá e avise que você está na plateia.
3004=~O Museu de Antiguidades Lafayette da Cabalco anuncia uma nova exposição em destaque: Cultos e rituais. Faça uma visita guiada notável e instrutiva pela história de algumas das organizações fanáticas mais bizarras do mundo, da maldita Seita da Perereca Latidora aos temíveis Shriners de fez. Não deixe de sacrificar um momento do seu dia para conhecer a nossa nova exposição do Deus Sombrio animatrônico. Assustador!
3005=~Nossa, como você odeia esgotos! O cheiro até é agradável, mas atravessar aquela coisa toda boiando cansa. Quando finalmente governar o mundo, você vai declarar tudo uma zona sem saneamento. A vantagem de uma sociedade com esgoto a céu aberto é não ter que pôr conserto de canos no orçamento. A porcaria consegue chegar ao oceano sozinha. De todo modo, mesmo com o perfume local, dá para sentir o fedor nojento de Gideon. O covarde deve estar indo para um esconderijo da Cabal.
3006=~Com a humanidade se reproduzindo feito barata e a superlotação atormentando o planeta inteiro, as doenças viraram o nosso segundo maior negócio! Temos orgulho de anunciar que o Centro Cabalco de Gestão de Doenças tem quase o monopólio! Nossa instalação de ponta conta com amplos centros de pesquisa, dissecação e trauma. O CGD está na vanguarda de doenças, pestes e aflições de todos os tipos. Seja o vírus Ebola ou uma velha e deliciosa sífilis, o nosso lema é: invista e infeste. A Cabalco faz o resto!
3007=~Gideon está indo para um dos dirigíveis executivos atracados no alto do prédio. Está na cara que é hora de parar de mandar para dentro tanta carne chamuscada no Beefy Queen da esquina, porque você não tem preparo para encarar as escadas. Curiosamente, Gideon também anda devorando a parte dele no BQ e, por isso, precisou instalar elevadores expressos em todos os seus arranha-céus. É uma gentileza não ter de subir mais de mil andares a pé. Se ao menos desse para desligar aquela música infernal!
3008=~O dirigível modelo 1701D da Cabalco Industries é uma das melhores e, sem dúvida, mais versáteis aeronaves que já enfeitaram os nossos céus imundos. Versatilidade é a palavra-chave: o dirigível serve ao mesmo tempo para viagens de negócios com requinte e para fins militares. Para que fazer duas viagens? Faça um bombardeio em tapete naquele paisinho inconveniente do Terceiro Mundo enquanto seus clientes mais importantes voam com estilo! Sob a blindagem, o dirigível da Cabalco tem mesmo um coração de ouro. Assentos espaçosos, cabines relaxantes, comissárias bem armadas e os melhores amendoins dos céus! Voe Cabalco. Voe com estilo.
3009=~Estamos caindo! Assumam a posição de impacto! Por favor, ponham os encostos e as bandejas na posição vertical e travem tudo. Coloquem a cabeça entre as próprias pernas. Se estiverem fumando, apaguem-se. Tenham um bom dia e obrigado por voar com a Cabalco Air.
3010=~Você não vai achar freiras nesta catedral! A criatura à espreita que veio do além deformou o lugar para deixar tudo mais a seu gosto. Você até poderia morar aqui, se estivesse à venda por um preço razoável e não viesse com aqueles porteiros irritantes da Cabal. Paciência. É hora de limpar o lugar e descobrir para onde foi Gideon. Quem sabe ainda dê tempo de tirar uma bela impressão de um relevo de pedra para aquela parede vazia no seu closet de armas.
3011=~Você está entrando no Setor Industrial. Atenção, os níveis de ozônio estão no estágio três e o alerta de toxinas, no estágio quatro. Use proteção respiratória o tempo todo. É a oportunidade perfeita para experimentar o novo e melhorado Safe Sucks 2 da Cabalco! Proteção barata e fácil de usar para todas as ocasiões. Evite áreas de alto risco, como o lado de fora. Tenha uma visita segura e um bom dia.
3012=~Os trens já foram bem mais elegantes. Hoje em dia, tudo o que dá para fazer é tentar não morrer num deles. Pouca coisa alivia a tensão melhor do que explodir os adversários em, er... pedacinhos. Estes esconderijos da Cabal são o auge do luxo: o fedor, a mobília, os ratos, o ambiente e os bêbados. E, falando em compromissos, Gideon deve estar por aqui. Esse encontro tem tudo para ser mais divertido que usar bêbados como alvo. Iupiiiiii!
3013=~Está claro que os cidadãos de New Town têm dois problemas graves... comem demais e não seguram nada. A combinação vai ser letal... para eles. Pelo cheiro, os canos deles estão precisando de uma boa limpeza. Aí entra você, semideus imortal e lavagem intestinal ambulante. É claro que Gideon é o culpado por você ter descido tão baixo. Na merda até os tornozelos, literalmente. Hmm. Dá para acrescentar isso à conta dele e cobrar em pedaços.
3014=~Com fome de mais carne? Claro que sim. Todos estamos! Na Cabalco entendemos de carne, então criamos uma nova linha de produtos para atender a todas as suas necessidades carnívoras! Carne em lata! Barata e deliciosa! Nos seus sabores tradicionais preferidos: miúdos, boi, ave, porco, cabra e peixe de fundo! Ou experimente as novidades! Acabamos de lançar uma carne de massa azeda com sabor intenso de fermento, uma fina carne de ameixa fermentada e uma carne de fungo só um pouquinho alucinógena! Nas fábricas de carnes da Cabalco, seguimos criando a comida do futuro! Melhor ainda, agora mais de 82% dos nossos produtos estão livres de E. coli, em média!
3015=~Se você está feliz e sabe disso, estoure um cérebro... Se você está feliz e sabe disso, corte uma veia... Se você está feliz e sabe disso, as cabeças quicando vão mostrar... Nada como amar o próprio trabalho. Outra estação que nem merece menção? Bem, pelo menos é mais bonita que a última. Hora de pôr o velho dedo do gatilho para trabalhar. Você com certeza veio do lado errado desses trilhos e, como sempre, a luz no fim do túnel bem que pode ser um trem.
3016=~Ha! Aquele desgraçado do Gideon achou que ia te despistar com o velho truque da troca. Até parece, engomadinho! Quando você pegar o sujeito, ele vai conhecer o seu jeito de trocar as coisas. Vejamos, você pode começar pegando a cabeça dele e dando a ela uma vista um pouco mais voltada para dentro. Como ele está com a cabeça enfiada lá há tanto tempo, pode apostar que a perspectiva vai ser familiar. Para a brecha, e tudo mais. Chega de pensamentos carinhosos. Tem trabalho a fazer e, desta vez, a Linha Azul vai ficar vermelha. Vermelho-sangue.
3017=~Cansado de jogar pelo ralo do aluguel o dinheiro que você ganhou com tanto suor? Claro que sim! Por isso, os seus amigos da Cabalco Construção e Imóveis acabaram de concluir um novo e adorável loteamento. Sabemos que terreno é caro e raro, então jogamos uma camada de terra nova por cima daquele velho e nojento poço de lixo radioativo e tóxico em Love Canal! Uma casa nova da Cabalco nunca foi tão barata! E, se está pensando em ter família, compre uma grande! Por favor, ignore os boatos sobre infertilidade, mal-estar geral, vômitos constantes, o onipresente «fruto do amor de três cabeças» ou qualquer outra bobagem do tipo. Na Cabalco a gente se importa e os preços das casas são mais do que justos!
3018=~Nada impressionado com o histórico de segurança do transporte local? Só tem uma coisa a fazer! Destrua tudo! Isso mesmo, bota essa porcaria abaixo. Passagem? Nem a pau! A única passagem de que você precisa é a sua espingarda. E essa passagem vai tocar o terror nos adversários. Ter prazer no próprio trabalho é sem dúvida uma vantagem. Talvez seja prudente sair um instante para respirar um pouco de ar viciado desta vez. As duas últimas viagens foram apertadas demais.
3019=~Agora sim. Até parece sua casa. Dá vontade de deitar e dormir para sempre. Ser imortal não é tudo isso que dizem. Dá muito mais trabalho do que se esperava. Pelo menos você ajuda os outros a conseguir o que nunca vai ter. Melhor ainda, pode oferecer uma ajuda mais rápida do que eles seriam capazes de imaginar. Esse é você, sempre cheio de bondade e pensamentos caridosos. Hora de apressar a passagem deles. Saiam, saiam de onde estiverem... vocês estão prestes a ser, cof, escolhidos.
3020=~Você está entrando em New Town, lar da gigantesca sede corporativa da Cabalco Industries! Motins e levantes civis já quase não dão trabalho! À beira do belo rio em chamas de White Rock, New Town é o retrato quase perfeito de uma cidade levemente oprimida por uma megacorporação gigante e amoral! Claro, admitimos que ainda rolam uns sacrifícios rituais e uns sequestros noturnos. E sim, às vezes alguém desaparece sem deixar notícias. Mas as ruas costumam ser seguras e limpas, e nossa economia está em alta, com só uns pequenos soluços. Somos New Town! A Cabalco é nossa amiga!
3021=~ Preocupado com o futuro? Os outros alunos te aterrorizavam no ensino médio? Precisa de uma carreira que seja um desafio de verdade? Então entre para a Divisão de Segurança da Cabalco. Você não sabe o que é um dia difícil... até passar o dia pelado e suando numa caixinha de metal escura e quase sem ar, com só um fiapo de sanidade e umas duas dúzias de ratos famintos de companhia! Mas chega de falar de mim! Nosso regime intenso de humilhações e surras dentro de um saco vai fazer você se sentir um novo homem, ou uma nova mulher! Ao fim do programa de 12 etapas, você ganha um canhão e o poder de decidir todo dia quem vive e quem morre! Aqueles desgraçados de mente estreita da escola vão ver só!
3022=~ Você chegou ao Templo Supremo ultrassecreto da Cabalco. Não estamos aqui no momento, mas fique à vontade para deixar sangue na porta, de preferência humano ou de cabra. Em caso de emergência, acenda 69 velas brancas, risque um pentagrama grande no chão de concreto com as unhas e dance nu dentro dele, depois de se pintar com o sangue dos dedos rasgados e reduzidos a tocos, entoando cânticos ao nosso deus sombrio. Um insidioso servo do submundo vai atender você em breve. Obrigado pela paciência!
3023=~Bem-vindo ao Posto de Controle Gnarly. Ha. A segurança por aqui parece um pouco... fanática demais. Deve haver outra entrada para a sede da Cabalco. Enquanto isso, talvez seja uma boa fazer uma faxina e derrubar alguns adversários indignos. Às vezes é preciso fazer um pouco de bagunça para limpar um lugar. Ainda bem que você não precisa tirar aquelas manchas de massa cinzenta das paredes. Depois que secam, devem dar um trabalhão. Hora de fazer seu próprio passe de «acesso ilimitado».
3024=~Procurando trabalho? Na Cabalco sempre cabe mais um corpo! Estamos sempre contratando, com um monte de vantagens. Você vai trabalhar num vasto arranha-céu novinho, com máquinas de refrigerante e café em cada andar, e nosso, cof, plano médico é de outro mundo. Na Cabalco, mesmo começando no último degrau da escada, prometemos que você logo terá um subordinado! O nosso, er, Departamento de Recursos Humanos não exige aquelas etapas chatas das outras empresas. Sem experiência? Sem problema! Nem currículo pedimos, que dirá formulário. É só aparecer e você é nosso... quer dizer, hum, está contratado. A Cabalco oferece oportunidades desiguais.
3025=É preciso dar o braço a torcer para a Cabalco. O projetista caprichou nesse imóvel. Tem escadarias amplas, arte esquisita mas bonita, baias de escritório muito divertidas e mais coisas para explodir do que dá para apontar com uma espingarda. No geral, um lugar legal. Um pouco de fogo cairia bem. Mas os cultistas, os Drudge, os Shikari e os fanáticos vão ter de ir embora. Direto para o inferno. Não passe pela casa de partida. Não receba 200 dólares. O Behemoth parece até fofinho e poderia ser uma boa adição à sua coleção de bichos de estimação. Pena que não aprendeu onde fazer as necessidades.
3026=~Hora de desligar esses desgraçados. Puxe a tomada. Corte a energia. Chega de corrente alternada! E de contínua também, porra! Bem-vindo à usina. Você é o apagão em pessoa. A empolgação aqui até crepita. Crepita tanto que você pode acabar frito num instante, bem crocante. E depois das últimas experiências com trens, você não tem o menor interesse em virar condutor. Hora de fazer o que sabe de melhor... quebrar coisas. E que jeito melhor de começar do que com uns fanáticos? Ao trabalho, ó disjuntor.
3027=~Será que Caleb fecha mesmo as fendas? Ophelia ganha seus dois minutos de presente? Que diabos aconteceu com Gabriel... quer dizer, Gabriella? E se Ishmael não conseguir voltar para casa? E onde ele fez aquelas tatuagens?|~Não perca o próximo episódio de «Arde, arde!». Essas respostas e mais um monte estão chegando... prometemos. Enquanto isso, entre num tremendo BLOODBATH!
3028=~Ah, a ciência! Você se lembra com carinho da primeira vez que pôde dissecar alguma coisa. Tremia de empolgação ao começar a esfolar o cadáver fétido. Os músculos dançaram quando você aplicou só um tiquinho de tensão elétrica, e que surpresa quando abriu as tripas sem querer! Que barato! Bom, chega de sonhar acordado. Hora de se mexer e encontrar a entrada de Pesquisa e Desenvolvimento da Cabalco.
3029=~Nada como uma tentativa muito hostil de tomar o controle de uma empresa para aguçar os sentidos! O jogo de caça e caçador sempre teve seu encanto. Está começando a ficar divertido. Logo Gideon vai ficar sem lugar para se esconder. Hora de encurralar o rato, por assim dizer. Tem um pouco de faxina pela frente. Limpar escritórios nunca foi tão divertido! Onde mesmo ficava aquele elevador para o terraço?
3030=~Lá está o alvo de argila, Gideon! Até que soa bem: Gideon, o pombo. Uhuuu! Tiro ao prato é um dos seus jogos favoritos. Vai ser um estouro! Para ele. Puxa! Pá. Puxa! Pá. Puxa! Chega de correr, Gideon. Seu voo acabou, otário. Sua sorte acabou também.
3031=~É uma batalha até a morte. De preferência, a de outra pessoa. Ninguém mais puxa os fios do fantoche Gideon, e chegou a hora de o mestre dos fantoches pagar pelo que fez. Ancião, está ouvindo? Então escute só...
3032=~Tem alguma coisa diferente, mas você não consegue apontar o quê com o dedo do gatilho. Seus velhos amigos estão com cara de abatidos, talvez até doentes. Que diabos deu neles para se meterem naqueles caixões? Hmm. Fazer o quê. Nada que um pouco de chumbo extra não cure... chumbo na cabeça e todo mundo para a cama. Boa noite, companheiros Escolhidos. Sonhos venenosos.
3033=~Nas palavras de um poeta há muito esquecido e nem um pouco prolixo: «Mate isso!»
