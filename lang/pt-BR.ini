authored.1655b5465594c073.title=Objetivo 1
authored.1655b5465594c073.text=Ophelia desapareceu numa fenda com Gideon. Talvez estejam por perto, mas não dá para ter certeza. Só não deixe que façam de você o próximo sacrifício.
